<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Calisthenics Tracker</title>
<style>
  :root {
    --bg: #0b0b0d; --surface: #1a1a1c; --surfaceRaised: #242426;
    --chalk: #F5F3EF; --chalkDim: #B8B2A6; --rust: #F2711C; --rustDim: #9a4a10;
    --pink: #EC4899; --purple: #A855F7;
    --steel: #5B7B8C; --green: #5C7A4A; --amber: #B08838; --muted: #6a655c; --line: #2e2c2a;
    --gradient: linear-gradient(90deg, var(--rust), var(--pink), var(--purple));
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--chalk); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px 16px 40px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 9px 1px; border-radius: 7px; border: none; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1px; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gradient); color: var(--bg); font-weight: 900; }
  h1 { font-size: 26px; font-weight: 900; margin: 0; font-family: 'Arial Black', system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card.amber { border-color: var(--amber); }
  .card.steel { border-color: var(--steel); }
  .section-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .pill-row { display: flex; gap: 8px; }
  .pill-row.compact { gap: 5px; }
  .pill { flex: 1; padding: 10px 0; border-radius: 7px; border: 1px solid var(--line); background: transparent;
    color: var(--chalkDim); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill-row.compact .pill { padding: 9px 2px; font-size: 11.5px; }
  .pill.active { background: var(--steel); color: var(--bg); border-color: var(--steel); }
  .pill.active.rust { background: var(--rust); border-color: var(--rust); }
  .pill.active.green { background: var(--green); border-color: var(--green); }
  .pill.active.amber { background: var(--amber); border-color: var(--amber); }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 7px;
    color: var(--chalk); font-size: 16px; padding: 10px 12px; box-sizing: border-box;
  }
  .theme-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .theme-card.on { border-color: var(--rustDim); }
  .theme-head { width: 100%; background: none; border: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 0; text-align: left; }
  .theme-label { font-weight: 800; font-size: 15px; letter-spacing: .3px; text-transform: uppercase; color: var(--chalkDim); }
  .theme-card.on .theme-label { color: var(--chalk); }
  .theme-hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .checkbox { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.on { border-color: var(--rust); background: var(--rust); color: var(--chalk); font-weight: 900; }
  .theme-body { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .rpe-ladder { display: flex; align-items: flex-end; gap: 4px; height: 52px; }
  .rpe-bar { flex: 1; border: none; border-radius: 3px; cursor: pointer; background: var(--surfaceRaised); padding: 0; }
  .rpe-bar.on { background: linear-gradient(180deg, var(--rust), var(--rustDim)); }
  .rpe-value { color: var(--rust); font-size: 18px; font-weight: 900; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
  .stat { flex: 1; min-width: 100px; }
  .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .stat-value { font-size: 22px; font-weight: 900; line-height: 1.3; }
  .history-item { display: block; width: 100%; text-align: left; background: var(--surface); border: none; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .badge { font-size: 11px; color: var(--chalkDim); background: var(--surfaceRaised); border-radius: 5px; padding: 3px 8px; margin-right: 4px; display: inline-block; margin-bottom: 4px; }
  .btn-outline { width: 100%; padding: 12px 0; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--chalkDim);
    font-size: 13px; font-weight: 700; letter-spacing: .3px; cursor: pointer; text-transform: uppercase; margin-top: 12px; }
  .error-banner { background: var(--rustDim); border: 1px solid var(--rust); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; color: var(--chalk); font-size: 12px; line-height: 1.4; }
  .status { color: var(--rust); font-size: 12px; font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-bottom: 6px; }
  .bar { flex: 1; background: var(--steel); border-radius: 2px; min-height: 2px; }
  .bar.max { background: var(--rust); }
  .bars-axis { display: flex; gap: 4px; }
  .bars-axis span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">
    <span style="color:var(--chalkDim)">MOVEMENT </span><span style="background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent">PRACTICE ✦ SUIVI</span>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="seance">Séance</button>
    <button class="tab" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="sommeil">Sommeil</button>
    <button class="tab" data-tab="migraine">Migraine</button>
  </div>
  <div id="app"></div>
</div>

<script>
// ---------------- Supabase ----------------
const SUPABASE_URL = "https://zwltvhjitrvlrhbivdfm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bHR2aGppdHJ2bHJoYml2ZGZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTMxMjcsImV4cCI6MjEwMjg4OTEyN30.hTD6h2r9dKdKaJ15vcFU6eN8WScA1rr_nT2dNByT6co";

async function sb(path, options) {
  options = options || {};
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, options, {
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, options.headers || {})
  }));
  if (!res.ok) {
    const text = await res.text().catch(function(){ return ""; });
    throw new Error("Supabase " + res.status + ": " + text);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------------- Constantes ----------------
const THEMES = [
  { id: "tirage", label: "Tirage", hint: "traction, rowing", neural: 1.05 },
  { id: "poussee", label: "Poussée", hint: "push, dips, pompes", neural: 1.05 },
  { id: "complet", label: "Mouvement complet", hint: "muscle-up, skin the cat", neural: 1.2 },
  { id: "handstand", label: "Handstand", hint: "ATR, appui tendu, presses", neural: 1.4 },
  { id: "arm_balance", label: "Arm Balance", hint: "crow, planche, figures d'appui", neural: 1.35 },
  { id: "locomotion", label: "Locomotion", hint: "quadrupédie, mains, arm balance, sol complexe", neural: 1.30 },
  { id: "altinha", label: "Altinha", hint: "jonglage, réactivité, coordination", neural: 1.15 },
  { id: "bas", label: "Bas du corps", hint: "jambes, mobilité", neural: 1.0 }
];
const MODALITES = [{ id: "libre", label: "Libre" }, { id: "charge", label: "Avec charge" }];
const GOALS = [{ id: "force", label: "Force" }, { id: "endurance_force", label: "End. force" }, { id: "endurance", label: "Endurance" }];
const GOAL_FACTORS = { force: 1.0, endurance_force: 1.15, endurance: 1.25 };
const DURATIONS = [{ id: "30", label: "30 min", minutes: 30 }, { id: "45", label: "45 min", minutes: 45 }, { id: "60", label: "1h", minutes: 60 }, { id: "plus", label: "Plus", minutes: null }];
const ACHIEVEMENTS = [{ id: "atteint", label: "Atteint", color: "green" }, { id: "moyen", label: "Moyennement", color: "amber" }, { id: "pas", label: "Pas atteint", color: "rust" }];
const WARMUP_MINUTES = 22;
const DISCIPLINE_TO_THEMES = {
  Handstand: ["handstand"], "Mobilité": ["bas"], Locomotion: ["locomotion"],
  "Arm Balance": ["arm_balance"], Altinha: ["altinha"], Calisthenics: ["altinha"]
};
const CLASS_SCHEDULE = [
  { discipline: "Altinha", jour_semaine: 1, semaine: "B", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Locomotion", jour_semaine: 1, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Calisthenics", jour_semaine: 2, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Calisthenics", jour_semaine: 2, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Handstand", jour_semaine: 2, semaine: "B", heure_debut: "19:30", heure_fin: "20:30" },
  { discipline: "Handstand", jour_semaine: 2, semaine: "A", heure_debut: "19:30", heure_fin: "20:30" },
  { discipline: "Mobilité", jour_semaine: 3, semaine: "A", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Locomotion", jour_semaine: 3, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Arm Balance", jour_semaine: 3, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Mobilité", jour_semaine: 4, semaine: "B", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Handstand", jour_semaine: 4, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Handstand", jour_semaine: 4, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Calisthenics", jour_semaine: 5, semaine: "A", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Locomotion", jour_semaine: 5, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" }
].map(function(c){ c.actif = true; return c; });
const SCHEDULE_REFERENCE = { date_lundi_reference: "2026-08-17", semaine_ce_lundi: "B" };
const SCHEDULE_VACATIONS = [{ date_debut: "2026-08-06", date_fin: "2026-08-16" }, { date_debut: "2026-10-03", date_fin: "2026-10-11" }];

// ---------------- Utilitaires ----------------
function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
}
function avgOf(arr) { return arr.length ? arr.reduce(function(s,v){return s+v;},0) / arr.length : null; }
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function getWeekLetter(dateStr, ref) {
  const refMonday = new Date(ref.date_lundi_reference + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  const day = target.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const targetMonday = new Date(target);
  targetMonday.setDate(target.getDate() + diffToMonday);
  const weeksDiff = Math.round((targetMonday - refMonday) / (7 * 86400000));
  const isRefWeek = weeksDiff % 2 === 0;
  return isRefWeek ? ref.semaine_ce_lundi : (ref.semaine_ce_lundi === "A" ? "B" : "A");
}
function isInVacation(dateStr, vacations) { return vacations.some(function(v){ return dateStr >= v.date_debut && dateStr <= v.date_fin; }); }
function getScheduledClasses(dateStr) {
  if (isInVacation(dateStr, SCHEDULE_VACATIONS)) return [];
  const jsDay = new Date(dateStr + "T00:00:00").getDay();
  const week = getWeekLetter(dateStr, SCHEDULE_REFERENCE);
  return CLASS_SCHEDULE.filter(function(c){ return c.actif && c.jour_semaine === jsDay && c.semaine === week; });
}
function deriveDurationPreset(minutes) {
  if (!minutes) return null;
  const match = DURATIONS.find(function(d){ return d.minutes === Number(minutes); });
  return match ? match.id : "plus";
}
function sessionFromSchedule(classes) {
  if (!classes || classes.length === 0) return null;
  let totalMinutes = WARMUP_MINUTES;
  classes.forEach(function(c) {
    const h1 = c.heure_debut.split(":").map(Number), h2 = c.heure_fin.split(":").map(Number);
    totalMinutes += (h2[0]*60+h2[1]) - (h1[0]*60+h1[1]);
  });
  const entries = {};
  classes.forEach(function(c) {
    (DISCIPLINE_TO_THEMES[c.discipline] || []).forEach(function(id) { entries[id] = { modalite: "libre", rpe: 0 }; });
  });
  return { entries: entries, goal: null, duration: totalMinutes, durationPreset: deriveDurationPreset(totalMinutes),
    achievement: null, intensity: 0, discipline: classes.map(function(c){return c.discipline;}).join(" + ") };
}
function emptySession() { return { entries: {}, goal: null, durationPreset: null, duration: "", achievement: null, intensity: 0, discipline: null }; }

function computeLoad(s) {
  if (!s) return { sessionLoad: null, correctedLoad: null };
  const sessionLoad = s.intensity > 0 && s.duration ? Math.round(s.intensity * Number(s.duration)) : null;
  const active = Object.entries(s.entries || {}).filter(function(e){ return e[1].rpe > 0; });
  const totalRpe = active.reduce(function(sum,e){ return sum + e[1].rpe; }, 0);
  if (active.length === 0) return { sessionLoad: sessionLoad, correctedLoad: sessionLoad };
  const neuralFactor = active.reduce(function(sum,e){
    const t = THEMES.find(function(th){ return th.id === e[0]; });
    return sum + (t ? t.neural : 1) * e[1].rpe;
  }, 0) / totalRpe;
  const typeFactor = active.reduce(function(sum,e){
    const ty = e[1].type || s.goal;
    return sum + (GOAL_FACTORS[ty] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const correctedLoad = sessionLoad !== null ? Math.round(sessionLoad * neuralFactor * typeFactor) : null;
  return { sessionLoad: sessionLoad, correctedLoad: correctedLoad };
}

// ---------------- Accès données ----------------
function rowToSession(row) {
  if (!row) return emptySession();
  return { entries: row.entries || {}, goal: row.goal || null, duration: row.duration_minutes || "",
    durationPreset: deriveDurationPreset(row.duration_minutes), achievement: row.achievement || null,
    intensity: row.intensity || 0, discipline: row.discipline || null };
}
function sessionToRow(dateStr, s) {
  const load = computeLoad(s);
  return { session_date: dateStr, goal: s.goal, duration_minutes: s.duration ? Number(s.duration) : null,
    achievement: s.achievement, intensity: s.intensity || null, entries: s.entries || {}, discipline: s.discipline || null,
    session_load: load.sessionLoad, corrected_load: load.correctedLoad, updated_at: new Date().toISOString() };
}
async function loadSession(dateStr) {
  const rows = await sb("sessions?session_date=eq." + dateStr + "&select=*");
  return rows && rows[0] ? rowToSession(rows[0]) : null;
}
async function saveSession(dateStr, s) {
  await sb("sessions?on_conflict=session_date", {
    method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(sessionToRow(dateStr, s))
  });
}
async function listSessions(limit) {
  const rows = await sb("sessions?select=*&order=session_date.desc&limit=" + (limit || 90));
  return (rows || []).map(function(r){ return Object.assign({ date: r.session_date }, rowToSession(r), computeLoad(rowToSession(r))); });
}
async function getWearableForDate(dateStr) {
  const rows = await sb("wearable_daily?day=eq." + dateStr + "&select=*");
  return rows && rows[0] ? rows[0] : null;
}
async function listWearable(limit) {
  return await sb("wearable_daily?select=*&order=day.desc&limit=" + (limit || 40)) || [];
}

// ---------------- État global ----------------
let currentTab = "seance";
let currentDate = todayISO();

// ---------------- État séance (séparé du réseau pour un rendu instantané) ----------------
let seance = { session: emptySession(), history: [], classes: [], wearable: null, workout: null, error: "", isNew: true };
let historyOpen = false;

async function getWorkoutForDate(dateStr) {
  const rows = await sb("workout_sessions?day=eq." + dateStr + "&select=*");
  if (!rows || !rows.length) return null;
  const zones = ["zone_leger_min", "zone_intensif_min", "zone_aerobique_min", "zone_anaerobie_min", "zone_vo2max_min"];
  const agg = { duration_min: rows.reduce(function(s, r) { return s + r.duration_min; }, 0), count: rows.length };
  zones.forEach(function(z) { agg[z] = rows.reduce(function(s, r) { return s + Number(r[z] || 0); }, 0); });
  const teA = rows.map(function(r){ return r.training_effect_aerobic; }).filter(function(v){ return v != null; });
  const teN = rows.map(function(r){ return r.training_effect_anaerobic; }).filter(function(v){ return v != null; });
  agg.te_aerobic = teA.length ? Math.max.apply(null, teA) : null;
  agg.te_anaerobic = teN.length ? Math.max.apply(null, teN) : null;
  agg.calories = rows.reduce(function(s, r){ return s + (Number(r.calories)||0); }, 0);
  agg.official = rows.some(function(r){ return r.source === "zepp_official"; });
  return agg;
}

function teLabel(v) {
  if (v == null) return null;
  if (v < 1) return "Minime";
  if (v < 2) return "Léger";
  if (v < 3) return "Modéré";
  if (v < 4) return "Bien";
  return "Élevé";
}

async function loadSeance() {
  historyOpen = false;
  seance.error = "";
  seance.wearable = null;
  seance.workout = null;
  try {
    seance.classes = getScheduledClasses(currentDate);
    const existing = await loadSession(currentDate);
    seance.isNew = !existing;
    seance.session = existing || sessionFromSchedule(seance.classes) || emptySession();
    const all = await listSessions(15);
    seance.history = all.filter(function(h) { return h.date !== currentDate; }).slice(0, 14);
  } catch (e) {
    seance.error = e.message;
    seance.session = emptySession();
  }
  drawSeance();

  getWearableForDate(currentDate).then(function(w) { seance.wearable = w; drawSeance(); }).catch(function(){});
  getWorkoutForDate(currentDate).then(function(w) {
    seance.workout = w;
    if (w && seance.isNew && !seance.session.duration) {
      seance.session.duration = w.duration_min;
      seance.session.durationPreset = deriveDurationPreset(w.duration_min);
    }
    drawSeance();
  }).catch(function(){});
}

function workoutCardHtml(w) {
  const zones = [
    ["Léger", w.zone_leger_min, "#8b6fb0"],
    ["Intensif", w.zone_intensif_min, "var(--steel)"],
    ["Aérobique", w.zone_aerobique_min, "var(--green)"],
    ["Anaérobie", w.zone_anaerobie_min, "var(--amber)"],
    ["VO2 max", w.zone_vo2max_min, "var(--rust)"],
  ];
  const total = zones.reduce(function(s, z) { return s + z[1]; }, 0) || 1;
  let html = '<div class="card steel" id="workout-slot"><div class="section-label">Zones cardiaques' + (w.official ? " (officiel Zepp)" : " (montre)") + '</div>';
  html += '<div class="muted" style="margin-bottom:10px">Durée détectée : ' + Math.round(w.duration_min) + " min" + (w.count > 1 ? " sur " + w.count + " séances" : "") + (w.calories ? " · " + w.calories + " kcal" : "") + "</div>";
  zones.forEach(function(z) {
    const label = z[0], min = z[1], color = z[2];
    if (min <= 0) return;
    const pct = Math.round((min / total) * 100);
    html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + label + '</span><span class="muted">' + Math.round(min) + ' min</span></div>';
    html += '<div style="height:6px;background:var(--surfaceRaised);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + color + '"></div></div></div>';
  });
  if (w.te_aerobic != null || w.te_anaerobic != null) {
    html += '<div style="display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">';
    if (w.te_aerobic != null) html += '<div style="flex:1"><div class="muted" style="font-size:10px;text-transform:uppercase">Effet aérobie</div><div style="font-size:18px;font-weight:900">' + w.te_aerobic.toFixed(1) + '</div><div style="font-size:11px;color:var(--green)">' + teLabel(w.te_aerobic) + "</div></div>";
    if (w.te_anaerobic != null) html += '<div style="flex:1"><div class="muted" style="font-size:10px;text-transform:uppercase">Effet anaérobie</div><div style="font-size:18px;font-weight:900">' + w.te_anaerobic.toFixed(1) + '</div><div style="font-size:11px;color:var(--amber)">' + teLabel(w.te_anaerobic) + "</div></div>";
    html += "</div>";
  }
  html += "</div>";
  return html;
}

// ---------------- Rendu : Séance (synchrone, ne touche jamais le réseau) ----------------
function drawSeance() {
  const app = document.getElementById("app");
  const scrollY = window.scrollY;
  const session = seance.session;
  const classes = seance.classes;
  let html = "";
  if (seance.error) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(seance.error) + "</div>";

  html += '<div style="margin-bottom:20px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
  html += '<span class="muted" style="text-transform:uppercase;letter-spacing:1.5px">' + formatDateLabel(currentDate) + "</span>";
  if (currentDate !== todayISO()) html += '<button id="back-today" style="background:none;border:none;color:var(--steel);font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer">Revenir à aujourd\'hui</button>';
  html += "</div>";
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">';
  html += "<h1>" + (currentDate === todayISO() ? "Séance du jour" : "Modifier la séance") + "</h1>";
  html += '<input type="date" id="date-picker" value="' + currentDate + '" max="' + todayISO() + '" style="width:auto;font-size:16px" />';
  html += "</div></div>";

  if (classes.length) {
    html += '<div class="card steel"><div class="section-label">Cours prévu ce jour</div>';
    classes.forEach(function(c, i) {
      const suggested = DISCIPLINE_TO_THEMES[c.discipline];
      html += '<div style="margin-bottom:' + (i < classes.length - 1 ? 10 : 0) + 'px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center">';
      html += '<span style="font-weight:800;font-size:14px">' + esc(c.discipline) + "</span>";
      html += '<span class="muted">' + c.heure_debut.slice(0, 5) + "–" + c.heure_fin.slice(0, 5) + "</span></div>";
      if (suggested) {
        const labels = THEMES.filter(function(t) { return suggested.indexOf(t.id) !== -1; }).map(function(t) { return t.label; }).join(", ");
        html += '<button class="apply-schedule-theme" data-themes="' + suggested.join(",") + '" style="margin-top:6px;background:none;border:1px dashed var(--steel);border-radius:6px;color:var(--steel);font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer">Cocher ' + esc(labels) + " →</button>";
      } else {
        html += '<div class="muted" style="font-size:11px;margin-top:2px">Pas d\'équivalent direct — à sélectionner manuellement.</div>';
      }
      html += "</div>";
    });
    html += "</div>";
  }

  if (seance.wearable) html += wearableCardHtml(seance.wearable);
  if (seance.workout) html += workoutCardHtml(seance.workout);

  html += '<div class="card">';
  html += '<div class="section-label">Discipline</div>';
  html += '<input type="text" id="discipline-input" placeholder="ex. Calisthenics, session perso…" value="' + esc(session.discipline || "") + '" style="margin-bottom:16px" />';
  html += '<div class="section-label">Objectif de séance</div><div class="pill-row" id="goal-row" style="margin-bottom:16px">';
  GOALS.forEach(function(g) { html += pillHtml(g, session.goal === g.id, "goal"); });
  html += "</div>";
  html += '<div class="section-label">Durée' + (seance.workout ? ' <span class="muted" style="text-transform:none">(détectée par la montre, modifiable)</span>' : "") + '</div><div class="pill-row" id="duration-row" style="margin-bottom:' + (session.durationPreset === "plus" ? 10 : 16) + 'px">';
  DURATIONS.forEach(function(d) { html += pillHtml(d, session.durationPreset === d.id, "duration"); });
  html += "</div>";
  if (session.durationPreset === "plus") {
    html += '<input type="number" id="duration-custom" placeholder="Durée exacte en minutes" value="' + esc(session.duration) + '" style="margin-bottom:16px" />';
  }
  html += '<div class="section-label">Objectif atteint ?</div><div class="pill-row" id="achievement-row" style="margin-bottom:16px">';
  ACHIEVEMENTS.forEach(function(a) { html += pillHtml(a, session.achievement === a.id, "achievement"); });
  html += "</div>";
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">';
  html += '<span class="section-label" style="margin:0">Intensité globale ressentie</span><span class="rpe-value">' + (session.intensity > 0 ? session.intensity : "–") + "</span></div>";
  html += rpeLadderHtml("global", session.intensity || 0);
  const load = computeLoad(session);
  if (load.sessionLoad !== null) {
    html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">';
    html += '<span style="font-size:12px;color:var(--chalkDim)">Charge de séance</span><span style="font-size:20px;font-weight:900">' + load.sessionLoad + "</span></div>";
    if (load.correctedLoad !== load.sessionLoad) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">';
      html += '<span style="font-size:12px;color:var(--chalkDim)">Charge corrigée</span><span style="font-size:20px;font-weight:900;color:var(--rust)">' + load.correctedLoad + "</span></div>";
    }
  }
  html += "</div>";

  THEMES.forEach(function(t) { html += themeCardHtml(t, session.entries[t.id]); });

  const activeCount = Object.keys(session.entries).length;
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px;min-height:20px">';
  html += '<span class="muted">' + (activeCount > 0 ? activeCount + " thème(s) sélectionné(s)" : "Coche les thèmes travaillés") + '</span><span class="status" id="save-status"></span></div>';

  html += '<button class="btn-outline" id="toggle-history">Voir l\'historique (' + seance.history.length + ")</button>";
  html += '<div id="history-list" style="display:' + (historyOpen ? "block" : "none") + ';margin-top:14px">';
  if (seance.history.length === 0) html += '<div class="muted" style="text-align:center;padding:16px 0">Aucune séance précédente.</div>';
  seance.history.forEach(function(h) {
    const ach = ACHIEVEMENTS.find(function(a) { return a.id === h.achievement; });
    html += '<button class="history-item" data-date="' + h.date + '"><div style="font-weight:700;font-size:13px;margin-bottom:6px">' + formatDateLabel(h.date) + "</div>";
    Object.keys(h.entries).forEach(function(tid) {
      const th = THEMES.find(function(t) { return t.id === tid; });
      const d = h.entries[tid];
      html += '<span class="badge">' + (th ? th.label : tid) + " · " + (d.modalite === "charge" ? "charge" : "libre") + " · RPE " + (d.rpe || "–") + "</span>";
    });
    if (ach) html += '<span class="badge" style="background:var(--' + ach.color + ');color:var(--bg);font-weight:700">' + ach.label + "</span>";
    html += "</button>";
  });
  html += "</div>";

  app.innerHTML = html;
  wireSeanceEvents();
  window.scrollTo(0, scrollY);
}

function pillHtml(opt, active, group) {
  const colorClass = opt.color ? " " + opt.color : (group === "duration" || group === "modalite" ? "" : " rust");
  return '<button class="pill' + (active ? " active" + colorClass : "") + '" data-group="' + group + '" data-id="' + opt.id + '">' + esc(opt.label) + "</button>";
}
function rpeLadderHtml(scope, value) {
  let html = '<div class="rpe-ladder" data-scope="' + scope + '">';
  for (let n = 1; n <= 10; n++) {
    const h = 14 + n * 3.6;
    html += '<button class="rpe-bar' + (value >= n ? " on" : "") + '" data-n="' + n + '" style="height:' + h + 'px"></button>';
  }
  return html + "</div>";
}
function wearableCardHtml(w) {
  let html = '<div class="card steel" id="wearable-slot"><div class="section-label">Strap — ' + formatDateLabel(w.day || currentDate) + '</div><div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--chalkDim)">';
  if (w.hr_resting != null) html += "<span>FC repos <b style='color:var(--chalk)'>" + w.hr_resting + "</b></span>";
  if (w.hrv_avg != null) html += "<span>VFC <b style='color:var(--chalk)'>" + Math.round(w.hrv_avg) + " ms</b></span>";
  if (w.hr_avg != null) html += "<span>FC activité <b style='color:var(--chalk)'>" + Math.round(w.hr_avg) + "</b></span>";
  if (w.stress_avg != null) html += "<span>Stress moy. <b style='color:var(--chalk)'>" + Math.round(w.stress_avg) + "</b></span>";
  if (w.steps_total != null) html += "<span>Pas <b style='color:var(--chalk)'>" + w.steps_total + "</b></span>";
  return html + "</div></div>";
}
function themeCardHtml(theme, data) {
  const on = !!data;
  let html = '<div class="theme-card' + (on ? " on" : "") + '" data-theme="' + theme.id + '">';
  html += '<button class="theme-head" data-action="toggle-theme" data-theme="' + theme.id + '">';
  html += '<div><div class="theme-label">' + esc(theme.label) + '</div><div class="theme-hint">' + esc(theme.hint) + "</div></div>";
  html += '<div class="checkbox' + (on ? " on" : "") + '">' + (on ? "✓" : "") + "</div></button>";
  if (on) {
    html += '<div class="theme-body">';
    html += '<div class="pill-row" style="margin-bottom:14px" data-theme-group="modalite" data-theme="' + theme.id + '">';
    MODALITES.forEach(function(m) { html += '<button class="pill' + (data.modalite === m.id ? " active" : "") + '" data-id="' + m.id + '">' + m.label + "</button>"; });
    html += "</div>";
    html += '<div class="section-label">Type d\'effort</div><div class="pill-row compact" style="margin-bottom:14px" data-theme-group="type" data-theme="' + theme.id + '">';
    GOALS.forEach(function(g) { html += '<button class="pill' + (data.type === g.id ? " active" : "") + '" data-id="' + g.id + '">' + g.label + "</button>"; });
    html += "</div>";
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="section-label" style="margin:0">Intensité (RPE)</span><span class="rpe-value">' + (data.rpe > 0 ? data.rpe : "–") + "</span></div>";
    html += rpeLadderHtml("theme:" + theme.id, data.rpe || 0);
    html += "</div>";
  }
  html += "</div>";
  return html;
}

// Sauvegarde en tâche de fond — ne bloque jamais le rendu, ne relance jamais
// de rechargement réseau (fini les doubles-clics et le retour en haut de page).
function saveInBackground() {
  const setStatus = function(s) { const el = document.getElementById("save-status"); if (el) el.textContent = s; };
  saveSession(currentDate, seance.session)
    .then(function() { seance.isNew = false; setStatus("Enregistré"); setTimeout(function() { setStatus(""); }, 1400); })
    .catch(function(e) { setStatus("Erreur : " + e.message); });
}

function wireSeanceEvents() {
  const session = seance.session;
  const update = function() { drawSeance(); saveInBackground(); };

  const dp = document.getElementById("date-picker");
  if (dp) dp.addEventListener("change", function() { if (dp.value) { currentDate = dp.value; loadSeance(); } });
  const backBtn = document.getElementById("back-today");
  if (backBtn) backBtn.addEventListener("click", function() { currentDate = todayISO(); loadSeance(); });

  document.querySelectorAll(".apply-schedule-theme").forEach(function(btn) {
    btn.addEventListener("click", function() {
      btn.dataset.themes.split(",").forEach(function(id) { if (!session.entries[id]) session.entries[id] = { modalite: "libre", rpe: 0 }; });
      update();
    });
  });

  const discInput = document.getElementById("discipline-input");
  if (discInput) discInput.addEventListener("blur", function() { session.discipline = discInput.value; saveInBackground(); });

  document.querySelectorAll('#goal-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { session.goal = session.goal === btn.dataset.id ? null : btn.dataset.id; update(); });
  });
  document.querySelectorAll('#duration-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const preset = DURATIONS.find(function(d) { return d.id === btn.dataset.id; });
      if (session.durationPreset === preset.id) { session.durationPreset = null; session.duration = ""; }
      else if (preset.id === "plus") { session.durationPreset = "plus"; }
      else { session.durationPreset = preset.id; session.duration = preset.minutes; }
      update();
    });
  });
  const durCustom = document.getElementById("duration-custom");
  if (durCustom) durCustom.addEventListener("blur", function() { session.duration = durCustom.value; update(); });
  document.querySelectorAll('#achievement-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { session.achievement = session.achievement === btn.dataset.id ? null : btn.dataset.id; update(); });
  });

  document.querySelectorAll('.rpe-ladder[data-scope="global"] .rpe-bar').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const n = Number(btn.dataset.n);
      session.intensity = session.intensity === n ? 0 : n;
      update();
    });
  });

  document.querySelectorAll('[data-action="toggle-theme"]').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.dataset.theme;
      if (session.entries[id]) delete session.entries[id]; else session.entries[id] = { modalite: "libre", rpe: 0 };
      update();
    });
  });
  document.querySelectorAll('[data-theme-group="modalite"]').forEach(function(row) {
    row.querySelectorAll(".pill").forEach(function(btn) {
      btn.addEventListener("click", function() { session.entries[row.dataset.theme].modalite = btn.dataset.id; update(); });
    });
  });
  document.querySelectorAll('[data-theme-group="type"]').forEach(function(row) {
    row.querySelectorAll(".pill").forEach(function(btn) {
      btn.addEventListener("click", function() { session.entries[row.dataset.theme].type = btn.dataset.id; update(); });
    });
  });
  document.querySelectorAll('.rpe-ladder').forEach(function(ladder) {
    if (ladder.dataset.scope === "global") return;
    const themeId = ladder.dataset.scope.split(":")[1];
    ladder.querySelectorAll(".rpe-bar").forEach(function(btn) {
      btn.addEventListener("click", function() {
        const n = Number(btn.dataset.n);
        session.entries[themeId].rpe = session.entries[themeId].rpe === n ? 0 : n;
        update();
      });
    });
  });

  const toggleHist = document.getElementById("toggle-history");
  if (toggleHist) toggleHist.addEventListener("click", function() {
    historyOpen = !historyOpen;
    drawSeance();
  });
  document.querySelectorAll(".history-item").forEach(function(btn) {
    btn.addEventListener("click", function() { currentDate = btn.dataset.date; loadSeance(); });
  });
}

// ---------------- Rendu : Dashboard ----------------
let dashPeriod = "jour";
async function renderDashboard() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement du dashboard…</div>';
  let sessions = [], wearable = [], dismissedDates = [], errorMsg = "";
  try { sessions = await listSessions(90); } catch (e) { errorMsg = e.message; }
  try { wearable = await listWearable(40); } catch (e) { errorMsg = errorMsg || e.message; }
  try {
    const rows = await sb("dismissed_activity_flags?select=day");
    dismissedDates = (rows || []).map(function(r) { return r.day; });
  } catch (e) {}

  const today = todayISO();
  const todaySession = sessions.find(function(s){ return s.date === today; }) || null;
  const todayWearable = wearable.find(function(w){ return w.day === today; }) || null;
  const wearable7 = wearable.filter(function(w){ return w.day >= daysAgo(7); });

  let streak = 0;
  for (let i = 0; ; i++) {
    const d = daysAgo(i);
    const has = sessions.some(function(s){ return s.date === d && s.correctedLoad; });
    if (i === 0 && !has) break;
    if (!has) break;
    streak++;
  }

  // Interprétation + indicateur de forme (charge + FC repos + VFC + stress)
  let hrDiff = null, stressDiff = null, loadRatio = null, hrvDiff = null;
  const lines = [];
  const hrBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.hr_resting != null; }).map(function(w){ return w.hr_resting; }));
  if (todayWearable && todayWearable.hr_resting != null && hrBaseline != null) {
    hrDiff = todayWearable.hr_resting - hrBaseline;
    // Seuils calibrés sur la littérature (variation 3-4bpm normale au quotidien ;
    // 5+ bpm = signal significatif de fatigue/surcharge ; 10+ bpm = signal fort,
    // parfois précurseur de maladie, cf. Friman & Wesslén 2000).
    if (hrDiff >= 10) lines.push({ tone: "warn", text: "FC repos à " + todayWearable.hr_resting + " bpm, " + hrDiff.toFixed(1) + " au-dessus de ta moyenne récente (" + hrBaseline.toFixed(0) + ") — écart marqué, vigilance (fatigue ou début de maladie possibles)." });
    else if (hrDiff >= 5) lines.push({ tone: "warn", text: "FC repos à " + todayWearable.hr_resting + " bpm, " + hrDiff.toFixed(1) + " au-dessus de ta moyenne récente (" + hrBaseline.toFixed(0) + ") — fatigue possible." });
    else if (hrDiff <= -3) lines.push({ tone: "good", text: "FC repos à " + todayWearable.hr_resting + " bpm, plus basse que d'habitude — bon signe." });
  }
  const hrvBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.hrv_avg != null; }).map(function(w){ return w.hrv_avg; }));
  let hrvPct = null;
  if (todayWearable && todayWearable.hrv_avg != null && hrvBaseline != null && hrvBaseline > 0) {
    hrvDiff = todayWearable.hrv_avg - hrvBaseline;
    hrvPct = (hrvDiff / hrvBaseline) * 100;
    // Seuils basés sur la littérature HRV : 10-20% de fluctuation jour/jour est normal,
    // une baisse >20% vs baseline est généralement considérée significative (Lifestack,
    // MyHRV) ; Kiviniemi et al. utilisent 1 écart-type sous la moyenne sur 10 jours.
    if (hrvPct <= -20) lines.push({ tone: "warn", text: "VFC à " + todayWearable.hrv_avg.toFixed(0) + " ms, " + hrvPct.toFixed(0) + "% sous ta moyenne récente (" + hrvBaseline.toFixed(0) + " ms) — écart significatif, système nerveux sous tension." });
    else if (hrvPct >= 15) lines.push({ tone: "good", text: "VFC à " + todayWearable.hrv_avg.toFixed(0) + " ms, en nette hausse — bon signe de récupération." });
  }
  const stressBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.stress_avg != null; }).map(function(w){ return w.stress_avg; }));
  if (todayWearable && todayWearable.stress_avg != null && stressBaseline != null) {
    stressDiff = todayWearable.stress_avg - stressBaseline;
    if (stressDiff >= 8) lines.push({ tone: "warn", text: "Stress du jour plus élevé que d'habitude (" + todayWearable.stress_avg.toFixed(0) + " vs " + stressBaseline.toFixed(0) + ")." });
  }
  const loaded = sessions.filter(function(s){ return s.correctedLoad != null; }).slice().reverse();
  const r3 = avgOf(loaded.slice(-3).map(function(s){ return s.correctedLoad; }));
  const r10 = avgOf(loaded.slice(-10).map(function(s){ return s.correctedLoad; }));
  if (r3 != null && r10) {
    loadRatio = r3 / r10;
    // NB : ce ratio (inspiré de l'ACWR sportif) est indicatif seulement — la littérature
    // récente (Impellizzeri et al.) remet en cause sa valeur prédictive isolée. À croiser
    // avec les autres signaux, jamais à lire seul.
    if (loadRatio > 1.3) lines.push({ tone: "warn", text: "Charge des 3 dernières séances au-dessus de ta moyenne récente — à surveiller, sans excès d'inquiétude isolément." });
    else if (loadRatio < 0.85) lines.push({ tone: "neutral", text: "Charge récente en retrait — phase plus légère." });
    else lines.push({ tone: "good", text: "Charge récente cohérente avec ta progression." });
  }
  if (todaySession && todaySession.correctedLoad) lines.push({ tone: "neutral", text: "Séance loggée aujourd'hui — charge corrigée " + todaySession.correctedLoad + "." });
  else lines.push({ tone: "neutral", text: "Pas de séance enregistrée aujourd'hui." });

  // Sommeil de la nuit précédente — cible générale 7-9h (littérature sommeil/performance),
  // en dessous de 6h associé à une récupération significativement dégradée.
  let sleepMin = todayWearable && todayWearable.sleep_total_min != null ? todayWearable.sleep_total_min : null;
  if (sleepMin != null) {
    const h = Math.floor(sleepMin / 60), m = sleepMin % 60;
    const label = h + "h" + (m < 10 ? "0" : "") + m;
    if (sleepMin < 360) lines.push({ tone: "warn", text: "Sommeil de " + label + " cette nuit — nettement sous les 7-9h recommandées, récupération probablement incomplète." });
    else if (sleepMin < 420) lines.push({ tone: "neutral", text: "Sommeil de " + label + " — un peu court par rapport aux 7-9h habituellement recommandées." });
    else lines.push({ tone: "good", text: "Sommeil de " + label + " — dans la fourchette recommandée." });
  }

  // Fréquence respiratoire nocturne — signal stable (peu de bruit jour/jour), utilisé
  // par WHOOP notamment ; une hausse vs baseline personnelle précède souvent maladie
  // ou récupération incomplète après une charge d'entraînement élevée.
  const respBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.resp_rate_avg != null; }).map(function(w){ return w.resp_rate_avg; }));
  let respDiff = null;
  if (todayWearable && todayWearable.resp_rate_avg != null && respBaseline != null) {
    respDiff = todayWearable.resp_rate_avg - respBaseline;
    if (respDiff >= 2) lines.push({ tone: "warn", text: "Fréquence respiratoire nocturne à " + todayWearable.resp_rate_avg.toFixed(1) + " resp/min, au-dessus de ta moyenne (" + respBaseline.toFixed(1) + ") — à surveiller sur plusieurs nuits (signe précoce possible de fatigue ou début de maladie)." });
  }

  let lifeload = null;
  try {
    const rows = await sb("lifeload?day=eq." + today + "&select=state");
    if (rows && rows[0]) lifeload = rows[0].state;
  } catch (e) {}

  let score = 75, signals = 0;
  if (hrDiff != null) { signals++; if (hrDiff >= 10) score -= 30; else if (hrDiff >= 5) score -= 15; else if (hrDiff >= 3) score -= 3; else if (hrDiff <= -3) score += 5; }
  if (hrvPct != null) { signals++; if (hrvPct <= -30) score -= 25; else if (hrvPct <= -20) score -= 15; else if (hrvPct <= -10) score -= 5; else if (hrvPct >= 15) score += 10; }
  if (stressDiff != null) { signals++; if (stressDiff >= 10) score -= 25; else if (stressDiff >= 5) score -= 10; }
  if (loadRatio != null) { signals++; if (loadRatio > 1.5) score -= 20; else if (loadRatio > 1.3) score -= 10; else if (loadRatio < 0.7) score += 5; }
  if (sleepMin != null) { signals++; if (sleepMin < 300) score -= 25; else if (sleepMin < 360) score -= 15; else if (sleepMin < 420) score -= 5; else if (sleepMin > 600) score -= 5; }
  if (respDiff != null) { signals++; if (respDiff >= 3) score -= 20; else if (respDiff >= 2) score -= 10; }
  const LIFELOAD_IMPACT = { bien: 8, stresse: -12, fatigue: -18, malade: -40, courbature: -10, neutre: 0 };
  if (lifeload != null) { signals++; score += (LIFELOAD_IMPACT[lifeload] || 0); }
  score = Math.max(0, Math.min(100, score));
  let tier = "Données insuffisantes", tierColor = "muted", needRest = "–";
  if (signals > 0) {
    if (score >= 70) { tier = "Bonne"; tierColor = "green"; needRest = "Non — tu peux enchaîner"; }
    else if (score >= 40) { tier = "Suffisante"; tierColor = "amber"; needRest = "Optionnel — reste attentif"; }
    else { tier = "Insuffisante"; tierColor = "rust"; needRest = "Oui — repos recommandé"; }
  }

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><h1>Dashboard</h1>';
  if (streak > 0) html += '<span style="color:var(--amber);font-size:13px;font-weight:800">🔥 ' + streak + "j</span>";
  html += "</div>";
  html += '<div class="muted" style="margin-bottom:18px">' + formatDateLabel(today) + "</div>";

  // Journal (jours récents à compléter)
  const last14 = [];
  for (let i = 13; i >= 0; i--) last14.push(daysAgo(i));
  const journal = last14.map(function(d) {
    const w = wearable.find(function(x){ return x.day === d; });
    const s = sessions.find(function(x){ return x.date === d; });
    const hasSession = s && Object.keys(s.entries).length > 0;
    const signal = w && ((w.intensity_avg && w.intensity_avg > 25) || (w.hr_max_activity && w.hr_max_activity > 140));
    return { date: d, wearable: w, signal: signal && !hasSession && dismissedDates.indexOf(d) === -1 };
  });
  const toComplete = journal.filter(function(j){ return j.signal; });
  if (toComplete.length) {
    html += '<div class="card amber"><div class="section-label">Séances possibles non renseignées</div>';
    html += '<div class="muted" style="margin-bottom:10px">Activité détectée par la montre sans QCM correspondant.</div>';
    toComplete.forEach(function(g) {
      html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
      html += '<button class="history-item goto-date" data-date="' + g.date + '" style="flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--surfaceRaised);margin-bottom:0">';
      html += '<span style="font-weight:700;font-size:12px">' + formatDateLabel(g.date) + "</span>";
      html += '<span style="color:var(--amber);font-size:11px;font-weight:800">Compléter →</span></button>';
      html += '<button class="dismiss-flag" data-date="' + g.date + '" title="Ce n\'était pas une séance" style="background:var(--surfaceRaised);border:none;border-radius:8px;color:var(--muted);font-size:15px;padding:10px 12px;cursor:pointer">✕</button>';
      html += "</div>";
    });
    html += "</div>";
  }

  html += '<div class="pill-row" style="margin-bottom:16px" id="period-row">';
  [["jour","Jour"],["semaine","Semaine"],["mois","Mois"],["comparer","Comparer"]].forEach(function(p) {
    html += '<button class="pill' + (dashPeriod === p[0] ? " active" : "") + '" data-period="' + p[0] + '" style="font-size:11.5px;padding:9px 2px">' + p[1] + "</button>";
  });
  html += "</div>";

  if (dashPeriod === "jour") {
    html += '<div class="card"><div class="section-label">Forme</div>';
    html += '<div style="text-align:center;padding:8px 0"><div style="font-size:38px;font-weight:900">' + score + '</div>';
    html += '<div style="color:var(--' + tierColor + ');font-size:13px;font-weight:800;text-transform:uppercase">' + tier + "</div></div>";
    html += '<div style="text-align:center;padding-top:10px;border-top:1px solid var(--line);font-size:12px">Besoin de repos : <b style="color:var(--' + tierColor + ')">' + needRest + "</b></div></div>";

    html += '<div class="card"><div class="section-label">Comment tu te sens aujourd\'hui ?</div>';
    html += '<select id="lifeload-select" style="width:100%;background:var(--surfaceRaised);border:1px solid var(--line);border-radius:7px;color:var(--chalk);font-size:16px;padding:10px 12px">';
    const LIFELOAD_OPTIONS = [
      ["", "— Choisir —"], ["bien", "Bien"], ["neutre", "Neutre"], ["stresse", "Stressé"],
      ["fatigue", "Fatigué"], ["courbature", "Courbaturé"], ["malade", "Malade"],
    ];
    LIFELOAD_OPTIONS.forEach(function(o) {
      html += '<option value="' + o[0] + '"' + (lifeload === o[0] || (!lifeload && o[0] === "") ? " selected" : "") + '>' + o[1] + "</option>";
    });
    html += "</select>";
    if (lifeload) html += '<div class="muted" style="font-size:10px;margin-top:6px">Pris en compte dans le score Forme ci-dessus.</div>';
    html += "</div>";

    // Tendance FC repos + VFC sur 14 jours
    const trend14 = []; for (let i = 13; i >= 0; i--) trend14.push(daysAgo(i));
    const hrSeries = trend14.map(function(d) { const w = wearable.find(function(x) { return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: (w && w.hr_resting) || 0 }; });
    const hrvSeries = trend14.map(function(d) { const w = wearable.find(function(x) { return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: (w && w.hrv_avg) || 0 }; });
    const hasHrData = hrSeries.some(function(s) { return s.val > 0; });
    if (hasHrData) {
      html += '<div class="card"><div class="section-label">FC repos (bpm) — 14 jours</div>';
      html += barChartHtml(hrSeries, { color: "steel" });
      html += "</div>";
      html += '<div class="card"><div class="section-label">VFC (ms) — 14 jours</div>';
      html += barChartHtml(hrvSeries, { color: "green" });
      html += "</div>";
    }

    if (todayWearable && todayWearable.stress_avg != null) {
      const sv = todayWearable.stress_avg;
      const sColor = sv >= 50 ? "rust" : sv >= 30 ? "amber" : "green";
      const sLabel = sv >= 50 ? "Élevé" : sv >= 30 ? "Modéré" : "Faible";
      html += '<div class="card"><div class="section-label">Stress</div>';
      html += '<div style="display:flex;align-items:baseline;gap:10px">';
      html += '<span style="font-size:32px;font-weight:900;color:var(--' + sColor + ')">' + Math.round(sv) + "</span>";
      html += '<span style="color:var(--' + sColor + ');font-size:13px;font-weight:800;text-transform:uppercase">' + sLabel + "</span></div>";
      if (stressDiff != null) {
        html += '<div class="muted" style="font-size:11px;margin-top:6px">' + (stressDiff >= 0 ? "+" : "") + stressDiff.toFixed(0) + " vs ta moyenne des 7 derniers jours</div>";
      }
      html += "</div>";
    }
    html += '<div class="card"><div class="section-label">Interprétation du jour</div>';
    lines.forEach(function(l) {
      const dotColor = l.tone === "warn" ? "rust" : l.tone === "good" ? "green" : "steel";
      html += '<div style="display:flex;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--chalkDim)"><span style="display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--' + dotColor + ');margin-right:8px;margin-top:5px;flex-shrink:0"></span><span>' + esc(l.text) + "</span></div>";
    });
    html += '<div class="muted" style="font-size:10px;margin-top:4px">Interprétation indicative — ne remplace pas ton ressenti ni un avis médical. Les fluctuations de VFC de 10-20% d\'un jour à l\'autre sont normales ; seuls les écarts plus marqués ou les tendances sur plusieurs jours sont vraiment significatifs.</div></div>';
    if (todayWearable) html += wearableCardHtml(Object.assign({}, todayWearable, { day: today }));
  } else if (dashPeriod === "semaine") {
    const last7 = []; for (let i = 6; i >= 0; i--) last7.push(daysAgo(i));
    const prev7 = []; for (let i = 13; i >= 7; i--) prev7.push(daysAgo(i));
    const last7Sessions = sessions.filter(function(s){ return last7.indexOf(s.date) !== -1; });
    const prev7Sessions = sessions.filter(function(s){ return prev7.indexOf(s.date) !== -1; });
    const bars = last7.map(function(d) {
      const s = sessions.find(function(x){ return x.date === d; });
      return { label: formatDateLabel(d).slice(0,2), val: (s && s.correctedLoad) || 0 };
    });
    html += '<div class="card"><div class="section-label">Charge corrigée — 7 derniers jours</div>';
    html += barChartHtml(bars, { color: "steel" });
    html += "</div>";
    const totalLoad = last7Sessions.reduce(function(s,x){return s+(x.correctedLoad||0);},0);
    const prevTotalLoad = prev7Sessions.reduce(function(s,x){return s+(x.correctedLoad||0);},0);
    const rpeVals = last7Sessions.map(function(s){return s.intensity;}).filter(function(v){return v>0;});
    const achieved = last7Sessions.filter(function(s){return s.achievement==="atteint";}).length;
    const withAch = last7Sessions.filter(function(s){return s.achievement;}).length;
    html += '<div class="card"><div class="stat-row">';
    html += statHtml("Charge totale", totalLoad, "rust");
    html += statHtml("Séances", last7Sessions.length);
    html += statHtml("RPE moyen", rpeVals.length ? avgOf(rpeVals).toFixed(1) : "–");
    html += statHtml("Objectifs atteints", withAch ? achieved+"/"+withAch : "–");
    html += "</div></div>";

    const weekLines = [];
    if (prevTotalLoad > 0) {
      const pct = Math.round(((totalLoad - prevTotalLoad) / prevTotalLoad) * 100);
      if (pct >= 30) weekLines.push({ tone: "warn", text: "Charge en hausse de " + pct + "% vs la semaine précédente (" + prevTotalLoad + " → " + totalLoad + ") — progression rapide, surveille ta récupération." });
      else if (pct <= -30) weekLines.push({ tone: "neutral", text: "Charge en net retrait vs la semaine précédente (" + pct + "%) — phase plus légère ou repos." });
      else weekLines.push({ tone: "good", text: "Charge stable par rapport à la semaine précédente (" + (pct >= 0 ? "+" : "") + pct + "%)." });
    } else if (last7Sessions.length > 0) {
      weekLines.push({ tone: "neutral", text: "Pas de semaine précédente comparable pour l'instant." });
    }
    if (last7Sessions.length === 0) {
      weekLines.push({ tone: "warn", text: "Aucune séance loggée cette semaine." });
    } else if (last7Sessions.length <= 1) {
      weekLines.push({ tone: "neutral", text: "Une seule séance cette semaine — fréquence en retrait si ce n'est pas voulu." });
    }
    if (withAch >= 2 && achieved / withAch < 0.5) {
      weekLines.push({ tone: "warn", text: "Moins de la moitié des objectifs atteints cette semaine (" + achieved + "/" + withAch + ") — vaut le coup de regarder pourquoi (charge, sommeil, planning)." });
    }
    if (weekLines.length) {
      html += '<div class="card"><div class="section-label">Lecture de la semaine</div>';
      weekLines.forEach(function(l) {
        const dotColor = l.tone === "warn" ? "rust" : l.tone === "good" ? "green" : "steel";
        html += '<div style="display:flex;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--chalkDim)"><span style="display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--' + dotColor + ');margin-right:8px;margin-top:5px;flex-shrink:0"></span><span>' + esc(l.text) + "</span></div>";
      });
      html += "</div>";
    }
  } else if (dashPeriod === "mois") {
    const month = []; for (let i = 29; i >= 0; i--) month.push(daysAgo(i));
    const monthSessions = sessions.filter(function(s){ return month.indexOf(s.date) !== -1; });
    const buckets = [];
    for (let w = 0; w < 5; w++) {
      const bd = month.slice(w*6, w*6+6); if (!bd.length) continue;
      const bs = monthSessions.filter(function(s){ return bd.indexOf(s.date) !== -1; });
      buckets.push({ label: bd[0].slice(8,10)+"-"+bd[bd.length-1].slice(8,10), val: bs.reduce(function(s,x){return s+(x.correctedLoad||0);},0) });
    }
    html += '<div class="card"><div class="section-label">Charge corrigée — 30 derniers jours</div>';
    html += barChartHtml(buckets, { color: "steel", height: 72 });
    html += "</div>";
    const achieved = monthSessions.filter(function(s){return s.achievement==="atteint";}).length;
    const withAch = monthSessions.filter(function(s){return s.achievement;}).length;
    html += '<div class="card"><div class="stat-row">';
    html += statHtml("Séances", monthSessions.length);
    html += statHtml("Objectifs atteints", withAch ? achieved+"/"+withAch : "–");
    html += statHtml("Fréquence", (monthSessions.length/4.3).toFixed(1)+"/sem");
    html += "</div></div>";
    const themeCounts = {};
    monthSessions.forEach(function(s){ Object.keys(s.entries).forEach(function(t){ themeCounts[t]=(themeCounts[t]||0)+1; }); });
    const stale = THEMES.map(function(t) {
      const last = sessions.filter(function(s){ return s.entries[t.id]; }).sort(function(a,b){return a.date<b.date?1:-1;})[0];
      const days = last ? Math.round((new Date(today)-new Date(last.date))/86400000) : null;
      return { theme: t, days: days };
    }).filter(function(x){ return x.days === null || x.days >= 10; });
    const recs = [];
    const total = monthSessions.length;
    if (total >= 3) {
      // Un mouvement complet (muscle-up, skin the cat...) sollicite à la fois
      // le tirage et la poussée — il compte donc dans les deux pour l'équilibre.
      const pull = (themeCounts.tirage||0) + (themeCounts.complet||0), push = (themeCounts.poussee||0) + (themeCounts.complet||0);
      if (pull+push >= 4) {
        if (push>0 && pull/push<=0.55) recs.push({tone:"warn",text:"Poussée bien plus travaillée que Tirage ("+push+" vs "+pull+")."});
        else if (pull>0 && push/pull<=0.55) recs.push({tone:"warn",text:"Tirage bien plus travaillé que Poussée ("+pull+" vs "+push+")."});
      }
      THEMES.forEach(function(t){ const c=themeCounts[t.id]||0; if (total>=4 && c/total>0.55) recs.push({tone:"neutral",text:t.label+" domine largement tes séances ("+c+"/"+total+")."}); });
    }
    if (recs.length || stale.length) {
      html += '<div class="card amber"><div class="section-label">Recommandations</div>';
      recs.forEach(function(r){ html += '<div style="font-size:12px;color:var(--chalkDim);margin-bottom:8px">' + esc(r.text) + "</div>"; });
      stale.forEach(function(s) { html += '<div style="font-size:12px;color:var(--chalkDim);margin-bottom:8px"><span style="color:var(--amber);font-weight:700">'+s.theme.label+'</span> — '+(s.days===null?"jamais travaillé":"pas travaillé depuis "+s.days+"j")+"</div>"; });
      html += "</div>";
    }
  } else if (dashPeriod === "comparer") {
    const stats = {};
    sessions.filter(function(s){ return s.discipline && s.correctedLoad != null; }).forEach(function(s) {
      if (!stats[s.discipline]) stats[s.discipline] = [];
      stats[s.discipline].push(s.correctedLoad);
    });
    const rows = Object.keys(stats).map(function(name) {
      const loads = stats[name];
      return { name: name, count: loads.length, avg: Math.round(avgOf(loads)) };
    }).sort(function(a,b){ return b.avg - a.avg; });
    if (!rows.length) {
      html += '<div class="card"><div class="muted" style="text-align:center;padding:10px 0">Pas encore assez de séances pour comparer.</div></div>';
    } else {
      html += '<div class="card"><div class="section-label">Charge moyenne par discipline</div>';
      const max = rows[0].avg || 1;
      rows.forEach(function(r, i) {
        const pct = Math.max(6, (r.avg/max)*100);
        html += '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:700;font-size:13px">' + esc(r.name) + '</span><span style="font-size:12px;color:var(--chalkDim)">' + r.avg + ' <span class="muted">· ' + r.count + " séance(s)</span></span></div>";
        html += '<div style="height:8px;background:var(--surfaceRaised);border-radius:4px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--' + (i===0?"rust":"steel") + ');border-radius:4px"></div></div></div>';
      });
      html += "</div>";
    }
  }

  app.innerHTML = html;
  document.querySelectorAll('#period-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { dashPeriod = btn.dataset.period; renderDashboard(); });
  });
  document.querySelectorAll('.goto-date').forEach(function(btn) {
    btn.addEventListener("click", function() { currentDate = btn.dataset.date; currentTab = "seance"; setTab("seance"); });
  });
  document.querySelectorAll('.dismiss-flag').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const d = btn.dataset.date;
      btn.textContent = "…";
      sb("dismissed_activity_flags", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ day: d }),
      }).then(function() { renderDashboard(); }).catch(function(e) { alert("Erreur : " + e.message); });
    });
  });
  const lifeloadSelect = document.getElementById("lifeload-select");
  if (lifeloadSelect) lifeloadSelect.addEventListener("change", function() {
    const v = lifeloadSelect.value;
    if (!v) return;
    sb("lifeload", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ day: todayISO(), state: v }),
    }).then(function() { renderDashboard(); }).catch(function(e) { alert("Erreur : " + e.message); });
  });
}
// ---------------- Rendu : Sommeil ----------------
async function renderSommeil() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  let wearable = [], errorMsg = "";
  try { wearable = await listWearable(21); } catch (e) { errorMsg = e.message; }

  const last14 = []; for (let i = 13; i >= 0; i--) last14.push(daysAgo(i));
  const nights = last14.map(function(d) {
    const w = wearable.find(function(x) { return x.day === d; });
    return {
      date: d, tracked: !!(w && w.sleep_session_recorded), stress: w ? w.stress_avg : null,
      total: w ? w.sleep_total_min : null, light: w ? w.sleep_light_min : null,
      deep: w ? w.sleep_deep_min : null, rem: w ? w.sleep_rem_min : null, awake: w ? w.sleep_awake_count : null,
    };
  });
  const withSleep = nights.filter(function(n) { return n.total != null; });
  const latest = withSleep.length ? withSleep[withSleep.length - 1] : null;
  const avgTotal = withSleep.length ? avgOf(withSleep.map(function(n){return n.total;})) : null;

  const stressBars = nights.map(function(n) { return { label: formatDateLabel(n.date).slice(0,2), val: n.stress || 0 }; });
  const sleepBars = nights.map(function(n) { return { label: formatDateLabel(n.date).slice(0,2), val: n.total ? Math.round(n.total/60*10)/10 : 0 }; });

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<h1 style="margin-bottom:4px">Sommeil</h1>';
  html += '<div class="muted" style="margin-bottom:18px">14 dernières nuits</div>';

  if (latest) {
    const h = Math.floor(latest.total / 60), m = latest.total % 60;
    html += '<div class="card"><div class="section-label">Dernière nuit trackée — ' + formatDateLabel(latest.date) + '</div>';
    html += '<div style="text-align:center;padding:6px 0 14px"><div style="font-size:34px;font-weight:900">' + h + 'h' + (m<10?'0':'') + m + '</div>';
    if (avgTotal != null) html += '<div class="muted" style="font-size:11px">moyenne 14j : ' + Math.floor(avgTotal/60) + 'h' + Math.round(avgTotal%60).toString().padStart(2,'0') + '</div>';
    html += "</div>";
    const stages = [
      ["Léger", latest.light, "steel"],
      ["Profond", latest.deep, "rust"],
      ["Paradoxal", latest.rem, "green"],
    ];
    const stageTotal = latest.total || 1;
    stages.forEach(function(s) {
      const pct = Math.round((s[1]/stageTotal)*100);
      const sh = Math.floor(s[1]/60), sm = s[1]%60;
      html += '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>' + s[0] + '</span><span class="muted">' + sh + 'h' + (sm<10?'0':'') + sm + ' · ' + pct + '%</span></div>';
      html += '<div style="height:8px;background:var(--surfaceRaised);border-radius:4px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--' + s[2] + ')"></div></div></div>';
    });
    if (latest.awake != null) html += '<div class="muted" style="font-size:11px;margin-top:6px">Réveils détectés : ' + latest.awake + "</div>";
    html += "</div>";

    const sleepLines = [];
    const totalH = latest.total / 60;
    if (totalH < 6) sleepLines.push({ tone: "warn", text: "Moins de 6h cette nuit — sous le seuil généralement associé à une récupération incomplète." });
    else if (totalH >= 7 && totalH <= 9) sleepLines.push({ tone: "good", text: "Dans la fourchette recommandée de 7-9h." });
    else if (totalH > 9) sleepLines.push({ tone: "neutral", text: "Plus long que d'habitude — peut refléter un vrai besoin de récupération après une charge élevée." });
    const deepPct = Math.round((latest.deep / latest.total) * 100);
    const remPct = Math.round((latest.rem / latest.total) * 100);
    if (deepPct < 10) sleepLines.push({ tone: "neutral", text: "Sommeil profond à " + deepPct + "% — en dessous de la fourchette usuelle (13-23%), sans que ce soit forcément un problème isolément." });
    if (remPct < 15) sleepLines.push({ tone: "neutral", text: "Sommeil paradoxal à " + remPct + "% — un peu bas vs la fourchette usuelle (20-25%)." });
    const recentHalf = withSleep.slice(-7), olderHalf = withSleep.slice(-14, -7);
    if (recentHalf.length >= 3 && olderHalf.length >= 3) {
      const recentAvg = avgOf(recentHalf.map(function(n){return n.total;}));
      const olderAvg = avgOf(olderHalf.map(function(n){return n.total;}));
      const diffMin = recentAvg - olderAvg;
      if (diffMin <= -30) sleepLines.push({ tone: "warn", text: "Moyenne de sommeil en baisse de " + Math.round(-diffMin) + " min sur les 7 dernières nuits vs les 7 précédentes." });
      else if (diffMin >= 30) sleepLines.push({ tone: "good", text: "Moyenne de sommeil en hausse de " + Math.round(diffMin) + " min sur les 7 dernières nuits." });
    }
    const latestWearable = wearable.find(function(w){ return w.day === latest.date; });
    if (latestWearable && latestWearable.resp_rate_avg != null) {
      const respBase = avgOf(wearable.filter(function(w){ return w.day !== latest.date && w.resp_rate_avg != null; }).map(function(w){ return w.resp_rate_avg; }));
      if (respBase != null) {
        const rd = latestWearable.resp_rate_avg - respBase;
        if (rd >= 2) sleepLines.push({ tone: "warn", text: "Fréquence respiratoire nocturne au-dessus de ta moyenne (" + latestWearable.resp_rate_avg.toFixed(1) + " vs " + respBase.toFixed(1) + ") — à surveiller sur les prochaines nuits." });
      }
    }
    if (sleepLines.length) {
      html += '<div class="card"><div class="section-label">Lecture</div>';
      sleepLines.forEach(function(l) {
        const dotColor = l.tone === "warn" ? "rust" : l.tone === "good" ? "green" : "steel";
        html += '<div style="display:flex;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--chalkDim)"><span style="display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--' + dotColor + ');margin-right:8px;margin-top:5px;flex-shrink:0"></span><span>' + esc(l.text) + "</span></div>";
      });
      html += '<div class="muted" style="font-size:10px;margin-top:4px">Fourchettes de référence générales (littérature sommeil), pas un diagnostic personnalisé.</div></div>';
    }
  }

  html += '<div class="card"><div class="section-label">Durée de sommeil (h) — 14 jours</div>';
  html += barChartHtml(sleepBars, { color: "steel", decimals: 1 });
  html += "</div>";

  html += '<div class="card"><div class="section-label">Stress — tendance récente</div>';
  html += barChartHtml(stressBars, { color: "amber" });
  html += "</div>";

  html += '<div class="card"><div class="section-label">Nuits trackées</div>';
  nights.slice().reverse().forEach(function(n) {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
    html += '<span style="font-size:13px">' + formatDateLabel(n.date) + "</span>";
    if (n.total != null) {
      const h = Math.floor(n.total/60), m = n.total%60;
      html += '<span style="color:var(--green);font-size:12px;font-weight:700">' + h + 'h' + (m<10?'0':'') + m + "</span>";
    } else if (n.tracked) {
      html += '<span style="color:var(--muted);font-size:12px">Trackée (détail indispo)</span>';
    } else {
      html += '<span class="muted" style="font-size:12px">—</span>';
    }
    html += "</div>";
  });
  html += "</div>";

  html += '<div class="card steel"><div class="section-label">À savoir</div>';
  html += '<div style="font-size:11px;color:var(--chalkDim);line-height:1.5">Les stades (léger/profond/paradoxal) viennent d\'un décodage du format propriétaire de ta montre, validé contre les valeurs affichées par Zepp — fiable mais non officiellement documenté. Une nuit isolée à durée très courte (ex. sieste) peut apparaître si le capteur a mal segmenté la session.</div></div>';

  app.innerHTML = html;
}

// Graphique en barres lisible : valeur numérique au-dessus de chaque barre,
// libellé de jour en dessous, barre du jour le plus récent mise en valeur.
function barChartHtml(items, opts) {
  opts = opts || {};
  const color = opts.color || "steel";
  const decimals = opts.decimals || 0;
  const height = opts.height || 64;
  const vals = items.map(function(i) { return i.val; });
  const max = Math.max.apply(null, vals.concat([1]));
  const min = Math.min.apply(null, vals.filter(function(v) { return v > 0; }).concat([max]));
  let html = '<div style="display:flex;align-items:flex-end;gap:6px">';
  items.forEach(function(item, i) {
    const v = item.val || 0;
    const h = v > 0 ? Math.max(18, (v / max) * height) : 4;
    const isLast = i === items.length - 1;
    const barColor = isLast && v > 0 ? "rust" : color;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">';
    html += '<span style="font-size:9px;color:var(--chalkDim);white-space:nowrap">' + (v > 0 ? v.toFixed(decimals) : "–") + "</span>";
    html += '<div style="width:100%;height:' + h + 'px;background:var(--' + barColor + ');border-radius:3px 3px 1px 1px"></div>';
    html += '<span style="font-size:9px;color:var(--muted)">' + (item.label || "") + "</span>";
    html += "</div>";
  });
  return html + "</div>";
}

// ---------------- Rendu : Migraine ----------------
const TRIGGERS = [
  { id: "stress", label: "Stress" },
  { id: "sommeil", label: "Sommeil insuffisant/perturbé" },
  { id: "effort", label: "Effort intense/soudain" },
  { id: "ecrans", label: "Écrans prolongés" },
  { id: "deshydratation", label: "Déshydratation" },
  { id: "repas", label: "Repas sauté" },
  { id: "cervical", label: "Tension nerveuse/cervicale" },
  { id: "meteo", label: "Météo" },
  { id: "alcool", label: "Alcool" },
  { id: "hormonal", label: "Hormonal" },
];

let migraineForm = { day: todayISO(), intensity: 5, triggers: [], notes: "" };

async function getWearableForDate2(dateStr) {
  const rows = await sb("wearable_daily?day=eq." + dateStr + "&select=*");
  return rows && rows[0] ? rows[0] : null;
}

async function renderMigraine() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  let history = [], errorMsg = "";
  try {
    history = await sb("migraines?select=*&order=day.desc&limit=60") || [];
  } catch (e) { errorMsg = e.message; }

  // Contexte automatique du jour sélectionné dans le formulaire
  let ctx = null;
  try { ctx = await getWearableForDate2(migraineForm.day); } catch (e) {}
  const sessionCtx = (await listSessions(90)).find(function(s) { return s.date === migraineForm.day; });

  // Fréquence des déclencheurs sur l'historique
  const triggerCounts = {};
  history.forEach(function(m) {
    (m.triggers || []).forEach(function(t) { triggerCounts[t] = (triggerCounts[t] || 0) + 1; });
  });
  const sortedTriggers = Object.keys(triggerCounts).sort(function(a, b) { return triggerCounts[b] - triggerCounts[a]; });

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<h1 style="margin-bottom:4px">Migraine</h1>';
  html += '<div class="muted" style="margin-bottom:18px">Journal et déclencheurs potentiels</div>';

  html += '<div class="card">';
  html += '<div class="section-label">Nouvelle entrée</div>';
  html += '<input type="date" id="mig-date" value="' + migraineForm.day + '" max="' + todayISO() + '" style="margin-bottom:14px" />';

  if (ctx || sessionCtx) {
    html += '<div style="background:var(--surfaceRaised);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:var(--chalkDim)">';
    html += '<div class="muted" style="font-size:10px;text-transform:uppercase;margin-bottom:4px">Contexte ce jour-là</div>';
    const parts = [];
    if (ctx && ctx.sleep_total_min != null) parts.push("Sommeil " + Math.floor(ctx.sleep_total_min/60) + "h" + (ctx.sleep_total_min%60).toString().padStart(2,'0'));
    if (ctx && ctx.stress_avg != null) parts.push("Stress " + Math.round(ctx.stress_avg));
    if (ctx && ctx.hrv_avg != null) parts.push("VFC " + Math.round(ctx.hrv_avg) + "ms");
    if (sessionCtx && sessionCtx.correctedLoad) parts.push("Charge " + sessionCtx.correctedLoad);
    html += parts.length ? parts.join(" · ") : "Pas de données montre pour ce jour.";
    html += "</div>";
  }

  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="section-label" style="margin:0">Intensité</span><span class="rpe-value">' + migraineForm.intensity + "</span></div>";
  html += rpeLadderHtml("migraine", migraineForm.intensity);

  html += '<div class="section-label" style="margin-top:14px">Déclencheurs potentiels</div><div class="pill-row compact" style="flex-wrap:wrap;gap:6px">';
  TRIGGERS.forEach(function(t) {
    const on = migraineForm.triggers.indexOf(t.id) !== -1;
    html += '<button class="pill mig-trigger' + (on ? " active" : "") + '" data-id="' + t.id + '" style="flex:none;padding:7px 10px">' + t.label + "</button>";
  });
  html += "</div>";

  html += '<div class="section-label" style="margin-top:14px">Notes</div>';
  html += '<input type="text" id="mig-notes" placeholder="Contexte, symptômes associés…" value="' + esc(migraineForm.notes) + '" style="margin-bottom:14px" />';

  html += '<button class="btn-outline" id="mig-save" style="margin-top:0">Enregistrer</button>';
  html += "</div>";

  if (sortedTriggers.length > 0) {
    const maxCount = triggerCounts[sortedTriggers[0]];
    html += '<div class="card amber"><div class="section-label">Déclencheurs les plus fréquents (' + history.length + ' entrée(s))</div>';
    sortedTriggers.slice(0, 6).forEach(function(tid) {
      const t = TRIGGERS.find(function(x) { return x.id === tid; });
      const pct = Math.round((triggerCounts[tid] / maxCount) * 100);
      html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + (t ? t.label : tid) + '</span><span class="muted">' + triggerCounts[tid] + "×</span></div>";
      html += '<div style="height:6px;background:var(--surfaceRaised);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--amber)"></div></div></div>';
    });
    html += '<div class="muted" style="font-size:10px;margin-top:4px">Fréquence déclarative — une corrélation répétée mérite d\'en parler à un médecin, elle ne remplace pas un diagnostic.</div></div>';
  }

  html += '<div class="card"><div class="section-label">Historique (' + history.length + ")</div>";
  if (history.length === 0) html += '<div class="muted" style="text-align:center;padding:16px 0">Aucune entrée pour l\'instant.</div>';
  history.forEach(function(m) {
    html += '<div style="padding:8px 0;border-bottom:1px solid var(--line)">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">';
    html += '<span style="font-weight:700;font-size:13px">' + formatDateLabel(m.day) + '</span>';
    html += '<div style="display:flex;align-items:center;gap:10px"><span style="color:var(--rust);font-weight:800">' + (m.intensity || "–") + '/10</span>';
    html += '<button class="mig-delete" data-id="' + m.id + '" data-day="' + esc(formatDateLabel(m.day)) + '" style="background:none;border:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:2px 4px">✕</button></div>';
    html += "</div>";
    if (m.triggers && m.triggers.length) {
      html += '<div style="margin-top:4px">';
      m.triggers.forEach(function(tid) {
        const t = TRIGGERS.find(function(x) { return x.id === tid; });
        html += '<span class="badge">' + (t ? t.label : tid) + "</span>";
      });
      html += "</div>";
    }
    if (m.notes) html += '<div class="muted" style="font-size:11px;margin-top:4px">' + esc(m.notes) + "</div>";
    html += "</div>";
  });
  html += "</div>";

  app.innerHTML = html;
  wireMigraineEvents();
}

function wireMigraineEvents() {
  const dateInput = document.getElementById("mig-date");
  if (dateInput) dateInput.addEventListener("change", function() { migraineForm.day = dateInput.value; renderMigraine(); });

  document.querySelectorAll(".mig-delete").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (!confirm("Supprimer l'entrée du " + btn.dataset.day + " ?")) return;
      const id = btn.dataset.id;
      btn.textContent = "…";
      sb("migraines?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } })
        .then(function() { renderMigraine(); })
        .catch(function(e) { alert("Erreur : " + e.message); });
    });
  });

  document.querySelectorAll('.rpe-ladder[data-scope="migraine"] .rpe-bar').forEach(function(btn) {
    btn.addEventListener("click", function() {
      migraineForm.intensity = Number(btn.dataset.n);
      renderMigraine();
    });
  });

  document.querySelectorAll(".mig-trigger").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.dataset.id;
      const idx = migraineForm.triggers.indexOf(id);
      if (idx === -1) migraineForm.triggers.push(id); else migraineForm.triggers.splice(idx, 1);
      renderMigraine();
    });
  });

  const notesInput = document.getElementById("mig-notes");
  if (notesInput) notesInput.addEventListener("input", function() { migraineForm.notes = notesInput.value; });

  const saveBtn = document.getElementById("mig-save");
  if (saveBtn) saveBtn.addEventListener("click", function() {
    saveBtn.textContent = "Enregistrement…";
    sb("migraines", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify({
        day: migraineForm.day, intensity: migraineForm.intensity,
        triggers: migraineForm.triggers, notes: migraineForm.notes || null,
      }),
    }).then(function() {
      migraineForm = { day: todayISO(), intensity: 5, triggers: [], notes: "" };
      renderMigraine();
    }).catch(function(e) {
      saveBtn.textContent = "Erreur : " + e.message;
    });
  });
}

function statHtml(label, value, color) {
  return '<div class="stat"><div class="stat-label">' + label + '</div><div class="stat-value"' + (color ? ' style="color:var(--'+color+')"' : '') + '>' + value + "</div></div>";
}

// ---------------- Navigation ----------------
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab[data-tab]").forEach(function(t) { t.classList.toggle("active", t.dataset.tab === tab); });
  if (tab === "seance") loadSeance();
  else if (tab === "dashboard") renderDashboard();
  else if (tab === "sommeil") renderSommeil();
  else renderMigraine();
}
document.querySelectorAll(".tab[data-tab]").forEach(function(t) {
  t.addEventListener("click", function() { setTab(t.dataset.tab); });
});
setTab("seance");
