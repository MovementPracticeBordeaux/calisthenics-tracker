<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  :root {
    --bg: #0b0b0d; --surface: #1a1a1c; --surfaceRaised: #242426;
    --chalk: #F5F3EF; --chalkDim: #B8B2A6; --rust: #F2711C; --rustDim: #9a4a10;
    --pink: #EC4899; --purple: #A855F7;
    --steel: #8b6fb0; --muted: #9a9488; --line: #38352F;
    --gradient: linear-gradient(90deg, var(--rust), var(--pink), var(--purple));
    /* Palette néon des indicateurs (bon/moyen/mauvais) — vive et légèrement
       dégradée, cohérente avec l'esprit lumineux de la charte plutôt que des
       tons ternes classiques. */
    --green: #39FF8A; --greenDark: #0FA85A;
    --amber: #FFB020; --amberDark: #E0791A;
    --red: #FF3366; --redDark: #C41E52;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--chalk); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px 11px 40px; position: relative; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 9px 1px; border-radius: 7px; border: none; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1px; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gradient); color: var(--bg); font-weight: 900; }
  h1 { font-size: 26px; font-weight: 900; margin: 0; font-family: 'Arial Black', system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: rgba(255,255,255,.02); border: none; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card.amber { border: 1px solid var(--amber); }
  .card.steel { border: 1px solid var(--steel); }
  summary.section-label { list-style: none; }
  summary.section-label::-webkit-details-marker { display: none; }
  .recap-chevron { display: inline-block; transition: transform .2s ease; }
  details[open] > summary.section-label .recap-chevron { transform: rotate(180deg); }
  .section-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .pill-row { display: flex; gap: 8px; }
  .pill-row.compact { gap: 5px; }
  .pill { flex: 1; padding: 10px 0; border-radius: 7px; border: 1px solid var(--line); background: transparent;
    color: var(--chalkDim); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill-row.compact .pill { padding: 9px 2px; font-size: 11.5px; }
  .pill.active { background-color: var(--bg); background-image: linear-gradient(var(--bg), var(--bg)), linear-gradient(90deg, var(--amber), var(--pink));
    background-origin: border-box; background-clip: padding-box, border-box; color: var(--pink); border: 2px solid transparent;
    box-shadow: 0 0 8px var(--pink), 0 0 5px var(--amber), inset 0 0 6px rgba(236,72,153,.3); }
  .pill.active.rust { background: var(--rust); border-color: var(--rust); }
  .pill.active.green { background: var(--green); border-color: var(--green); }
  .pill.active.amber { background: var(--amber); border-color: var(--amber); }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 7px;
    color: var(--chalk); font-size: 16px; padding: 10px 12px; box-sizing: border-box;
  }
  .theme-card { background: rgba(255,255,255,.015); border: 1px solid rgba(255,255,255,.025); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .theme-card.on { border-color: var(--rustDim); }
  .theme-head { width: 100%; background: none; border: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 0; text-align: left; }
  .theme-label { font-weight: 800; font-size: 15px; letter-spacing: .3px; text-transform: uppercase; color: var(--chalkDim); }
  .theme-card.on .theme-label { color: var(--chalk); }
  .theme-hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .checkbox { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.on { border-color: var(--rust); background: var(--rust); color: var(--chalk); font-weight: 900; }
  .theme-body { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .rpe-ladder { display: flex; align-items: flex-end; gap: 4px; height: 52px; }
  .rpe-bar { flex: 1; border: none; border-radius: 3px; cursor: pointer; background: var(--surfaceRaised); padding: 0; }
  .rpe-bar.on { background: linear-gradient(180deg, var(--rust), var(--rustDim)); }
  .rpe-value { color: var(--rust); font-size: 18px; font-weight: 900; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
  .stat { flex: 1; min-width: 100px; }
  .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .stat-value { font-size: 22px; font-weight: 900; line-height: 1.3; }
  .history-item { display: block; width: 100%; text-align: left; background: var(--surface); border: none; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .badge { font-size: 11px; color: var(--chalkDim); background: var(--surfaceRaised); border-radius: 5px; padding: 3px 8px; margin-right: 4px; display: inline-block; margin-bottom: 4px; }
  .btn-outline { width: 100%; padding: 12px 0; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--chalkDim);
    font-size: 13px; font-weight: 700; letter-spacing: .3px; cursor: pointer; text-transform: uppercase; margin-top: 12px; }
  .error-banner { background: var(--rustDim); border: 1px solid var(--rust); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; color: var(--chalk); font-size: 12px; line-height: 1.4; }
  .status { color: var(--rust); font-size: 12px; font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-bottom: 6px; }
  .bar { flex: 1; background: var(--steel); border-radius: 2px; min-height: 2px; }
  .bar.max { background: var(--rust); }
  .bars-axis { display: flex; gap: 4px; }
  .bars-axis span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); }
  /* Cercle de respiration : contours en dégradé transparent (voir
     breathing-circle-glow, dont le flou/l'opacité varient avec la phase
     inspiration/expiration dans updateBreathingVisual) + un effet d'eau —
     deux taches de couleur qui dérivent lentement en boucle, indépendamment
     du rythme respiratoire, pour donner un aspect vivant/liquide plutôt
     qu'un aplat de couleur figé. */
  /* Calques violet/rose superposés (voir setBreathingGlow) — transform et
     opacity transitionnent nativement de façon fluide, contrairement à une
     transition directe de la couleur d'un dégradé. */
  .breathing-glow-layer { position: absolute; inset: 0; border-radius: 50%; transform-origin: center; transition: transform 0.6s ease-in-out, opacity 0.6s ease-in-out; }
  .breathing-water-blob { position: absolute; border-radius: 50%; mix-blend-mode: overlay; opacity: 0.22; }
  .breathing-water-blob.b1 { width: 160%; height: 160%; top: -50%; left: -45%; background: radial-gradient(circle, #fff 0%, transparent 58%); animation: breathing-water-drift-1 9s ease-in-out infinite; }
  .breathing-water-blob.b2 { width: 140%; height: 140%; top: 30%; left: 15%; background: radial-gradient(circle, #fff 0%, transparent 55%); animation: breathing-water-drift-2 7s ease-in-out infinite; }
  .breathing-water-blob.b3 { width: 125%; height: 125%; top: -15%; left: 45%; background: radial-gradient(circle, #fff 0%, transparent 55%); animation: breathing-water-drift-3 12.5s ease-in-out infinite; }
  @keyframes breathing-water-drift-1 {
    0%, 100% { transform: translate(0, 0) scale(1); filter: blur(3px) hue-rotate(0deg); }
    50% { transform: translate(28%, 22%) scale(1.35); filter: blur(7px) hue-rotate(-22deg); }
  }
  @keyframes breathing-water-drift-2 {
    0%, 100% { transform: translate(0, 0) scale(1); filter: blur(4px) hue-rotate(0deg); }
    50% { transform: translate(-26%, -28%) scale(0.75); filter: blur(2px) hue-rotate(20deg); }
  }
  @keyframes breathing-water-drift-3 {
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); filter: blur(5px); }
    50% { transform: translate(-18%, 24%) rotate(35deg) scale(1.2); filter: blur(2px); }
  }
</style>
</head>
<body>
<div id="auth-gate" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px">
    <span style="color:var(--chalkDim)">MOVEMENT </span><span style="background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent">PRACTICE ✦ SUIVI</span>
  </div>
  <div id="auth-title" style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;color:var(--chalkDim)">Connexion</div>
  <input type="email" id="auth-email" placeholder="Email" style="width:100%;max-width:280px;margin-bottom:10px;text-align:center" autocomplete="username" />
  <input type="password" id="auth-password" placeholder="Mot de passe" style="width:100%;max-width:280px;margin-bottom:12px;text-align:center" autocomplete="current-password" />
  <button id="auth-submit" style="width:100%;max-width:280px;padding:13px 0;background:var(--gradient);border:none;border-radius:8px;color:var(--bg);font-size:13px;font-weight:900;letter-spacing:.3px;cursor:pointer;text-transform:uppercase">Se connecter</button>
  <button id="auth-toggle" style="margin-top:14px;background:none;border:none;color:var(--steel);font-size:12px;font-weight:700;cursor:pointer">Première visite ? Créer un compte</button>
  <div id="auth-error" class="muted" style="margin-top:10px;font-size:12px;text-align:center;max-width:280px;display:none"></div>
</div>
<script>
// Remplace l'ancien mot de passe partagé (vérifié côté client, contournable
// en un clic dans les DevTools) par un vrai compte Supabase Auth. Les
// policies RLS de la base n'acceptent plus que les requêtes authentifiées
// avec ce compte : la clé anon seule (visible plus bas dans ce fichier) ne
// donne désormais accès à aucune donnée.
const SUPABASE_URL = "https://zwltvhjitrvlrhbivdfm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bHR2aGppdHJ2bHJoYml2ZGZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTMxMjcsImV4cCI6MjEwMjg4OTEyN30.hTD6h2r9dKdKaJ15vcFU6eN8WScA1rr_nT2dNByT6co";

// Un fetch() sans réponse ne rejette jamais tout seul — sur un réseau mobile
// qui reconnecte encore (typiquement juste après l'ouverture de l'appli), la
// requête peut rester en attente indéfiniment. Résultat observé : l'écran
// reste totalement vide au lancement (le Promise.all du démarrage ne se
// termine jamais), et il fallait changer d'onglet puis revenir pour
// relancer un nouvel essai qui, lui, aboutissait. Un délai explicite fait
// échouer la requête au lieu de rester bloquée, pour que les .catch() déjà
// en place partout dans l'appli reprennent la main avec leurs valeurs de repli.
function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(function() { controller.abort(); }, ms || 12000);
  return fetch(url, Object.assign({}, options, { signal: controller.signal }))
    .finally(function() { clearTimeout(timer); });
}

// Planning réel des cours : lu directement depuis le site de réservation
// (mpb-booking), pas depuis une copie locale qui se désynchronisait dès que
// le planning changeait sur le site. Ces tables (cours/semaine_reference/
// vacances) sont en lecture publique côté mpb-booking (le site affiche le
// planning aux visiteurs non connectés) — pas besoin du compte Auth du
// tracker pour les lire, une simple clé anon suffit.
const MPB_BOOKING_URL = "https://aquvwqtwufdjlsjrqhux.supabase.co";
const MPB_BOOKING_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxdXZ3cXR3dWZkamxzanJxaHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjQ0ODMsImV4cCI6MjEwMTQwMDQ4M30.CvYj7K1bJ4yqibiyShkzh64h7wDeJKq91DdeDBBn6_A";
async function mpbBookingRequest(path) {
  const res = await fetchWithTimeout(MPB_BOOKING_URL + "/rest/v1/" + path, {
    headers: { apikey: MPB_BOOKING_KEY, Authorization: "Bearer " + MPB_BOOKING_KEY },
  });
  if (!res.ok) throw new Error("mpb-booking " + res.status);
  return res.json();
}

const AUTH_STORAGE_KEY = "mpb_session";
function getStoredSession() {
  try { return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || "null"); } catch (e) { return null; }
}
function storeSession(tokenResponse) {
  if (!tokenResponse) { localStorage.removeItem(AUTH_STORAGE_KEY); return; }
  localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
    access_token: tokenResponse.access_token,
    refresh_token: tokenResponse.refresh_token,
    expires_at: Date.now() + (tokenResponse.expires_in || 3600) * 1000,
  }));
}
async function authRequest(path, body) {
  const res = await fetchWithTimeout(SUPABASE_URL + "/auth/v1/" + path, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(function() { return {}; });
  if (!res.ok) throw new Error(data.error_description || data.msg || data.error || ("Erreur " + res.status));
  return data;
}
// Renvoie un access_token valide (rafraîchi si besoin), ou null si aucune
// session active. Le refresh token Supabase est à usage unique : plusieurs
// appels sb() concurrents (ex. Promise.all au démarrage) pourraient sinon
// déclencher deux refresh en parallèle avec le même refresh token et casser
// la session — on partage donc le rafraîchissement en cours au lieu d'en
// lancer un nouveau.
let refreshInFlight = null;
async function ensureAccessToken() {
  const s = getStoredSession();
  if (!s) return null;
  if (s.expires_at - Date.now() > 60000) return s.access_token;
  if (!refreshInFlight) {
    refreshInFlight = authRequest("token?grant_type=refresh_token", { refresh_token: s.refresh_token })
      .then(function(fresh) { storeSession(fresh); return fresh.access_token; })
      .catch(function() { storeSession(null); return null; })
      .finally(function() { refreshInFlight = null; });
  }
  return refreshInFlight;
}
function logout() { storeSession(null); location.reload(); }

(function() {
  const gate = document.getElementById("auth-gate");
  let mode = "signin";

  function showMessage(msg, isError) {
    const el = document.getElementById("auth-error");
    el.textContent = msg || "";
    el.style.display = msg ? "block" : "none";
    el.style.color = isError ? "var(--red)" : "var(--chalkDim)";
  }
  function setMode(m) {
    mode = m;
    document.getElementById("auth-title").textContent = mode === "signup" ? "Créer mon compte" : "Connexion";
    document.getElementById("auth-submit").textContent = mode === "signup" ? "Créer le compte" : "Se connecter";
    document.getElementById("auth-toggle").textContent = mode === "signup" ? "J'ai déjà un compte" : "Première visite ? Créer un compte";
    showMessage("");
  }
  function onAuthed() {
    gate.style.display = "none";
    if (window.mpbOnAuthed) window.mpbOnAuthed();
  }

  async function trySubmit() {
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    if (!email || !password) { showMessage("Renseigne un email et un mot de passe.", true); return; }
    const btn = document.getElementById("auth-submit");
    btn.disabled = true;
    showMessage(mode === "signup" ? "Création du compte…" : "Connexion…");
    try {
      if (mode === "signup") {
        const data = await authRequest("signup", { email: email, password: password });
        if (data.access_token) {
          storeSession(data);
          onAuthed();
        } else {
          showMessage("Compte créé — vérifie ta boîte mail pour confirmer, puis reconnecte-toi ici.");
          setMode("signin");
        }
      } else {
        const data = await authRequest("token?grant_type=password", { email: email, password: password });
        storeSession(data);
        onAuthed();
      }
    } catch (e) {
      showMessage(e.message, true);
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("auth-submit").addEventListener("click", trySubmit);
  document.getElementById("auth-password").addEventListener("keydown", function(e) { if (e.key === "Enter") trySubmit(); });
  document.getElementById("auth-toggle").addEventListener("click", function() { setMode(mode === "signup" ? "signin" : "signup"); });

  // Session déjà valide (ou rafraîchissable) : on saute directement le gate.
  ensureAccessToken().then(function(token) { if (token) onAuthed(); });
})();
</script>

<script>
// ---------------- Supabase ----------------
// SUPABASE_URL / SUPABASE_KEY / ensureAccessToken() sont définis dans le
// script du gate d'authentification plus haut (même page, même portée).
async function sb(path, options) {
  options = options || {};
  const token = await ensureAccessToken();
  if (!token) {
    const gate = document.getElementById("auth-gate");
    if (gate) gate.style.display = "flex";
    throw new Error("Session expirée — reconnecte-toi.");
  }
  const res = await fetchWithTimeout(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, options, {
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    }, options.headers || {})
  }));
  if (!res.ok) {
    const text = await res.text().catch(function(){ return ""; });
    throw new Error("Supabase " + res.status + ": " + text);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------------- Constantes ----------------
const THEMES = [
  { id: "tirage", label: "Tirage", hint: "traction, rowing", neural: 1.05, tendino: 1.2 },
  { id: "poussee", label: "Poussée", hint: "push, dips, pompes", neural: 1.05, tendino: 1.2 },
  { id: "complet", label: "Mouvement complet", hint: "muscle-up, skin the cat", neural: 1.2, tendino: 1.3 },
  { id: "handstand", label: "Handstand", hint: "ATR, appui tendu, presses", neural: 1.4, tendino: 1.0 },
  { id: "arm_balance", label: "Arm Balance", hint: "crow, planche, figures d'appui", neural: 1.35, tendino: 1.0 },
  { id: "locomotion", label: "Locomotion", hint: "quadrupédie, mains, arm balance, sol complexe", neural: 1.30, tendino: 1.0 },
  { id: "altinha", label: "Altinha", hint: "jonglage, réactivité, coordination", neural: 1.15, tendino: 1.0 },
  { id: "bas", label: "Bas du corps", hint: "jambes, mobilité", neural: 1.0, tendino: 1.5 }
];
const CONTRACTIONS = [
  { id: "dynamique", label: "Dynamique" },
  { id: "isometrique", label: "Isométrique" },
  { id: "excentrique", label: "Excentrique" },
  { id: "mixte", label: "Mixte" },
];
// Isométrique : preuves mitigées mais mécanisme de fatigue nerveuse/vasculaire
// réel (compression soutenue) — bonus modéré maintenu.
// Excentrique : coût métabolique immédiat en réalité PLUS FAIBLE que le
// concentrique (moins de ponts actine-myosine, titine élastique) — mais dommage
// structurel et fatigue différée plus marqués (DOMS, récupération plus longue).
// Le bonus reflète donc un coût de récupération, pas un coût de séance immédiat.

// ---------------- Utilitaires ----------------
// toISOString() convertit en UTC : entre minuit et ~1h-2h du matin (heure de
// Paris), ça renvoyait encore la date d'hier. On formate donc la date locale
// du navigateur directement, sans passer par l'UTC.
function localDateISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayISO() { return localDateISO(new Date()); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return localDateISO(d); }
function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
}
function avgOf(arr) { return arr.length ? arr.reduce(function(s,v){return s+v;},0) / arr.length : null; }
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function getWeekLetter(dateStr, ref) {
  const refMonday = new Date(ref.date_lundi_reference + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  const day = target.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const targetMonday = new Date(target);
  targetMonday.setDate(target.getDate() + diffToMonday);
  const weeksDiff = Math.round((targetMonday - refMonday) / (7 * 86400000));
  const isRefWeek = weeksDiff % 2 === 0;
  return isRefWeek ? ref.semaine_ce_lundi : (ref.semaine_ce_lundi === "A" ? "B" : "A");
}
function isInVacation(dateStr, vacations) { return vacations.some(function(v){ return dateStr >= v.date_debut && dateStr <= v.date_fin; }); }
function getScheduledClasses(dateStr) {
  if (isInVacation(dateStr, SCHEDULE_VACATIONS)) return [];
  const jsDay = new Date(dateStr + "T00:00:00").getDay();
  const week = getWeekLetter(dateStr, SCHEDULE_REFERENCE);
  return CLASS_SCHEDULE.filter(function(c){ return c.actif && c.jour_semaine === jsDay && c.semaine === week; });
}
// Le test de préhension n'est demandé comme log obligatoire que les jours
// avec un cours au planning, plus une exception explicitement demandée par
// l'utilisateur : le vendredi des semaines B (jour sans cours au planning
// actuel, mais où il a le temps de le faire), voir conversation du 2026-09.
// Les autres jours de récupération restent des jours de log volontaire —
// le bouton Préhension reste disponible, juste plus compté comme en attente.
function isGripDayRequired(dateStr) {
  if (getScheduledClasses(dateStr).length > 0) return true;
  const jsDay = new Date(dateStr + "T00:00:00").getDay();
  return jsDay === 5 && getWeekLetter(dateStr, SCHEDULE_REFERENCE) === "B";
}
function deriveDurationPreset(minutes) {
  if (!minutes) return null;
  const match = DURATIONS.find(function(d){ return d.minutes === Number(minutes); });
  return match ? match.id : "plus";
}
function sessionFromClass(c) {
  if (!c) return null;
  const h1 = c.heure_debut.split(":").map(Number), h2 = c.heure_fin.split(":").map(Number);
  const duration = WARMUP_MINUTES + ((h2[0]*60+h2[1]) - (h1[0]*60+h1[1]));
  const entries = {};
  (DISCIPLINE_TO_THEMES[c.discipline] || []).forEach(function(id) { entries[id] = { contraction: "dynamique", rpe: 0 }; });
  return { entries: entries, goal: null, duration: duration, durationPreset: deriveDurationPreset(duration),
    achievement: null, intensity: 0, discipline: c.discipline, time: c.heure_debut.slice(0,5) };
}
function emptySession() { return { entries: {}, goal: null, durationPreset: null, duration: "", achievement: null, intensity: 0, discipline: null, time: "", participation: 1.0, niveau: "intermediaire" }; }

// Entrées "effectives" pour le calcul de charge et la sauvegarde — dérivées
// à la demande, sans jamais muter session.entries pendant l'affichage.
function getEffectiveEntries(s) {
  if (s.discipline === "Calisthenics") return s.entries || {};
  const singleThemeId = s.discipline ? SINGLE_THEME_DISCIPLINES[s.discipline] : null;
  if (singleThemeId) {
    // reps : seul champ que l'utilisateur édite manuellement pour une
    // discipline à thème unique (le reste — contraction/rpe/niveau — reste
    // dérivé du RPE global comme avant) ; conservé dans entries pour ne pas
    // ajouter de colonne DB.
    const storedReps = s.entries && s.entries[singleThemeId] ? s.entries[singleThemeId].reps : null;
    const e = {};
    e[singleThemeId] = { contraction: "dynamique", rpe: s.intensity || 0, niveau: s.niveau || "intermediaire", reps: storedReps };
    return e;
  }
  return {};
}

function computeLoad(s) {
  if (!s) return { sessionLoad: null, correctedLoad: null };
  const participation = s.participation != null ? s.participation : 1.0;
  const active = Object.entries(getEffectiveEntries(s)).filter(function(e){ return e[1].rpe > 0; });
  const totalRpe = active.reduce(function(sum,e){ return sum + e[1].rpe; }, 0);
  // Intensité effective : le RPE global si renseigné, sinon la moyenne des RPE
  // par thème — sans ce repli, une séance Calisthenics où seuls les thèmes
  // sont remplis (RPE global oublié) perdait toute sa charge (sessionLoad et
  // correctedLoad à null), alors que l'information existe bien par thème.
  const effectiveIntensity = s.intensity > 0 ? s.intensity : (active.length ? totalRpe / active.length : 0);
  const sessionLoad = effectiveIntensity > 0 && s.duration ? Math.round(effectiveIntensity * Number(s.duration)) : null;
  if (active.length === 0) return { sessionLoad: sessionLoad, correctedLoad: sessionLoad !== null ? Math.round(sessionLoad * participation) : null };
  const neuralFactor = active.reduce(function(sum,e){
    const t = THEMES.find(function(th){ return th.id === e[0]; });
    return sum + (t ? t.neural : 1) * e[1].rpe;
  }, 0) / totalRpe;
  const tendinoFactor = active.reduce(function(sum,e){
    const t = THEMES.find(function(th){ return th.id === e[0]; });
    return sum + (t ? t.tendino : 1) * e[1].rpe;
  }, 0) / totalRpe;
  const typeFactor = active.reduce(function(sum,e){
    const ty = e[1].type || s.goal;
    return sum + (GOAL_FACTORS[ty] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const contractionFactor = active.reduce(function(sum,e){
    return sum + (CONTRACTION_FACTORS[e[1].contraction] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const niveauFactor = active.reduce(function(sum,e){
    return sum + (NIVEAU_FACTORS[e[1].niveau] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const correctedLoad = sessionLoad !== null ? Math.round(sessionLoad * neuralFactor * tendinoFactor * typeFactor * contractionFactor * niveauFactor * participation) : null;
  return { sessionLoad: sessionLoad, correctedLoad: correctedLoad };
}

// ---------------- Accès données ----------------
function rowToSession(row) {
  if (!row) return emptySession();
  return { entries: row.entries || {}, goal: row.goal || null, duration: row.duration_minutes || "",
    durationPreset: deriveDurationPreset(row.duration_minutes), achievement: row.achievement || null,
    intensity: row.intensity || 0, discipline: row.discipline || null, time: row.session_time || "",
    participation: row.participation != null ? Number(row.participation) : 1.0,
    niveau: row.niveau || "intermediaire" };
}
function sessionToRow(dateStr, s) {
  const load = computeLoad(s);
  return { session_date: dateStr, goal: s.goal, duration_minutes: s.duration ? Number(s.duration) : null,
    achievement: s.achievement, intensity: s.intensity || null, entries: s.entries || {}, discipline: s.discipline || null,
    session_time: s.time || null, participation: s.participation != null ? s.participation : 1.0,
    niveau: s.niveau || "intermediaire",
    session_load: load.sessionLoad, corrected_load: load.correctedLoad, updated_at: new Date().toISOString() };
}
async function saveSessionRow(dateStr, s) {
  const row = sessionToRow(dateStr, s);
  if (s.id) {
    await sb("sessions?id=eq." + s.id, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify(row) });
    return s.id;
  }
  const res = await sb("sessions", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(row) });
  return res && res[0] ? res[0].id : null;
}
async function deleteSessionRow(id) {

async function listSessions(limit) {

let formeSubTab = "jour";
async function renderForme() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  const today = todayISO();
  let errorMsg = "";
  // Toutes ces requêtes sont indépendantes les unes des autres — les lancer
  // en parallèle plutôt qu'en séquence évite d'accumuler une douzaine
  // d'allers-retours réseau l'un après l'autre (plusieurs secondes sur une
  // connexion mobile un peu lente, avec un dashboard qui reste bloqué sur
  // "Chargement…" en attendant). Chaque requête garde son propre repli en
  // cas d'échec isolé, exactement comme avant.
  const [sessions, wearable, workouts, monthMigraines, monthLifeload, lifeloadRows, napRows, todayFitSessions, todayTrips, migRows, todayMigRows, gripRows] = await Promise.all([
    listSessions(90).catch(function(e) { errorMsg = errorMsg || e.message; return []; }),
    listWearable(40).catch(function(e) { errorMsg = errorMsg || e.message; return []; }),
    sb("workout_sessions?select=day,training_effect_aerobic,training_effect_anaerobic&activity_type=eq.seance&order=day.desc&limit=60").catch(function() { return []; }),
    sb("migraines?select=day,intensity&order=day.desc&limit=60").catch(function() { return []; }),
    sb("lifeload?select=day,state&order=day.desc&limit=60").catch(function() { return []; }),
    sb("lifeload?day=eq." + today + "&select=state").catch(function() { return []; }),
    sb("naps?day=eq." + today + "&select=duration_min,quality").catch(function() { return []; }),
    sb("workout_sessions?day=eq." + today + "&activity_type=eq.seance&select=training_effect_aerobic,training_effect_anaerobic,matched_discipline").catch(function() { return []; }),
    sb("workout_sessions?day=eq." + today + "&activity_type=eq.trajet&select=training_effect_aerobic,training_effect_anaerobic").catch(function() { return []; }),
    sb("migraines?select=day").catch(function() { return []; }),
    sb("migraines?day=eq." + today + "&select=intensity").catch(function() { return []; }),
    sb("grip_strength?select=day,value_kg&order=day.desc&limit=30").catch(function() { return []; }),
  ]);

  const todayTotalLoad = sessions.filter(function(s){ return s.date === today; }).reduce(function(s,x){ return s + (x.correctedLoad || 0); }, 0);
  const todayWearable = wearable.find(function(w){ return w.day === today; }) || null;
  const wearable7 = wearable.filter(function(w){ return w.day >= daysAgo(7); });

  let streak = 0;
  for (let i = 0; ; i++) {
    const d = daysAgo(i);
    const has = sessions.some(function(s){ return s.date === d && s.correctedLoad; });
    if (i === 0 && !has) break;
    if (!has) break;
    streak++;
  }

  // Interprétation + indicateur de forme (charge + FC repos + VFC + stress)
  let hrDiff = null, stressDiff = null, loadRatio = null, hrvDiff = null;
  const lines = [];
  const hrBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.hr_resting != null; }).map(function(w){ return w.hr_resting; }));
  if (todayWearable && todayWearable.hr_resting != null && hrBaseline != null) {
    hrDiff = todayWearable.hr_resting - hrBaseline;
    // Seuils calibrés sur la littérature (variation 3-4bpm normale au quotidien ;
    // 5+ bpm = signal significatif de fatigue/surcharge ; 10+ bpm = signal fort,
    // parfois précurseur de maladie, cf. Friman & Wesslén 2000).
    if (hrDiff >= 10) lines.push({ tone: "warn", text: "FC repos à " + todayWearable.hr_resting + " bpm, " + hrDiff.toFixed(1) + " au-dessus de ta moyenne récente (" + hrBaseline.toFixed(0) + ") — écart marqué, vigilance (fatigue ou début de maladie possibles)." });
    else if (hrDiff >= 5) lines.push({ tone: "warn", text: "FC repos à " + todayWearable.hr_resting + " bpm, " + hrDiff.toFixed(1) + " au-dessus de ta moyenne récente (" + hrBaseline.toFixed(0) + ") — fatigue possible." });
    else if (hrDiff <= -3) lines.push({ tone: "good", text: "FC repos à " + todayWearable.hr_resting + " bpm, plus basse que d'habitude — bon signe." });
  }
  const hrvBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.hrv_avg != null; }).map(function(w){ return w.hrv_avg; }));
  let hrvPct = null;
  if (todayWearable && todayWearable.hrv_avg != null && hrvBaseline != null && hrvBaseline > 0) {
    hrvDiff = todayWearable.hrv_avg - hrvBaseline;
    hrvPct = (hrvDiff / hrvBaseline) * 100;
    // Seuils basés sur la littérature HRV : 10-20% de fluctuation jour/jour est normal,
    // une baisse >20% vs baseline est généralement considérée significative (Lifestack,
    // MyHRV) ; Kiviniemi et al. utilisent 1 écart-type sous la moyenne sur 10 jours.
    if (hrvPct <= -20) lines.push({ tone: "warn", text: "VFC à " + todayWearable.hrv_avg.toFixed(0) + " ms, " + hrvPct.toFixed(0) + "% sous ta moyenne récente (" + hrvBaseline.toFixed(0) + " ms) — écart significatif, système nerveux sous tension." });
    else if (hrvPct >= 15) lines.push({ tone: "good", text: "VFC à " + todayWearable.hrv_avg.toFixed(0) + " ms, en nette hausse — bon signe de récupération." });
  }
  const stressBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.stress_avg != null; }).map(function(w){ return w.stress_avg; }));
  if (todayWearable && todayWearable.stress_avg != null && stressBaseline != null) {
    stressDiff = todayWearable.stress_avg - stressBaseline;
    if (stressDiff >= 8) lines.push({ tone: "warn", text: "Stress du jour plus élevé que d'habitude (" + todayWearable.stress_avg.toFixed(0) + " vs " + stressBaseline.toFixed(0) + ")." });
  }
  const loaded = sessions.filter(function(s){ return s.correctedLoad != null; }).slice().reverse();
  // Modèle Fitness-Fatigue (Banister et al. 1975, toujours la référence
  // utilisée par les plateformes sérieuses type TrainingPeaks) : la fatigue
  // s'accumule à chaque séance et se dissipe de façon exponentielle — pas
  // d'un coup au réveil — avec une constante de temps d'environ 7 jours
  // (fatigue aiguë) contre 28 jours pour la forme de fond (fitness/tolérance
  // chronique). Remplace l'ancienne moyenne brute des 3 dernières séances,
  // qui ne captait pas cette notion de report d'un jour sur l'autre.
  const dailyLoad = {};
  loaded.forEach(function(s) { dailyLoad[s.date] = (dailyLoad[s.date] || 0) + s.correctedLoad; });
  const allDates = Object.keys(dailyLoad).sort();
  let atl = null, ctl = null; // fatigue aiguë (7j) / forme chronique (28j)
  let atlWake = null; // fatigue accumulée jusqu'à hier, "au réveil" — avant la
  // séance du jour, pour ne pas la compter deux fois avec "Dépense du jour"
  const tauATL = 7, tauCTL = 28;
  const decayATL = Math.exp(-1 / tauATL), decayCTL = Math.exp(-1 / tauCTL);
  if (allDates.length) {
    let cursor = new Date(allDates[0]);
    const end = new Date(today);
    while (cursor <= end) {
      const d = cursor.toISOString().slice(0, 10);
      if (d === today) atlWake = atl; // valeur juste avant d'intégrer aujourd'hui
      const w = dailyLoad[d] || 0;
      atl = atl == null ? w : atl * decayATL + w * (1 - decayATL);
      ctl = ctl == null ? w : ctl * decayCTL + w * (1 - decayCTL);
      cursor.setDate(cursor.getDate() + 1);
    }
    if (atlWake == null) atlWake = atl; // si aujourd'hui hors historique (rare)
  }
  if (atl != null && ctl) {
    loadRatio = atl / ctl; // ACWR calculé proprement (EWMA), pas une moyenne de fenêtre
    // Seuils établis en sciences du sport (Gabbett et al.) : 0.8-1.3 = zone
    // favorable, >1.5 = risque accru, <0.8 = sous-sollicité récemment.
    if (loadRatio > 1.5) lines.push({ tone: "warn", text: "Fatigue accumulée nettement au-dessus de ta charge habituelle (ACWR " + loadRatio.toFixed(2) + ") — vraie zone à surveiller." });
    else if (loadRatio > 1.3) lines.push({ tone: "warn", text: "Fatigue accumulée un peu élevée par rapport à ta charge habituelle (ACWR " + loadRatio.toFixed(2) + ")." });
    else if (loadRatio < 0.8) lines.push({ tone: "neutral", text: "Charge récente en retrait par rapport à ta charge habituelle — phase plus légère." });
    else lines.push({ tone: "good", text: "Fatigue accumulée dans une zone favorable, cohérente avec ta charge habituelle." });
  }
  if (todayTotalLoad) lines.push({ tone: "neutral", text: "Séance loggée aujourd'hui — charge corrigée " + todayTotalLoad + "." });
  else lines.push({ tone: "neutral", text: "Pas de séance enregistrée aujourd'hui." });

  // Sommeil de la nuit précédente — cible générale 7-9h (littérature sommeil/performance),
  // en dessous de 6h associé à une récupération significativement dégradée.
  let sleepMin = todayWearable && todayWearable.sleep_total_min != null ? todayWearable.sleep_total_min : null;
  if (sleepMin != null) {
    const h = Math.floor(sleepMin / 60), m = sleepMin % 60;
    const label = h + "h" + (m < 10 ? "0" : "") + m;
    if (sleepMin < 360) lines.push({ tone: "warn", text: "Sommeil de " + label + " cette nuit — nettement sous les 7-9h recommandées, récupération probablement incomplète." });
    else if (sleepMin < 420) lines.push({ tone: "neutral", text: "Sommeil de " + label + " — un peu court par rapport aux 7-9h habituellement recommandées." });
    else lines.push({ tone: "good", text: "Sommeil de " + label + " — dans la fourchette recommandée." });
  }

  // Fréquence respiratoire nocturne — signal stable (peu de bruit jour/jour), utilisé
  // par WHOOP notamment ; une hausse vs baseline personnelle précède souvent maladie
  // ou récupération incomplète après une charge d'entraînement élevée.
  const respBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.resp_rate_avg != null; }).map(function(w){ return w.resp_rate_avg; }));
  let respDiff = null;
  if (todayWearable && todayWearable.resp_rate_avg != null && respBaseline != null) {
    respDiff = todayWearable.resp_rate_avg - respBaseline;
    if (respDiff >= 2) lines.push({ tone: "warn", text: "Fréquence respiratoire nocturne à " + todayWearable.resp_rate_avg.toFixed(1) + " resp/min, au-dessus de ta moyenne (" + respBaseline.toFixed(1) + ") — à surveiller sur plusieurs nuits (signe précoce possible de fatigue ou début de maladie)." });
  }

  // Force de préhension (dynamomètre) — marqueur de fatigue neuromusculaire
  // validé en sciences du sport (proxy peu coûteux et rapide, à la place de
  // tests de saut type CMJ) : une chute vs ta propre moyenne récente signale
  // une récupération incomplète, indépendamment du ressenti subjectif. Le
  // bruit jour/jour est faible (contrairement à la VFC), d'où des seuils
  // plus serrés. Nécessite au moins 3 mesures précédentes pour une
  // comparaison fiable — pas de baseline sur une poignée de valeurs.
  const todayGripRow = gripRows.find(function(g){ return g.day === today; });
  const gripHistory = gripRows.filter(function(g){ return g.day !== today && g.day >= daysAgo(14); });
  const gripBaseline = gripHistory.length >= 3 ? avgOf(gripHistory.map(function(g){ return g.value_kg; })) : null;
  let gripPct = null;
  if (todayGripRow && gripBaseline != null && gripBaseline > 0) {
    gripPct = ((todayGripRow.value_kg - gripBaseline) / gripBaseline) * 100;
    if (gripPct <= -15) lines.push({ tone: "warn", text: "Force de préhension à " + todayGripRow.value_kg + " kg, " + gripPct.toFixed(0) + "% sous ta moyenne récente (" + gripBaseline.toFixed(1) + " kg) — fatigue neuromusculaire marquée, récupération probablement incomplète." });
    else if (gripPct <= -10) lines.push({ tone: "warn", text: "Force de préhension à " + todayGripRow.value_kg + " kg, " + gripPct.toFixed(0) + "% sous ta moyenne récente (" + gripBaseline.toFixed(1) + " kg) — signal de fatigue à surveiller." });
    else if (gripPct >= 8) lines.push({ tone: "good", text: "Force de préhension à " + todayGripRow.value_kg + " kg, en hausse — bon signe de fraîcheur neuromusculaire." });
  }

  const lifeload = (lifeloadRows && lifeloadRows[0]) ? lifeloadRows[0].state : null;

  const napQWeight = { bonne: 1.0, moyenne: 0.6, mauvaise: 0.2 };
  const todayNapMin = napRows.reduce(function(s, n) { return s + n.duration_min; }, 0);
  const todayNapEffective = napRows.reduce(function(s, n) { return s + n.duration_min * (napQWeight[n.quality] != null ? napQWeight[n.quality] : 0.6); }, 0);

  let todayMigraine = null;
  // Effort objectif du jour (fichiers .fit rattachés à un cours du planning)
  // — vient compléter le RPE déclaratif par une vraie mesure cardiaque,
  // automatiquement, sans ressaisie. Pondéré par les mêmes coefficients
  // neural ET tendino-articulaire que le RPE (littérature : la FC sous-estime
  // d'autant plus l'effort réel que la discipline est neuralement exigeante
  // ou sollicite fort les tendons/articulations — Handstand, Mobilité...).
  function neuralCoefficientForDiscipline(discipline, sessionNiveau) {
    if (!discipline) return 1;
    const niveauFactor = NIVEAU_FACTORS[sessionNiveau] || 1;
    const themeId = SINGLE_THEME_DISCIPLINES[discipline];
    if (themeId) {
      const t = THEMES.find(function(x){ return x.id === themeId; });
      return (t ? t.neural * t.tendino : 1) * niveauFactor;
    }
    if (discipline === "Calisthenics") {
      // Regarde ce qui a vraiment été loggé ce jour-là en Calisthenics
      // (thèmes cochés + RPE + niveau), pondéré comme dans computeLoad — pas
      // une moyenne générique des 3 thèmes possibles.
      const todayCaliEntries = sessions
        .filter(function(s) { return s.date === today && s.discipline === "Calisthenics"; })
        .reduce(function(acc, s) { return Object.assign(acc, s.entries); }, {});
      const active = Object.entries(todayCaliEntries).filter(function(e){ return e[1].rpe > 0; });
      const totalRpe = active.reduce(function(sum,e){ return sum + e[1].rpe; }, 0);
      if (active.length && totalRpe > 0) {
        return active.reduce(function(sum,e){
          const t = THEMES.find(function(th){ return th.id === e[0]; });
          const nf = NIVEAU_FACTORS[e[1].niveau] || 1;
          return sum + (t ? t.neural * t.tendino : 1) * nf * e[1].rpe;
        }, 0) / totalRpe;
      }
      // Repli si rien n'est encore loggé pour cette séance : moyenne des 3 thèmes.
      const caliThemes = THEMES.filter(function(t){ return ["tirage","poussee","complet"].indexOf(t.id) !== -1; });
      return avgOf(caliThemes.map(function(t){ return t.neural * t.tendino; }));
    }
    return 1;
  }
  const todayFitEffort = todayFitSessions.reduce(function(s, w) {
    const te = (Number(w.training_effect_aerobic) || 0) + (Number(w.training_effect_anaerobic) || 0);
    const matchedSession = sessions.find(function(s) { return s.date === today && s.discipline === w.matched_discipline; });
    return s + te * neuralCoefficientForDiscipline(w.matched_discipline, matchedSession ? matchedSession.niveau : null);
  }, 0);
  // Trajets à vélo du jour — coût réel mais modeste (pas de complexité
  // neurale particulière, coefficient neutre 1.0), pris en compte séparément
  // pour ne pas les confondre avec une vraie séance dans le récap.
  const todayTripCount = todayTrips.length;
  const todayTripEffort = todayTrips.reduce(function(s, w) { return s + (Number(w.training_effect_aerobic) || 0) + (Number(w.training_effect_anaerobic) || 0); }, 0);

  const migDays = migRows.map(function(r){ return r.day; });
  const history_migraines_count = migDays.length;
  let migraine_signature = null;
  if (migDays.length >= 5) {
    const migWearable = wearable.filter(function(w){ return migDays.indexOf(w.day) !== -1; });
    const baseWearable = wearable.filter(function(w){ return migDays.indexOf(w.day) === -1; });
    function avgF(arr, f) { const v = arr.map(function(w){return w[f];}).filter(function(x){return x!=null;}); return v.length ? avgOf(v) : null; }
    const bHr = avgF(baseWearable, "hr_resting"), mHr = avgF(migWearable, "hr_resting");
    const bHrv = avgF(baseWearable, "hrv_avg"), mHrv = avgF(migWearable, "hrv_avg");
    const bStress = avgF(baseWearable, "stress_avg"), mStress = avgF(migWearable, "stress_avg");
    const mSleep = avgF(migWearable, "sleep_total_min");
    migraine_signature = {
      hrDiff: (bHr != null && mHr != null) ? mHr - bHr : null,
      hrvPct: (bHrv != null && mHrv != null && bHrv > 0) ? ((mHrv - bHrv) / bHrv) * 100 : null,
      stressDiff: (bStress != null && mStress != null) ? mStress - bStress : null,
      sleepMin: mSleep,
    };
  }
  if (todayMigRows && todayMigRows.length) todayMigraine = Math.max.apply(null, todayMigRows.map(function(r) { return r.intensity || 5; }));

  let score = 100, signals = 0;
  if (hrDiff != null) { signals++; if (hrDiff >= 10) score -= 30; else if (hrDiff >= 5) score -= 15; else if (hrDiff >= 3) score -= 3; else if (hrDiff <= -3) score += 5; }
  if (hrvPct != null) { signals++; if (hrvPct <= -30) score -= 25; else if (hrvPct <= -20) score -= 15; else if (hrvPct <= -10) score -= 5; else if (hrvPct >= 15) score += 10; }
  // Seuils plus serrés que la VFC : le bruit jour/jour de la force de
  // préhension est faible (littérature : CV ~3-5%), donc un écart de 10-15%
  // est déjà un signal net, pas une fluctuation normale.
  if (gripPct != null) { signals++; if (gripPct <= -15) score -= 25; else if (gripPct <= -10) score -= 15; else if (gripPct <= -5) score -= 5; else if (gripPct >= 8) score += 10; }
  if (stressDiff != null) { signals++; if (stressDiff >= 10) score -= 25; else if (stressDiff >= 5) score -= 10; }
  if (loadRatio != null) { signals++; } // le score réagit désormais en continu via atlWake ci-dessous, pas juste à un seuil
  // Panier "charge / fatigue" — dépense du jour, fatigue accumulée, effort
  // .fit, trajets et ressenti négatif mesurent tous, en grande partie, la
  // MÊME réalité sous-jacente (une grosse période d'entraînement qui
  // fatigue). Les additionner sans limite comptait plusieurs fois le même
  // fait et pouvait à lui seul écraser tout le score. Plafonné en un seul
  // panier plutôt que chaque signal déduisant indépendamment sans limite.
  let loadFatigueBucket = 0;
  // Dépense d'énergie du jour — dégressif au fil des séances loguées
  // aujourd'hui, indépendamment de loadRatio (qui compare une tendance sur
  // plusieurs jours).
  let todayDepletion = 0;
  if (todayTotalLoad > 0) {
    signals++;
    todayDepletion = Math.min(35, Math.round(todayTotalLoad / 60));
    loadFatigueBucket -= todayDepletion;
  }
  // Fatigue accumulée "au réveil" — ce que les jours précédents laissent
  // encore aujourd'hui (modèle Fitness-Fatigue, décroissance exponentielle
  // ~7j), distincte de la dépense du jour même pour ne pas compter deux fois
  // une même séance. C'est une vraie déduction continue, proportionnelle au
  // niveau de fatigue reporté, pas juste un déclenchement à un seuil.
  let wakeFatigueDeduction = 0, freshnessBonus = 0;
  if (atlWake != null && atlWake > 0) {
    signals++;
    wakeFatigueDeduction = Math.min(30, Math.round(atlWake / 70));
    loadFatigueBucket -= wakeFatigueDeduction;
  }
  // Bonus explicite de fraîcheur — pas juste "moins de pénalité", un vrai
  // ajout quand ta fatigue accumulée est nettement sous ta charge chronique
  // habituelle (ACWR bas p/r à TA propre référence, pas un seuil générique).
  // Laissé hors du plafond : un bonus n'a pas besoin d'être limité.
  if (atlWake != null && ctl) {
    const wakeRatio = atlWake / ctl;
    if (wakeRatio < 0.8) {
      freshnessBonus = Math.min(10, Math.round((0.8 - wakeRatio) * 25));
      score += freshnessBonus;
    }
  }
  // Complément objectif : effet d'entraînement réel (FC seconde par seconde,
  // fichiers .fit rattachés au planning), en plus du RPE déclaratif —
  // automatique dès qu'une séance du jour est détectée par la montre.
  let todayFitDepletion = 0;
  if (todayFitEffort > 0) {
    signals++;
    todayFitDepletion = Math.min(15, Math.round(todayFitEffort * 3));
    loadFatigueBucket -= todayFitDepletion;
  }
  let todayTripDepletion = 0;
  if (todayTripEffort > 0) {
    signals++;
    todayTripDepletion = Math.min(8, Math.round(todayTripEffort * 3));
    loadFatigueBucket -= todayTripDepletion;
  }
  if (sleepMin != null) {
    signals++;
    // Plafond global du sommeil aligné sur les autres signaux physiologiques
    // (FC repos -30, VFC -25, Stress -25 max) — les plateformes de référence
    // (WHOOP : ~60% VFC, sommeil secondaire ; Fitbit : sommeil/VFC/activité à
    // peu près égaux) ne laissent jamais le sommeil dominer le score à lui
    // seul. Avant ce plafond, durée + stades pouvaient cumuler jusqu'à -41,
    // largement au-dessus de tout autre signal isolé.
    let sleepDeduction = 0;
    if (sleepMin < 300) sleepDeduction += 20; else if (sleepMin < 360) sleepDeduction += 12; else if (sleepMin < 420) sleepDeduction += 4; else if (sleepMin > 600) sleepDeduction += 4;
    // Qualité des stades, pas juste la durée — mêmes seuils que l'onglet
    // Sommeil (AASM/CDC) : profond <10% ou paradoxal <15% pénalisent, même
    // avec une durée totale correcte.
    if (todayWearable && todayWearable.sleep_deep_min != null && sleepMin > 0) {
      const deepPct = (todayWearable.sleep_deep_min / sleepMin) * 100;
      if (deepPct < 10) { sleepDeduction += 6; lines.push({ tone: "neutral", text: "Sommeil profond faible (" + Math.round(deepPct) + "%) malgré une durée correcte — pèse un peu sur le score." }); }
      if (todayWearable.sleep_rem_min != null) {
        const remPct = (todayWearable.sleep_rem_min / sleepMin) * 100;
        if (remPct < 15) { sleepDeduction += 6; lines.push({ tone: "neutral", text: "Sommeil paradoxal faible (" + Math.round(remPct) + "%) — à surveiller si ça se répète." }); }
      }
    }
    score -= Math.min(25, sleepDeduction);
  }
  if (respDiff != null) { signals++; if (respDiff >= 3) score -= 20; else if (respDiff >= 2) score -= 10; }
  if (todayMigraine != null) { signals++; score -= (10 + todayMigraine * 4); }
  // Sieste : bénéfice réel mais modéré sur la récupération (littérature sommeil),
  // pondéré par la qualité déclarée et plafonné pour ne pas compenser
  // artificiellement un vrai déficit de sommeil.
  if (todayNapMin > 0) {
    const napBonus = Math.min(8, Math.round(todayNapEffective / 5));
    score += napBonus;
    const qualNote = napBonus <= 1 ? " (qualité perçue faible, bénéfice limité)" : "";
    lines.push({ tone: napBonus >= 4 ? "good" : "neutral", text: "Sieste de " + todayNapMin + " min aujourd'hui" + qualNote + "." });
  }
  if (todayMigraine != null) lines.unshift({ tone: "warn", text: "Migraine enregistrée aujourd'hui (intensité " + todayMigraine + "/10) — pèse sur le score et la récupération recommandée." });

  // Effet d'entraînement officiel (aérobie/anaérobie, données Zepp/Firstbeat) —
  // même logique de ratio 3j récents vs référence que la charge, mais sur une
  // mesure validée par la montre plutôt qu'estimée par nous.
  const teVals = workouts.filter(function(w){ return w.training_effect_anaerobic != null; })
    .sort(function(a,b){ return a.day < b.day ? -1 : 1; });
  let teRatio = null;
  if (teVals.length >= 4) {
    const recent3 = teVals.slice(-3).map(function(w){ return w.training_effect_anaerobic; });
    const base10 = teVals.slice(-10).map(function(w){ return w.training_effect_anaerobic; });
    const recentAvg = avgOf(recent3), baseAvg = avgOf(base10);
    if (baseAvg > 0) {
      teRatio = recentAvg / baseAvg;
      signals++;
      if (teRatio > 1.6) { score -= 15; lines.push({ tone: "warn", text: "Effet d'entraînement anaérobie (données montre) nettement au-dessus de ta référence récente — sollicitation élevée à ne pas négliger dans ta récup." }); }
      else if (teRatio < 0.6 && recentAvg < 1) { lines.push({ tone: "neutral", text: "Effet d'entraînement récent plutôt faible (données montre) — cohérent avec une phase plus légère." }); }
    }
  }

  // Détection de motifs proches d'une migraine passée — comparaison directe à
  // ton propre historique, pas un diagnostic. Nécessite au moins 5 migraines
  // enregistrées pour éviter le surajustement sur un trop petit échantillon.
  let migraineAlert = null;
  if (todayMigraine == null && history_migraines_count >= 5 && migraine_signature) {
    let matches = 0, checked = 0;
    if (hrDiff != null && migraine_signature.hrDiff != null) { checked++; if (Math.sign(hrDiff) === Math.sign(migraine_signature.hrDiff) && Math.abs(hrDiff) >= Math.abs(migraine_signature.hrDiff) * 0.5) matches++; }
    if (hrvPct != null && migraine_signature.hrvPct != null) { checked++; if (Math.sign(hrvPct) === Math.sign(migraine_signature.hrvPct) && Math.abs(hrvPct) >= Math.abs(migraine_signature.hrvPct) * 0.5) matches++; }
    if (stressDiff != null && migraine_signature.stressDiff != null) { checked++; if (Math.sign(stressDiff) === Math.sign(migraine_signature.stressDiff) && Math.abs(stressDiff) >= Math.abs(migraine_signature.stressDiff) * 0.5) matches++; }
    if (sleepMin != null && migraine_signature.sleepMin != null) { checked++; if (sleepMin <= migraine_signature.sleepMin + 30) matches++; }
    if (checked >= 3 && matches / checked >= 0.75) {
      migraineAlert = "Tes signaux d'aujourd'hui ressemblent à ceux de tes migraines passées (" + history_migraines_count + " enregistrées) — pas une certitude, mais peut valoir le coup de rester attentif et de t'hydrater/te reposer si possible.";
    }
  }
  const LIFELOAD_IMPACT = { bien: 8, stresse: -12, fatigue: -18, malade: -40, courbature: -10, neutre: 0 };
  if (lifeload != null) { signals++; const impact = LIFELOAD_IMPACT[lifeload] || 0; if (impact < 0) loadFatigueBucket += impact; else score += impact; }
  // Le panier "charge / fatigue" est plafonné à -40 au total — un plafond
  // généreux (largement au-dessus de ce que produirait une vraie journée
  // difficile isolée), mais qui empêche 4-5 signaux corrélés de vider à eux
  // seuls tout le score. Les bonus (fraîcheur, sieste, LifeLoad positif)
  // restent hors panier, non plafonnés.
  score += Math.max(-40, loadFatigueBucket);
  score = Math.max(0, Math.min(100, score));
  let tier = "Données insuffisantes", tierColor = "muted", needRest = "–";
  if (signals > 0) {
    if (score >= 70) { tier = "Bonne"; tierColor = "green"; needRest = "Non — tu peux enchaîner"; }
    else if (score >= 40) { tier = "Suffisante"; tierColor = "amber"; needRest = "Optionnel — reste attentif"; }
    else { tier = "Insuffisante"; tierColor = "red"; needRest = "Oui — repos recommandé"; }
  }

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<div class="muted" style="margin-bottom:18px">' + formatDateLabel(today) + "</div>";

  html += '<div class="pill-row compact" style="margin-bottom:16px" id="forme-subtab-row">';
  [["jour","Aujourd'hui"],["tendance","Tendance"]].forEach(function(p) {
    html += '<button class="pill' + (formeSubTab === p[0] ? " active" : "") + '" data-subtab="' + p[0] + '">' + p[1] + "</button>";
  });
  html += "</div>";

  if (formeSubTab === "jour") {
    if (migraineAlert) {
      html += '<div class="error-banner" style="background:rgba(242,113,28,0.15);border-color:var(--rust)"><b>⚠ Signaux similaires à une migraine passée :</b> ' + esc(migraineAlert) + "</div>";
    }

    // Vigilance — 3 points de contrôle réels dans la journée (VFC mesurée sur
    // ce créneau précis, comparée à ta moyenne sur ce même créneau les jours
    // précédents). Une vraie baisse de VFC en temps réel est associée à la
    // somnolence dans la littérature (études de détection de somnolence au
    // volant, validées contre des mesures oculaires). On calcule ici le
    // dernier créneau atteint pour l'imbriquer dans l'anneau Forme.
    const VIG_WINDOWS = [
      { label: "Matin", hrvKey: "hrv_morning", lo: 6, hi: 9 },
      { label: "Après-midi", hrvKey: "hrv_afternoon", lo: 14, hi: 16 },
      { label: "Soir", hrvKey: "hrv_evening", lo: 17, hi: 19 },
    ];
    let vigPct = null, vigWindowLabel = null;
    VIG_WINDOWS.slice().reverse().forEach(function(w) {
      if (vigPct != null) return;
      const todayHrv = todayWearable ? todayWearable[w.hrvKey] : null;
      if (todayHrv == null) return;
      const baseVals = wearable.filter(function(x){ return x.day !== today && x[w.hrvKey] != null; }).map(function(x){ return x[w.hrvKey]; });
      const baseHrv = baseVals.length >= 3 ? avgOf(baseVals) : null;
      if (baseHrv == null || baseHrv <= 0) return;
      vigPct = Math.round(((todayHrv - baseHrv) / baseHrv) * 100);
      vigWindowLabel = w.label;
    });
    const vigScore = vigPct != null ? Math.max(0, Math.min(100, Math.round(85 + vigPct * 1.5))) : null;
    const vigTierNow = vigPct != null ? (vigPct <= -20 ? "red" : vigPct <= -10 ? "amber" : "green") : null;

    let stressTierNow = null, sLabel = null;
    if (todayWearable && todayWearable.stress_avg != null) {
      const sv = todayWearable.stress_avg;
      stressTierNow = sv >= 50 ? "red" : sv >= 30 ? "amber" : "green";
      sLabel = sv >= 50 ? "Élevé" : sv >= 30 ? "Modéré" : "Faible";
    }

    // Tendance FC repos + VFC sur 14 jours
    const trend14 = []; for (let i = 13; i >= 0; i--) trend14.push(daysAgo(i));
    const hrSeries = trend14.map(function(d) { const w = wearable.find(function(x) { return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: (w && w.hr_resting) || 0 }; });
    const hrvSeries = trend14.map(function(d) { const w = wearable.find(function(x) { return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: (w && w.hrv_avg) || 0 }; });
    const hasHrData = hrSeries.some(function(s) { return s.val > 0; });
    let hrTierNow = null, hrvTierNow = null;
    if (hasHrData) {
      const hrVals = hrSeries.map(function(s){return s.val;}).filter(function(v){return v>0;});
      const hrvVals = hrvSeries.map(function(s){return s.val;}).filter(function(v){return v>0;});
      hrTierNow = hrVals.length ? qualifyRHR(avgOf(hrVals)) : null;
      hrvTierNow = hrvVals.length ? qualifyHRV(avgOf(hrvVals)) : null;
    }

    // L'anneau Forme est lui-même déjà une vue d'ensemble en un coup d'œil —
    // il passe avant le récap détaillé, pas après. Volontairement sans le
    // cadre ".card" des autres indicateurs (fond noir uni, comme l'anneau
    // principal des apps Zepp/Garmin) pour le distinguer visuellement comme
    // l'indicateur central, pas juste une carte parmi d'autres.
    html += '<div style="margin:16px 0 28px"><div class="section-label" style="display:flex;justify-content:space-between;align-items:center"><span>' + sectionIcon("pulse") + 'Forme <span style="color:var(--green)">+ Vigilance</span></span><span>' + tierDot(tierColor) + '</span></div>';
    html += '<div style="padding:26px 0">' + formeVigilanceGaugeHtml(score, tierColor, tier, vigScore, todayWearable ? todayWearable.hr_resting : null) + "</div>";
    html += '<div style="text-align:center;padding-top:14px;border-top:1px solid var(--line);font-size:12px">' + statIconSvg("moon", "var(--muted)", 13) + ' Besoin de repos : <b style="color:var(--' + tierColor + ')">' + needRest + "</b></div>";
    if (vigScore != null) {
      html += '<div style="text-align:center;padding-top:10px;font-size:12px">' + statIconSvg("target", "var(--green)", 13) + ' Vigilance (' + vigWindowLabel + ') : <b style="color:var(--green)">' + (vigPct >= 0 ? "+" : "") + vigPct + '%</b> vs ta moyenne sur ce créneau</div>';
    } else {
      html += '<div class="muted" style="text-align:center;font-size:11px;padding-top:10px">' + statIconSvg("target", "var(--muted)", 12) + " Vigilance : pas encore de créneau comparable aujourd'hui</div>";
    }
    html += "</div>";

    // Check-list récapitulative — le reste des signaux, condensé. Une icône
    // stylisée par ligne (trait fin, cf. statIconSvg — pas un emoji de
    // plateforme) aide à repérer chaque signal au premier coup d'œil dans
    // une liste qui peut vite s'allonger.
    const checklist = [];
    checklist.push({ label: "Forme", icon: "person", iconColor: "var(--pink)", tier: tierColor, note: score + "/100 · " + tier });
    if (vigTierNow) checklist.push({ label: "Vigilance", icon: "target", iconColor: "var(--green)", tier: vigTierNow, note: (vigPct >= 0 ? "+" : "") + vigPct + "%" });
    if (stressTierNow) checklist.push({ label: "Stress", icon: "lightning", iconColor: "var(--amber)", tier: stressTierNow, note: Math.round(todayWearable.stress_avg) });
    if (hrTierNow) checklist.push({ label: "FC repos", icon: "heart", iconColor: "var(--red)", tier: hrTierNow, note: (todayWearable && todayWearable.hr_resting != null ? todayWearable.hr_resting : Math.round(avgOf(hrSeries.map(function(s){return s.val;}).filter(function(v){return v>0;})))) + " bpm" });
    if (hrvTierNow) checklist.push({ label: "VFC", icon: "pulse", iconColor: "var(--pink)", tier: hrvTierNow, note: (todayWearable && todayWearable.hrv_avg != null ? Math.round(todayWearable.hrv_avg) : Math.round(avgOf(hrvSeries.map(function(s){return s.val;}).filter(function(v){return v>0;})))) + " ms" });
    if (gripPct != null) checklist.push({ label: "Préhension", icon: "dumbbell", iconColor: "var(--chalkDim)", tier: gripPct <= -10 ? "red" : gripPct <= -5 ? "amber" : "green", note: todayGripRow.value_kg + " kg · " + (gripPct >= 0 ? "+" : "") + gripPct.toFixed(0) + "%" });
    if (sleepMin != null) checklist.push({ label: "Sommeil", icon: "moon", iconColor: "var(--steel)", tier: sleepMin < 360 ? "red" : sleepMin < 420 ? "amber" : "green", note: Math.floor(sleepMin/60) + "h" + Math.round(sleepMin%60).toString().padStart(2,'0') });
    if (loadRatio != null) checklist.push({ label: "Fatigue accumulée (réveil)", icon: "battery", iconColor: "var(--chalkDim)", tier: wakeFatigueDeduction >= 20 ? "red" : wakeFatigueDeduction >= 10 ? "amber" : "green", note: (freshnessBonus > 0 ? "+" + freshnessBonus : "-" + wakeFatigueDeduction) + " pts · ACWR " + loadRatio.toFixed(2) });
    if (todayTotalLoad > 0) checklist.push({ label: "Dépense du jour", icon: "flame", iconColor: "var(--rust)", tier: todayDepletion >= 25 ? "red" : todayDepletion >= 12 ? "amber" : "green", note: "-" + todayDepletion + " pts (charge " + todayTotalLoad + ")" });
    if (todayFitEffort > 0) checklist.push({ label: "Effort mesuré (.fit)", icon: "watch", iconColor: "var(--chalkDim)", tier: todayFitDepletion >= 10 ? "red" : todayFitDepletion >= 5 ? "amber" : "green", note: "-" + todayFitDepletion + " pts · " + todayFitSessions.map(function(w){return w.matched_discipline;}).filter(Boolean).join(", ") });
    if (todayTripEffort > 0) checklist.push({ label: "Trajets à vélo", icon: "bike", iconColor: "var(--green)", tier: "green", note: "-" + todayTripDepletion + " pts · " + todayTripCount + " trajet(s)" });
    if (todayMigraine != null) checklist.push({ label: "Migraine", icon: "bandage", iconColor: "var(--red)", tier: "red", note: todayMigraine + "/10" });
    checklist.push({ label: "Ressenti", icon: "thought", iconColor: "var(--chalkDim)", tier: lifeload === "bien" ? "green" : lifeload === "malade" ? "red" : ["stresse","fatigue"].indexOf(lifeload) !== -1 ? "amber" : "steel", note: lifeload || "Ø" });

    html += collapsibleCardHtml(sectionIcon("list") + 'Récap du jour');
    checklist.forEach(function(c) { html += checklistRowHtml(c); });
    html += '<div class="muted" style="font-size:10px;margin-top:6px">Indicatif — ne remplace pas ton ressenti ni un avis médical.</div></details>';
  } else {
    // Un bloc par métrique (barres semaine + courbe mois + 1 phrase) — jamais
    // plus, pour ne pas retomber dans le fourre-tout de l'ancien Dashboard.
    // Le détail (VFC/FC/stress croisés, migraines, discipline...) va dans le
    // Coach plutôt qu'ici.
    function recentVsBaseline(field) {
      const recent = wearable.filter(function(w){ return w.day >= daysAgo(6) && w[field] != null; }).map(function(w){ return w[field]; });
      const baseline = wearable.filter(function(w){ return w.day < daysAgo(6) && w.day >= daysAgo(29) && w[field] != null; }).map(function(w){ return w[field]; });
      return { recent: recent.length ? avgOf(recent) : null, baseline: baseline.length >= 3 ? avgOf(baseline) : null };
    }
    const migDaySet = migRows.map(function(r){ return r.day; });
    function weekBars(field) {
      const last7 = []; for (let i = 6; i >= 0; i--) last7.push(daysAgo(i));
      return last7.map(function(d) {
        const w = wearable.find(function(x){ return x.day === d; });
        return { label: formatDateLabel(d).slice(0,2), val: (w && w[field] != null) ? w[field] : 0, migraine: migDaySet.indexOf(d) !== -1 };
      });
    }
    function monthLine(field) {
      const month = []; for (let i = 29; i >= 0; i--) month.push(daysAgo(i));
      const b = [];
      for (let w = 0; w < 5; w++) {
        const bd = month.slice(w*6, w*6+6); if (!bd.length) continue;
        const vals = wearable.filter(function(x){ return bd.indexOf(x.day) !== -1; }).map(function(x){return x[field];}).filter(function(v){return v!=null;});
        b.push({ label: bd[0].slice(8,10)+"-"+bd[bd.length-1].slice(8,10), val: vals.length ? avgOf(vals) : 0, migraine: bd.some(function(d){ return migDaySet.indexOf(d) !== -1; }) });
      }
      return b;
    }
    function trendPhrase(rb, invert, unit, decimals) {
      if (rb.recent == null) return "Pas encore assez de données récentes pour une tendance.";
      if (rb.baseline == null) return "Pas encore de période de référence assez longue pour comparer.";
      const pct = rb.baseline ? ((rb.recent - rb.baseline) / rb.baseline) * 100 : 0;
      const favorable = invert ? pct <= -8 : pct >= 8;
      const unfavorable = invert ? pct >= 8 : pct <= -8;
      const recentTxt = rb.recent.toFixed(decimals) + unit;
      if (favorable) return "En amélioration sur le mois : " + recentTxt + " en moyenne cette semaine, contre " + rb.baseline.toFixed(decimals) + unit + " sur les semaines précédentes.";
      if (unfavorable) return "En dégradation sur le mois : " + recentTxt + " en moyenne cette semaine, contre " + rb.baseline.toFixed(decimals) + unit + " sur les semaines précédentes — à surveiller.";
      return "Stable sur le mois, autour de " + recentTxt + " en moyenne.";
    }

    const hrvRB = recentVsBaseline("hrv_avg");
    html += metricTrendSectionHtml("VFC", weekBars("hrv_avg"), monthLine("hrv_avg"), trendPhrase(hrvRB, false, " ms", 0), { unit: " ms", qualify: qualifyHRV });
    const hrRB = recentVsBaseline("hr_resting");
    html += metricTrendSectionHtml("FC repos", weekBars("hr_resting"), monthLine("hr_resting"), trendPhrase(hrRB, true, " bpm", 0), { unit: " bpm", qualify: qualifyRHR });
    const stressRB = recentVsBaseline("stress_avg");
    html += metricTrendSectionHtml("Stress", weekBars("stress_avg"), monthLine("stress_avg"), trendPhrase(stressRB, true, "", 0), { qualify: qualifyStress });

    const monthLL = monthLifeload.filter(function(l){ return l.day >= daysAgo(29); });
    if (monthLL.length >= 5) {
      const badCount = monthLL.filter(function(l){ return ["stresse","fatigue","malade","courbature"].indexOf(l.state) !== -1; }).length;
      html += '<div class="card"><div class="section-label">' + sectionIcon("thought") + 'Ressenti</div><div style="font-size:12px;color:var(--chalkDim)">' + badCount + " jour(s) difficile(s) sur " + monthLL.length + " renseigné(s) ce mois-ci.</div></div>";
    }
  }

  app.innerHTML = html;
  document.querySelectorAll('#forme-subtab-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { formeSubTab = btn.dataset.subtab; renderForme(); });
  });
}

let entrainementSubTab = "jour";
async function loadEntrainement() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  const today = todayISO();
  let errorMsg = "";
  const [sessions, gripRows, wearable, dismissedRows, trainingCoefs, migraines, kzWorkouts] = await Promise.all([
    listSessions(90).catch(function(e) { errorMsg = errorMsg || e.message; return []; }),
    sb("grip_strength?select=day,value_kg&order=day.desc&limit=30").catch(function() { return []; }),
    listWearable(14).catch(function() { return []; }),
    sb("dismissed_activity_flags?select=day").catch(function() { return []; }),
    sb("training_coefficients?select=*&order=category,label").catch(function() { return []; }),
    sb("migraines?select=day&order=day.desc&limit=60").catch(function() { return []; }),
    sb("workout_sessions?select=day,kz_leger_min,kz_intensif_min,kz_aerobique_min,kz_anaerobie_min,kz_vo2max_min,kz_hrmax_used,kz_hrrest_used&activity_type=eq.seance&kz_leger_min=not.is.null&order=day.desc&limit=60").catch(function() { return []; }),
  ]);
  const migDaySet = migraines.map(function(m){ return m.day; });

  const todaySessions = sessions.filter(function(s){ return s.date === today; });
  const todayTotalLoad = todaySessions.reduce(function(s,x){ return s + (x.correctedLoad || 0); }, 0);
  const loggedDisciplinesToday = todaySessions.map(function(s){ return s.discipline; });
  const classes = getScheduledClasses(today).filter(function(c){ return loggedDisciplinesToday.indexOf(c.discipline) === -1; });

  // Même modèle Fitness-Fatigue (Banister, EWMA 7j/28j) que le score Forme
  // (index.html, renderForme) — dupliqué ici volontairement : chaque onglet
  // reste autonome (sa propre requête, son propre calcul), comme Sommeil/
  // Santé le faisaient déjà avant cette refonte.
  const loaded = sessions.filter(function(s){ return s.correctedLoad != null; }).slice().reverse();
  const dailyLoad = {};
  loaded.forEach(function(s) { dailyLoad[s.date] = (dailyLoad[s.date] || 0) + s.correctedLoad; });
  const allDates = Object.keys(dailyLoad).sort();
  let atl = null, ctl = null, atlWake = null;
  const decayATL = Math.exp(-1/7), decayCTL = Math.exp(-1/28);
  if (allDates.length) {
    let cursor = new Date(allDates[0]);
    const end = new Date(today);
    while (cursor <= end) {
      const d = cursor.toISOString().slice(0, 10);
      if (d === today) atlWake = atl;
      const w = dailyLoad[d] || 0;
      atl = atl == null ? w : atl * decayATL + w * (1 - decayATL);
      ctl = ctl == null ? w : ctl * decayCTL + w * (1 - decayCTL);
      cursor.setDate(cursor.getDate() + 1);
    }
    if (atlWake == null) atlWake = atl;
  }
  const energyResult = computeTrainingEnergy(atlWake, ctl, todayTotalLoad);
  const energy = energyResult.energy;
  const energyTier = energy >= 70 ? "green" : energy >= 40 ? "amber" : "red";
  const energyLabel = energy >= 70 ? "Élevée" : energy >= 40 ? "Modérée" : "Faible";

  const gripHistory = gripRows.filter(function(g){ return g.day !== today && g.day >= daysAgo(14); });
  const gripBaseline = gripHistory.length >= 3 ? avgOf(gripHistory.map(function(g){ return g.value_kg; })) : null;
  let gripPct = null;
  if (todayGripRow && gripBaseline != null && gripBaseline > 0) gripPct = ((todayGripRow.value_kg - gripBaseline) / gripBaseline) * 100;

  const last14 = []; for (let i = 13; i >= 0; i--) last14.push(daysAgo(i));
  const toComplete = last14.map(function(d) {
    const w = wearable.find(function(x){ return x.day === d; });
    const hasSession = sessions.some(function(x){ return x.date === d && (x.discipline || x.intensity > 0 || x.duration); });
    const signal = w && ((w.intensity_avg && w.intensity_avg > 25) || (w.hr_max_activity && w.hr_max_activity > 140));
    return { date: d, signal: signal && !hasSession && dismissedDates.indexOf(d) === -1 };
  }).filter(function(j){ return j.signal; });

  let html = "";

  html += '<div class="muted" style="margin-bottom:18px">' + formatDateLabel(today) + "</div>";

  html += '<div class="pill-row compact" style="margin-bottom:16px" id="entrainement-subtab-row">';
  [["jour","Aujourd'hui"],["tendance","Tendance"]].forEach(function(p) {
    html += '<button class="pill' + (entrainementSubTab === p[0] ? " active" : "") + '" data-subtab="' + p[0] + '">' + p[1] + "</button>";
  });
  html += "</div>";

  if (entrainementSubTab === "jour") {
    if (scheduleLoadFailed) {
      html += '<div class="error-banner"><b>Planning non synchronisé :</b> le site de réservation n\'a pas répondu — le cours prévu ci-dessous peut être obsolète. Réessaie de rafraîchir (⟳ en haut).</div>';
    }
    if (toComplete.length) {
      html += '<div class="card amber"><div class="section-label">' + sectionIcon("watch") + 'Séances possibles non renseignées</div>';
      html += '<div class="muted" style="margin-bottom:10px">Activité détectée par la montre sans QCM correspondant.</div>';
      toComplete.forEach(function(g) {
        html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';

        html += '<button class="dismiss-flag" data-date="' + g.date + '" title="Ce n\'était pas une séance" style="background:var(--surfaceRaised);border:none;border-radius:8px;color:var(--muted);font-size:15px;padding:10px 12px;cursor:pointer">✕</button>';
        html += "</div>";
      });

    html += '<div style="padding:18px 0">' + singleScoreGaugeHtml(energy, 100, { sublabel: energyLabel, size: 300, icon: "dumbbell" }) + "</div>";
    html += "</div>";

    const checklist = [];
    checklist.push({ label: "Score d'entraînement", icon: "dumbbell", iconColor: "var(--rust)", tier: energyTier, note: energy + "/100 · " + energyLabel });
    if (energyResult.wakeDepletion > 0) checklist.push({ label: "Fatigue accumulée (réveil)", icon: "battery", iconColor: "var(--amber)", tier: energyResult.wakeDepletion >= 25 ? "red" : "amber", note: "-" + energyResult.wakeDepletion + " pts" });
    if (energyResult.sessionDepletion > 0) checklist.push({ label: "Dépense du jour", icon: "flame", iconColor: "var(--rust)", tier: energyResult.sessionDepletion >= 35 ? "red" : "amber", note: "-" + energyResult.sessionDepletion + " pts (charge " + todayTotalLoad + ")" });
    checklist.push({ label: "Cours prévu", icon: "watch", iconColor: "var(--steel)", tier: classes.length ? "steel" : "steel", note: classes.length ? classes.map(function(c){ return c.discipline; }).join(", ") : "Aucun" });

    html += collapsibleCardHtml(sectionIcon("list") + 'Récap du jour');
    checklist.forEach(function(c) { html += checklistRowHtml(c); });
    if (todayGripRow) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
      html += '<span style="font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + statIconSvg("dumbbell", "var(--pink)", 15) + 'Préhension <span class="muted" style="font-size:11px">· ' + todayGripRow.value_kg + ' kg' + (gripPct != null ? ' (' + (gripPct >= 0 ? "+" : "") + gripPct.toFixed(0) + '%)' : '') + '</span></span>';
      html += '<button id="grip-quick-delete" style="background:none;border:1px solid var(--line);border-radius:6px;color:var(--red);font-size:10px;font-weight:700;cursor:pointer;padding:3px 8px">Suppr.</button></div>';
    } else {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);gap:8px">';

  } else {

    else {

    const gripWeekBars = last7.map(function(d) { const g = gripRows.find(function(x){ return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: g ? g.value_kg : 0, migraine: migDaySet.indexOf(d) !== -1 }; });
    const gripMonthLine = [];

      if (kzGrand > 0) {

        kzRows.forEach(function(r) {

    html += '<div style="margin-top:10px">';
    html += '<div class="muted" style="font-size:11px;margin-bottom:12px">Multiplicateurs appliqués à la charge de séance selon la complexité neuromusculaire du thème, le type de contraction, et le type d\'effort visé.</div>';
    const coefGroups = [
      ["neural", "Complexité neurale par thème"], ["tendino", "Charge tendino-articulaire par thème"],
      ["contraction", "Type de contraction"], ["goal", "Type d'effort"], ["niveau", "Niveau de pratique"],
    ];
    coefGroups.forEach(function(g) {
      html += '<div class="section-label" style="margin-top:12px">' + g[1] + '</div>';
      trainingCoefs.filter(function(c) { return c.category === g[0]; }).forEach(function(c) {

  app.innerHTML = html;
