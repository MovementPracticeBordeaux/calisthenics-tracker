<style>
  :root {
    --bg: #0b0b0d; --surface: #1a1a1c; --surfaceRaised: #242426;
    --chalk: #F5F3EF; --chalkDim: #B8B2A6; --rust: #F2711C; --rustDim: #9a4a10;
    --pink: #EC4899; --purple: #A855F7;
    --steel: #8b6fb0; --muted: #9a9488; --line: #38352F;
    --gradient: linear-gradient(90deg, var(--rust), var(--pink), var(--purple));
    /* Palette néon des indicateurs (bon/moyen/mauvais) — vive et légèrement
       dégradée, cohérente avec l'esprit lumineux de la charte plutôt que des
       tons ternes classiques. */
    --green: #39FF8A; --greenDark: #0FA85A;
    --amber: #FFB020; --amberDark: #E0791A;
    --red: #FF3366; --redDark: #C41E52;
    --vigilance: #FF3EC8; --vigilanceDark: #A6157F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: system-ui, -apple-system, sans-serif; color: var(--chalk); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 12px 16px 40px; position: relative; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 9px 1px; border-radius: 7px; border: none; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1px; cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--gradient); color: var(--bg); font-weight: 900; }
  h1 { font-size: 26px; font-weight: 900; margin: 0; font-family: 'Arial Black', system-ui, sans-serif; text-transform: uppercase; letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card.amber { border-color: var(--amber); }
  .card.steel { border-color: var(--steel); }
  .section-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .pill-row { display: flex; gap: 8px; }
  .pill-row.compact { gap: 5px; }
  .pill { flex: 1; padding: 10px 0; border-radius: 7px; border: 1px solid var(--line); background: transparent;
    color: var(--chalkDim); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill-row.compact .pill { padding: 9px 2px; font-size: 11.5px; }
  .pill.active { background: var(--steel); color: var(--bg); border-color: var(--steel); }
  .pill.active.rust { background: var(--rust); border-color: var(--rust); }
  .pill.active.green { background: var(--green); border-color: var(--green); }
  .pill.active.amber { background: var(--amber); border-color: var(--amber); }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; background: var(--surfaceRaised); border: 1px solid var(--line); border-radius: 7px;
    color: var(--chalk); font-size: 16px; padding: 10px 12px; box-sizing: border-box;
  }
  .theme-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .theme-card.on { border-color: var(--rustDim); }
  .theme-head { width: 100%; background: none; border: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 0; text-align: left; }
  .theme-label { font-weight: 800; font-size: 15px; letter-spacing: .3px; text-transform: uppercase; color: var(--chalkDim); }
  .theme-card.on .theme-label { color: var(--chalk); }
  .theme-hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .checkbox { width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.on { border-color: var(--rust); background: var(--rust); color: var(--chalk); font-weight: 900; }
  .theme-body { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .rpe-ladder { display: flex; align-items: flex-end; gap: 4px; height: 52px; }
  .rpe-bar { flex: 1; border: none; border-radius: 3px; cursor: pointer; background: var(--surfaceRaised); padding: 0; }
  .rpe-bar.on { background: linear-gradient(180deg, var(--rust), var(--rustDim)); }
  .rpe-value { color: var(--rust); font-size: 18px; font-weight: 900; }
  .stat-row { display: flex; flex-wrap: wrap; gap: 16px; }
  .stat { flex: 1; min-width: 100px; }
  .stat-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .4px; }
  .stat-value { font-size: 22px; font-weight: 900; line-height: 1.3; }
  .history-item { display: block; width: 100%; text-align: left; background: var(--surface); border: none; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; }
  .badge { font-size: 11px; color: var(--chalkDim); background: var(--surfaceRaised); border-radius: 5px; padding: 3px 8px; margin-right: 4px; display: inline-block; margin-bottom: 4px; }
  .btn-outline { width: 100%; padding: 12px 0; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--chalkDim);
    font-size: 13px; font-weight: 700; letter-spacing: .3px; cursor: pointer; text-transform: uppercase; margin-top: 12px; }
  .error-banner { background: var(--rustDim); border: 1px solid var(--rust); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; color: var(--chalk); font-size: 12px; line-height: 1.4; }
  .status { color: var(--rust); font-size: 12px; font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 56px; margin-bottom: 6px; }
  .bar { flex: 1; background: var(--steel); border-radius: 2px; min-height: 2px; }
  .bar.max { background: var(--rust); }
  .bars-axis { display: flex; gap: 4px; }
  .bars-axis span { flex: 1; text-align: center; font-size: 9px; color: var(--muted); }
</style>

<script>
// ---------------- Supabase ----------------
const SUPABASE_URL = "https://zwltvhjitrvlrhbivdfm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3bHR2aGppdHJ2bHJoYml2ZGZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMTMxMjcsImV4cCI6MjEwMjg4OTEyN30.hTD6h2r9dKdKaJ15vcFU6eN8WScA1rr_nT2dNByT6co";

async function sb(path, options) {
  options = options || {};
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, options, {
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    }, options.headers || {})
  }));
  if (!res.ok) {
    const text = await res.text().catch(function(){ return ""; });
    throw new Error("Supabase " + res.status + ": " + text);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------------- Constantes ----------------
const THEMES = [
  { id: "tirage", label: "Tirage", hint: "traction, rowing", neural: 1.05, tendino: 1.2 },
  { id: "poussee", label: "Poussée", hint: "push, dips, pompes", neural: 1.05, tendino: 1.2 },
  { id: "complet", label: "Mouvement complet", hint: "muscle-up, skin the cat", neural: 1.2, tendino: 1.3 },
  { id: "handstand", label: "Handstand", hint: "ATR, appui tendu, presses", neural: 1.4, tendino: 1.0 },
  { id: "arm_balance", label: "Arm Balance", hint: "crow, planche, figures d'appui", neural: 1.35, tendino: 1.0 },
  { id: "locomotion", label: "Locomotion", hint: "quadrupédie, mains, arm balance, sol complexe", neural: 1.30, tendino: 1.0 },
  { id: "altinha", label: "Altinha", hint: "jonglage, réactivité, coordination", neural: 1.15, tendino: 1.0 },
  { id: "bas", label: "Bas du corps", hint: "jambes, mobilité", neural: 1.0, tendino: 1.5 }
];
const CONTRACTIONS = [
  { id: "dynamique", label: "Dynamique" },
  { id: "isometrique", label: "Isométrique" },
  { id: "excentrique", label: "Excentrique" },
  { id: "mixte", label: "Mixte" },
];
// Isométrique : preuves mitigées mais mécanisme de fatigue nerveuse/vasculaire
// réel (compression soutenue) — bonus modéré maintenu.
// Excentrique : coût métabolique immédiat en réalité PLUS FAIBLE que le
// concentrique (moins de ponts actine-myosine, titine élastique) — mais dommage
// structurel et fatigue différée plus marqués (DOMS, récupération plus longue).
// Le bonus reflète donc un coût de récupération, pas un coût de séance immédiat.
const CONTRACTION_FACTORS = { dynamique: 1.0, isometrique: 1.15, excentrique: 1.10, mixte: 1.05 };
const GOALS = [{ id: "force", label: "Force" }, { id: "endurance_force", label: "End. force" }, { id: "endurance", label: "Endurance" }, { id: "hybride", label: "Hybride" }];
const GOAL_FACTORS = { force: 1.0, endurance_force: 1.15, endurance: 1.25, hybride: 1.20 };
// Niveau de pratique — les figures/mouvements travaillés dans un thème
// progressent avec le niveau (ex. Handstand au mur -> libre -> figures ;
// Calisthenics dips/tractions -> skin the cat/L-sit -> muscle-up), avec une
// charge tendino-musculaire qui augmente en conséquence.
const NIVEAUX = [{ id: "debutant", label: "Débutant" }, { id: "intermediaire", label: "Intermédiaire" }, { id: "avance", label: "Avancé" }];
const NIVEAU_FACTORS = { debutant: 0.85, intermediaire: 1.0, avance: 1.2 };
const DURATIONS = [{ id: "30", label: "30 min", minutes: 30 }, { id: "45", label: "45 min", minutes: 45 }, { id: "60", label: "1h", minutes: 60 }, { id: "plus", label: "Plus", minutes: null }];
const ACHIEVEMENTS = [{ id: "atteint", label: "Atteint", color: "green" }, { id: "moyen", label: "Moyennement", color: "amber" }, { id: "pas", label: "Pas atteint", color: "red" }];
// Coefficient de participation réelle du coach — un cours enseigné n'impose
// pas le même volume personnel qu'une pratique complète en élève.
const PARTICIPATION_LEVELS = [
  { value: 0.15, label: "Démo ponctuelle" },
  { value: 0.4, label: "Légère" },
  { value: 0.65, label: "Active" },
  { value: 1.0, label: "Complète" },
];
const WARMUP_MINUTES = 22;
const DISCIPLINE_TO_THEMES = {
  Handstand: ["handstand"], "Mobilité": ["bas"], Locomotion: ["locomotion"],
  "Arm Balance": ["arm_balance"], Altinha: ["altinha"], Calisthenics: ["tirage", "poussee", "complet"]
};
// Seule la Calisthenics se décompose en plusieurs thèmes (tirage/poussée/
// complet), avec leurs propres nuances de contraction (isométrique/excentrique)
// — pertinentes pour ce travail de force précis. Les autres disciplines
// (Handstand, Arm Balance, Locomotion, Altinha, Mobilité) correspondent à un
// seul thème identique à la discipline elle-même : pas besoin d'un second
// menu qui ne ferait que dupliquer ce que le RPE global indique déjà.
const SINGLE_THEME_DISCIPLINES = { Handstand: "handstand", "Mobilité": "bas", Locomotion: "locomotion", "Arm Balance": "arm_balance", Altinha: "altinha" };
const CLASS_SCHEDULE = [
  { discipline: "Altinha", jour_semaine: 1, semaine: "B", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Locomotion", jour_semaine: 1, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Calisthenics", jour_semaine: 2, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Calisthenics", jour_semaine: 2, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Handstand", jour_semaine: 2, semaine: "B", heure_debut: "19:30", heure_fin: "20:30" },
  { discipline: "Handstand", jour_semaine: 2, semaine: "A", heure_debut: "19:30", heure_fin: "20:30" },
  { discipline: "Mobilité", jour_semaine: 3, semaine: "A", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Locomotion", jour_semaine: 3, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Arm Balance", jour_semaine: 3, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Mobilité", jour_semaine: 4, semaine: "B", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Handstand", jour_semaine: 4, semaine: "B", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Handstand", jour_semaine: 4, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" },
  { discipline: "Calisthenics", jour_semaine: 5, semaine: "A", heure_debut: "11:00", heure_fin: "12:00" },
  { discipline: "Locomotion", jour_semaine: 5, semaine: "A", heure_debut: "12:15", heure_fin: "13:15" }
].map(function(c){ c.actif = true; return c; });
const SCHEDULE_REFERENCE = { date_lundi_reference: "2026-08-17", semaine_ce_lundi: "B" };
const SCHEDULE_VACATIONS = [{ date_debut: "2026-08-06", date_fin: "2026-08-16" }, { date_debut: "2026-10-03", date_fin: "2026-10-11" }];

// ---------------- Utilitaires ----------------
function todayISO() { return new Date().toISOString().slice(0, 10); }
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
}
function avgOf(arr) { return arr.length ? arr.reduce(function(s,v){return s+v;},0) / arr.length : null; }
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function getWeekLetter(dateStr, ref) {
  const refMonday = new Date(ref.date_lundi_reference + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  const day = target.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const targetMonday = new Date(target);
  targetMonday.setDate(target.getDate() + diffToMonday);
  const weeksDiff = Math.round((targetMonday - refMonday) / (7 * 86400000));
  const isRefWeek = weeksDiff % 2 === 0;
  return isRefWeek ? ref.semaine_ce_lundi : (ref.semaine_ce_lundi === "A" ? "B" : "A");
}
function isInVacation(dateStr, vacations) { return vacations.some(function(v){ return dateStr >= v.date_debut && dateStr <= v.date_fin; }); }
function getScheduledClasses(dateStr) {
  if (isInVacation(dateStr, SCHEDULE_VACATIONS)) return [];
  const jsDay = new Date(dateStr + "T00:00:00").getDay();
  const week = getWeekLetter(dateStr, SCHEDULE_REFERENCE);
  return CLASS_SCHEDULE.filter(function(c){ return c.actif && c.jour_semaine === jsDay && c.semaine === week; });
}
function deriveDurationPreset(minutes) {
  if (!minutes) return null;
  const match = DURATIONS.find(function(d){ return d.minutes === Number(minutes); });
  return match ? match.id : "plus";
}
function sessionFromClass(c) {
  if (!c) return null;
  const h1 = c.heure_debut.split(":").map(Number), h2 = c.heure_fin.split(":").map(Number);
  const duration = WARMUP_MINUTES + ((h2[0]*60+h2[1]) - (h1[0]*60+h1[1]));
  const entries = {};
  (DISCIPLINE_TO_THEMES[c.discipline] || []).forEach(function(id) { entries[id] = { contraction: "dynamique", rpe: 0 }; });
  return { entries: entries, goal: null, duration: duration, durationPreset: deriveDurationPreset(duration),
    achievement: null, intensity: 0, discipline: c.discipline, time: c.heure_debut.slice(0,5) };
}
function emptySession() { return { entries: {}, goal: null, durationPreset: null, duration: "", achievement: null, intensity: 0, discipline: null, time: "", participation: 1.0, niveau: "intermediaire" }; }

// Entrées "effectives" pour le calcul de charge et la sauvegarde — dérivées
// à la demande, sans jamais muter session.entries pendant l'affichage.
function getEffectiveEntries(s) {
  if (s.discipline === "Calisthenics") return s.entries || {};
  const singleThemeId = s.discipline ? SINGLE_THEME_DISCIPLINES[s.discipline] : null;
  if (singleThemeId) {
    const e = {};
    e[singleThemeId] = { contraction: "dynamique", rpe: s.intensity || 0, niveau: s.niveau || "intermediaire" };
    return e;
  }
  return {};
}

function computeLoad(s) {
  if (!s) return { sessionLoad: null, correctedLoad: null };
  const participation = s.participation != null ? s.participation : 1.0;
  const sessionLoad = s.intensity > 0 && s.duration ? Math.round(s.intensity * Number(s.duration)) : null;
  const active = Object.entries(getEffectiveEntries(s)).filter(function(e){ return e[1].rpe > 0; });
  const totalRpe = active.reduce(function(sum,e){ return sum + e[1].rpe; }, 0);
  if (active.length === 0) return { sessionLoad: sessionLoad, correctedLoad: sessionLoad !== null ? Math.round(sessionLoad * participation) : null };
  const neuralFactor = active.reduce(function(sum,e){
    const t = THEMES.find(function(th){ return th.id === e[0]; });
    return sum + (t ? t.neural : 1) * e[1].rpe;
  }, 0) / totalRpe;
  const tendinoFactor = active.reduce(function(sum,e){
    const t = THEMES.find(function(th){ return th.id === e[0]; });
    return sum + (t ? t.tendino : 1) * e[1].rpe;
  }, 0) / totalRpe;
  const typeFactor = active.reduce(function(sum,e){
    const ty = e[1].type || s.goal;
    return sum + (GOAL_FACTORS[ty] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const contractionFactor = active.reduce(function(sum,e){
    return sum + (CONTRACTION_FACTORS[e[1].contraction] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const niveauFactor = active.reduce(function(sum,e){
    return sum + (NIVEAU_FACTORS[e[1].niveau] || 1) * e[1].rpe;
  }, 0) / totalRpe;
  const correctedLoad = sessionLoad !== null ? Math.round(sessionLoad * neuralFactor * tendinoFactor * typeFactor * contractionFactor * niveauFactor * participation) : null;
  return { sessionLoad: sessionLoad, correctedLoad: correctedLoad };
}

// ---------------- Accès données ----------------
function rowToSession(row) {
  if (!row) return emptySession();
  return { entries: row.entries || {}, goal: row.goal || null, duration: row.duration_minutes || "",
    durationPreset: deriveDurationPreset(row.duration_minutes), achievement: row.achievement || null,
    intensity: row.intensity || 0, discipline: row.discipline || null, time: row.session_time || "",
    participation: row.participation != null ? Number(row.participation) : 1.0,
    niveau: row.niveau || "intermediaire" };
}
function sessionToRow(dateStr, s) {
  const load = computeLoad(s);
  return { session_date: dateStr, goal: s.goal, duration_minutes: s.duration ? Number(s.duration) : null,
    achievement: s.achievement, intensity: s.intensity || null, entries: s.entries || {}, discipline: s.discipline || null,
    session_time: s.time || null, participation: s.participation != null ? s.participation : 1.0,
    niveau: s.niveau || "intermediaire",
    session_load: load.sessionLoad, corrected_load: load.correctedLoad, updated_at: new Date().toISOString() };
}

async function getWorkoutForDate(dateStr) {
  const rows = await sb("workout_sessions?day=eq." + dateStr + "&select=*");
  if (!rows || !rows.length) return null;
  const zones = ["zone_leger_min", "zone_intensif_min", "zone_aerobique_min", "zone_anaerobie_min", "zone_vo2max_min"];
  const agg = { duration_min: rows.reduce(function(s, r) { return s + r.duration_min; }, 0), count: rows.length };
  zones.forEach(function(z) { agg[z] = rows.reduce(function(s, r) { return s + Number(r[z] || 0); }, 0); });
  const teA = rows.map(function(r){ return r.training_effect_aerobic; }).filter(function(v){ return v != null; });
  const teN = rows.map(function(r){ return r.training_effect_anaerobic; }).filter(function(v){ return v != null; });
  agg.te_aerobic = teA.length ? Math.max.apply(null, teA) : null;
  agg.te_anaerobic = teN.length ? Math.max.apply(null, teN) : null;
  agg.calories = rows.reduce(function(s, r){ return s + (Number(r.calories)||0); }, 0);
  agg.official = rows.some(function(r){ return r.source === "zepp_official"; });
  const hrrVals = rows.map(function(r){ return r.hrr_1min; }).filter(function(v){ return v != null; });
  agg.hrr_1min = hrrVals.length ? Math.round(avgOf(hrrVals)) : null;
  return agg;
}

function teLabel(v) {
  if (v == null) return null;
  if (v < 1) return "Minime";
  if (v < 2) return "Léger";
  if (v < 3) return "Modéré";
  if (v < 4) return "Bien";
  return "Élevé";
}

function workoutCardHtml(w) {
  const zones = [
    ["Léger", w.zone_leger_min, "#8b6fb0"],
    ["Intensif", w.zone_intensif_min, "var(--steel)"],
    ["Aérobique", w.zone_aerobique_min, "var(--green)"],
    ["Anaérobie", w.zone_anaerobie_min, "var(--amber)"],
    ["VO2 max", w.zone_vo2max_min, "var(--rust)"],
  ];
  const total = zones.reduce(function(s, z) { return s + z[1]; }, 0) || 1;
  let html = '<div class="card steel" id="workout-slot"><div class="section-label">Zones cardiaques' + (w.official ? " (officiel Zepp)" : " (montre)") + '</div>';
  html += '<div class="muted" style="margin-bottom:10px">Durée détectée : ' + Math.round(w.duration_min) + " min" + (w.count > 1 ? " sur " + w.count + " séances" : "") + (w.calories ? " · " + w.calories + " kcal" : "") + "</div>";
  zones.forEach(function(z) {
    const label = z[0], min = z[1], color = z[2];

    const pct = Math.round((min / total) * 100);
    html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + label + '</span><span class="muted">' + Math.round(min) + ' min</span></div>';
    html += '<div style="height:6px;background:var(--surfaceRaised);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + color + '"></div></div></div>';
  });
  const hrrReliable = w.hrr_1min != null && w.duration_min >= 15 && ((w.te_aerobic||0) + (w.te_anaerobic||0)) >= 1.0;
  if (w.te_aerobic != null || w.te_anaerobic != null || hrrReliable) {
    html += '<div style="display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap">';
    if (w.te_aerobic != null) html += '<div style="flex:1;min-width:80px"><div class="muted" style="font-size:10px;text-transform:uppercase">Effet aérobie</div><div style="font-size:18px;font-weight:900">' + w.te_aerobic.toFixed(1) + '</div><div style="font-size:11px;color:var(--green)">' + teLabel(w.te_aerobic) + "</div></div>";
    if (w.te_anaerobic != null) html += '<div style="flex:1;min-width:80px"><div class="muted" style="font-size:10px;text-transform:uppercase">Effet anaérobie</div><div style="font-size:18px;font-weight:900">' + w.te_anaerobic.toFixed(1) + '</div><div style="font-size:11px;color:var(--amber)">' + teLabel(w.te_anaerobic) + "</div></div>";
    if (hrrReliable) {
      html += '<div style="flex:1;min-width:80px"><div class="muted" style="font-size:10px;text-transform:uppercase">Récup. FC (1min)</div><div style="font-size:18px;font-weight:900">-' + w.hrr_1min + ' bpm</div></div>';
    }
    html += "</div>";
    if (hrrReliable) html += '<div class="muted" style="font-size:10px;margin-top:8px">Récupération cardiaque approximative — capteur poignet moins précis qu\'une ceinture ECG, et on ne sait pas si tu es resté immobile juste après l\'effort (sinon la mesure est faussée). À prendre comme indicatif, pas comme un chiffre clinique.</div>';
  }
  html += "</div>";
  return html;
}

let seanceSubTab = "jour";

function renderSeanceTendancesHtml() {
  if (seanceTendancesLoading || !seanceTendancesCache) return '<div class="muted" style="text-align:center;padding:20px 0">Chargement…</div>';
  const allSessions = seanceTendancesCache;
  const today = todayISO();
  const month = []; for (let i = 29; i >= 0; i--) month.push(daysAgo(i));
  const prevMonth = []; for (let i = 59; i >= 30; i--) prevMonth.push(daysAgo(i));
  const monthSessions = allSessions.filter(function(s){ return month.indexOf(s.date) !== -1; });
  const prevMonthSessions = allSessions.filter(function(s){ return prevMonth.indexOf(s.date) !== -1; });

  let html = "";

  // Recommandations — l'info la plus actionnable de cet onglet, affichée en
  // premier (principe UX : ce qui demande une décision passe avant les
  // graphiques bruts).
  function sessionHasTheme(s, themeId) {
    if (s.entries[themeId]) return true;
    const disc = Object.keys(SINGLE_THEME_DISCIPLINES).find(function(d) { return SINGLE_THEME_DISCIPLINES[d] === themeId; });
    return disc ? s.discipline === disc : false;
  }
  const themeCounts = {};
  monthSessions.forEach(function(s){
    THEMES.forEach(function(t) { if (sessionHasTheme(s, t.id)) themeCounts[t.id] = (themeCounts[t.id]||0) + 1; });
  });
  const stale = THEMES.map(function(t) {
    // Un mouvement complet (muscle-up, etc.) mélange traction et poussée —
    // il compte pour les deux, pas seulement pour "complet".
    const relevantIds = (t.id === "tirage" || t.id === "poussee") ? [t.id, "complet"] : [t.id];
    const last = allSessions.filter(function(s){ return relevantIds.some(function(id){ return sessionHasTheme(s, id); }); }).sort(function(a,b){return a.date<b.date?1:-1;})[0];
    const days = last ? Math.round((new Date(today)-new Date(last.date))/86400000) : null;
    return { theme: t, days: days };
  }).filter(function(x){ return x.days === null || x.days >= 10; });
  const recs = [];
  const total = monthSessions.length;
  if (total >= 3) {
    const pull = (themeCounts.tirage||0) + (themeCounts.complet||0), push = (themeCounts.poussee||0) + (themeCounts.complet||0);
    if (pull+push >= 4) {
      if (push>0 && pull/push<=0.55) recs.push({tone:"warn",text:"Poussée bien plus travaillée que Tirage ("+push+" vs "+pull+")."});
      else if (pull>0 && push/pull<=0.55) recs.push({tone:"warn",text:"Tirage bien plus travaillé que Poussée ("+pull+" vs "+push+")."});
    }
    THEMES.forEach(function(t){ const c=themeCounts[t.id]||0; if (total>=4 && c/total>0.55) recs.push({tone:"neutral",text:t.label+" domine largement tes séances ("+c+"/"+total+")."}); });
  }
  if (recs.length || stale.length) {
    html += '<div class="card amber"><div class="section-label">Recommandations</div>';
    recs.forEach(function(r){ html += '<div style="font-size:12px;color:var(--chalkDim);margin-bottom:8px">' + esc(r.text) + "</div>"; });
    stale.forEach(function(s) { html += '<div style="font-size:12px;color:var(--chalkDim);margin-bottom:8px"><span style="color:var(--amber);font-weight:700">'+s.theme.label+'</span> — '+(s.days===null?"jamais travaillé":"pas travaillé depuis "+s.days+"j")+"</div>"; });
    html += "</div>";
  }

  // ---- Semaine ----
  const last7 = []; for (let i = 6; i >= 0; i--) last7.push(daysAgo(i));
  const prev7 = []; for (let i = 13; i >= 7; i--) prev7.push(daysAgo(i));
  const last7Sessions = allSessions.filter(function(s){ return last7.indexOf(s.date) !== -1; });
  const prev7Sessions = allSessions.filter(function(s){ return prev7.indexOf(s.date) !== -1; });
  const weekBars = last7.map(function(d) {
    const total = allSessions.filter(function(x){ return x.date === d; }).reduce(function(s,x){ return s + (x.correctedLoad || 0); }, 0);
    return { label: formatDateLabel(d).slice(0,2), val: total };
  });
  html += '<h1 style="font-size:18px;margin-bottom:10px">Cette semaine</h1>';
  html += '<div class="card"><div class="section-label">Charge d\'entraînement — 7 derniers jours</div>';
  html += barChartHtml(weekBars, {});
  html += '<div class="muted" style="font-size:10px;margin-top:6px">Durée × intensité, ajustées par la complexité du mouvement, le type d\'effort et le type de contraction — reflète l\'exigence réelle de la séance, pas juste sa durée.</div>';
  html += "</div>";
  const totalLoad = last7Sessions.reduce(function(s,x){return s+(x.correctedLoad||0);},0);
  const prevTotalLoad = prev7Sessions.reduce(function(s,x){return s+(x.correctedLoad||0);},0);
  const rpeVals = last7Sessions.map(function(s){return s.intensity;}).filter(function(v){return v>0;});
  const achievedWk = last7Sessions.filter(function(s){return s.achievement==="atteint";}).length;
  const withAchWk = last7Sessions.filter(function(s){return s.achievement;}).length;
  html += '<div class="card"><div class="stat-row">';
  html += statHtml("Charge totale", totalLoad);
  html += statHtml("Séances", last7Sessions.length);
  html += statHtml("RPE moyen", rpeVals.length ? avgOf(rpeVals).toFixed(1) : "–");
  html += statHtml("Objectifs atteints", withAchWk ? achievedWk+"/"+withAchWk : "–");
  html += "</div></div>";

  const weekLines = [];
  if (prevTotalLoad > 0) {
    const pct = Math.round(((totalLoad - prevTotalLoad) / prevTotalLoad) * 100);
    if (pct >= 30) weekLines.push({ tone: "warn", text: "Charge en hausse de " + pct + "% vs la semaine précédente (" + prevTotalLoad + " → " + totalLoad + ") — progression rapide, surveille ta récupération." });
    else if (pct <= -30) weekLines.push({ tone: "neutral", text: "Charge en net retrait vs la semaine précédente (" + pct + "%) — phase plus légère ou repos." });
    else weekLines.push({ tone: "good", text: "Charge stable par rapport à la semaine précédente (" + (pct >= 0 ? "+" : "") + pct + "%)." });
  } else if (last7Sessions.length > 0) {
    weekLines.push({ tone: "neutral", text: "Pas de semaine précédente comparable pour l'instant." });
  }
  if (last7Sessions.length === 0) {
    weekLines.push({ tone: "warn", text: "Aucune séance loggée cette semaine." });
  } else if (last7Sessions.length <= 1) {
    weekLines.push({ tone: "neutral", text: "Une seule séance cette semaine — fréquence en retrait si ce n'est pas voulu." });
  }
  if (withAchWk >= 2 && achievedWk / withAchWk < 0.5) {
    weekLines.push({ tone: "warn", text: "Moins de la moitié des objectifs atteints cette semaine (" + achievedWk + "/" + withAchWk + ") — vaut le coup de regarder pourquoi (charge, sommeil, planning)." });
  }
  if (weekLines.length) {
    html += '<div class="card"><div class="section-label">Lecture de la semaine</div>';
    weekLines.forEach(function(l) {
      const dotColor = l.tone === "warn" ? "red" : l.tone === "good" ? "green" : "steel";
      html += '<div style="display:flex;align-items:flex-start;margin-bottom:8px;font-size:13px;color:var(--chalkDim)"><span style="display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--' + dotColor + ');margin-right:8px;margin-top:5px;flex-shrink:0"></span><span>' + esc(l.text) + "</span></div>";
    });
    html += "</div>";
  }

  // ---- Zones cardiaques (méthode Karvonen, recalculées seconde par seconde) ----
  // La méthode %FCmax utilisée par défaut par les montres ignore la FC repos
  // et applique le même pourcentage à tout le monde. Karvonen (réserve
  // cardiaque) est recommandée par l'ACSM car elle intègre le niveau de forme
  // individuel — d'autant plus pertinent avec une FC repos basse.
  const kzWorkouts = (seanceTendancesWorkouts || []).filter(function(w) { return w.kz_leger_min != null; });
  if (kzWorkouts.length > 0) {
    const last30 = kzWorkouts.filter(function(w) { return w.day >= daysAgo(29); });
    const pool = last30.length > 0 ? last30 : kzWorkouts;
    const tot = { l: 0, i: 0, a: 0, an: 0, v: 0 };
    pool.forEach(function(w) {
      tot.l += Number(w.kz_leger_min) || 0; tot.i += Number(w.kz_intensif_min) || 0;
      tot.a += Number(w.kz_aerobique_min) || 0; tot.an += Number(w.kz_anaerobie_min) || 0;
      tot.v += Number(w.kz_vo2max_min) || 0;
    });
    const grand = tot.l + tot.i + tot.a + tot.an + tot.v;
    if (grand > 0) {
      const hrMax = kzWorkouts[0].kz_hrmax_used, hrRest = kzWorkouts[0].kz_hrrest_used;
      const kzRows = [
        ["Léger", tot.l, "steel"], ["Intensif", tot.i, "green"],
        ["Aérobique", tot.a, "amber"], ["Anaérobie", tot.an, "rust"], ["VO2 max", tot.v, "red"],
      ];
      html += '<h1 style="font-size:18px;margin:22px 0 10px">Zones cardiaques</h1>';
      html += '<div class="card"><div class="section-label">Répartition — ' + pool.length + ' séance(s) sur 30 jours</div>';
      kzRows.forEach(function(r) {
        const pct = Math.round((r[1] / grand) * 100);
        html += '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + r[0] + '</span><span class="muted">' + Math.round(r[1]) + " min · " + pct + "%</span></div>";
        html += '<div style="height:7px;background:var(--surfaceRaised);border-radius:4px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--' + r[2] + ')"></div></div></div>';
      });
      html += '<div class="muted" style="font-size:10px;margin-top:8px">Méthode Karvonen (réserve cardiaque), recalculée seconde par seconde depuis les fichiers de séance — FC max ' + hrMax + ', FC repos ' + hrRest + '. Plus juste que le %FCmax des montres (qui ignore la FC repos), mais reste une estimation : seul un test d\'effort avec seuils ventilatoires donnerait tes vraies zones.</div></div>';
    }
  }

  // ---- Mois ----
  html += '<h1 style="font-size:18px;margin:22px 0 10px">Ce mois-ci</h1>';
  const buckets = [];
  for (let w = 0; w < 5; w++) {
    const bd = month.slice(w*6, w*6+6); if (!bd.length) continue;
    const bs = monthSessions.filter(function(s){ return bd.indexOf(s.date) !== -1; });
    buckets.push({ label: bd[0].slice(8,10)+"-"+bd[bd.length-1].slice(8,10), val: bs.reduce(function(s,x){return s+(x.correctedLoad||0);},0) });
  }
  html += '<div class="card"><div class="section-label">Charge d\'entraînement — tendance</div>';
  html += barChartHtml(buckets, { height: 72 });
  html += '<div class="muted" style="font-size:10px;margin-top:6px">Durée × intensité, ajustées par la complexité du mouvement, le type d\'effort et le type de contraction.</div>';
  html += "</div>";

  const achieved = monthSessions.filter(function(s){return s.achievement==="atteint";}).length;
  const withAch = monthSessions.filter(function(s){return s.achievement;}).length;
  const monthTotalLoad = monthSessions.reduce(function(s,x){return s+(x.correctedLoad||0);},0);
  const prevMonthTotalLoad = prevMonthSessions.reduce(function(s,x){return s+(x.correctedLoad||0);},0);
  html += '<div class="card"><div class="stat-row">';
  html += statHtml("Séances", monthSessions.length);
  html += statHtml("Objectifs atteints", withAch ? achieved+"/"+withAch : "–");
  const freqPerWeek = monthSessions.length/4.3;
  const freqQualColor = freqPerWeek >= 3 ? "green" : freqPerWeek >= 1.5 ? "amber" : "red";
  html += statHtml("Fréquence", freqPerWeek.toFixed(1)+"/sem", freqQualColor);
  if (prevMonthTotalLoad > 0) {
    const deltaPct = Math.round(((monthTotalLoad - prevMonthTotalLoad) / prevMonthTotalLoad) * 100);
    html += statHtml("Vs mois précédent", (deltaPct >= 0 ? "+" : "") + deltaPct + "%", deltaPct >= 30 ? "amber" : null);
  }
  html += "</div></div>";

  const discStats = {};
  // Exclut les anciennes séances à discipline fusionnée (ex. "Mobilité +
  // Handstand"), un reste d'avant qu'une séance = un seul cours. Les
  // comparer aux disciplines pures serait trompeur, donc on ne les affiche
  // simplement pas ici — la donnée reste ailleurs (historique, charge totale).
  allSessions.filter(function(s){ return s.discipline && s.correctedLoad != null && s.discipline.indexOf(" + ") === -1; }).forEach(function(s) {
    if (!discStats[s.discipline]) discStats[s.discipline] = [];
    discStats[s.discipline].push(s.correctedLoad);
  });
  const discRows = Object.keys(discStats).map(function(name) {
    const loads = discStats[name];
    return { name: name, count: loads.length, avg: Math.round(avgOf(loads)) };
  }).sort(function(a,b){ return b.avg - a.avg; });
  if (discRows.length) {
    html += '<div class="card"><div class="section-label">Charge moyenne par discipline</div>';
    const maxDisc = discRows[0].avg || 1;
    discRows.forEach(function(r, i) {
      const pct = Math.max(6, (r.avg/maxDisc)*100);
      html += '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:700;font-size:13px">' + esc(r.name) + '</span><span style="font-size:12px;color:var(--chalkDim)">' + r.avg + ' <span class="muted">· ' + r.count + " séance(s)</span></span></div>";
      html += '<div style="height:8px;background:var(--surfaceRaised);border-radius:4px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + (i===0?"var(--gradient)":"var(--steel)") + ';border-radius:4px"></div></div></div>';
    });
    html += "</div>";
  }
  if (!buckets.some(function(b){return b.val>0;}) && discRows.length === 0) {
    html = '<div class="card"><div class="muted" style="text-align:center;padding:16px 0">Pas encore assez de séances enregistrées pour dégager des tendances.</div></div>';
  }

  // Réglages des coefficients de charge — ajustables directement, sans repasser
  // par une conversation. Modifie, tape "Enregistrer", et les futurs calculs
  // de charge (y compris les anciens recalculés à l'affichage) en tiennent compte.
  html += '<details class="card" style="margin-top:22px"><summary class="section-label" style="cursor:pointer;list-style:none">Réglages : coefficients de charge</summary>';
  html += '<div style="margin-top:10px">';
  html += '<div class="muted" style="font-size:11px;margin-bottom:12px">Multiplicateurs appliqués à la charge de séance selon la complexité neuromusculaire du thème, le type de contraction, et le type d\'effort visé.</div>';
  const coefGroups = [
    ["neural", "Complexité neurale par thème"],
    ["tendino", "Charge tendino-articulaire par thème"],
    ["contraction", "Type de contraction"],
    ["goal", "Type d'effort"],
    ["niveau", "Niveau de pratique"],
  ];
  coefGroups.forEach(function(g) {
    html += '<div class="section-label" style="margin-top:12px">' + g[1] + '</div>';
    (trainingCoefficients || []).filter(function(c) { return c.category === g[0]; }).forEach(function(c) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
      html += '<span style="font-size:13px">' + esc(c.label) + '</span>';
      html += '<input type="number" step="0.05" min="0.5" max="3" class="coef-input" data-key="' + c.key + '" value="' + c.value + '" style="width:70px;text-align:center;padding:6px" /></div>';
    });
  });
  html += '<button id="save-coefs" style="width:100%;margin-top:14px;padding:12px 0;background:var(--gradient);border:none;border-radius:8px;color:var(--bg);font-size:13px;font-weight:900;letter-spacing:.3px;cursor:pointer;text-transform:uppercase">Enregistrer</button>';
  html += '<div id="coef-status" class="muted" style="text-align:center;font-size:11px;margin-top:8px"></div>';
  html += "</div></details>";

  return html;
}

// ---------------- Rendu : Séance (synchrone, ne touche jamais le réseau) ----------------
function drawSeance() {
  const app = document.getElementById("app");
  const scrollY = window.scrollY;
  const classes = seance.classes;
  let html = "";
  if (seance.error) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(seance.error) + "</div>";

  html += '<div style="margin-bottom:20px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
  html += '<span class="muted" style="text-transform:uppercase;letter-spacing:1.5px">' + formatDateLabel(currentDate) + "</span>";
  if (currentDate !== todayISO()) html += '<button id="back-today" style="background:none;border:none;color:var(--steel);font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer">Revenir à aujourd\'hui</button>';
  html += "</div>";
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">';
  html += "<h1>" + (currentDate === todayISO() ? "Séance du jour" : "Modifier la séance") + "</h1>";
  html += '<input type="date" id="date-picker" value="' + currentDate + '" max="' + todayISO() + '" style="width:auto;font-size:16px" />';
  html += "</div></div>";

  html += '<div class="pill-row compact" id="seance-subtab-row" style="margin-bottom:16px">';
  html += '<button class="pill' + (seanceSubTab === "jour" ? " active" : "") + '" data-subtab="jour">Log du jour</button>';
  html += '<button class="pill' + (seanceSubTab === "tendances" ? " active" : "") + '" data-subtab="tendances">Tendances</button>';
  html += "</div>";

  if (seanceSubTab === "tendances") {
    html += renderSeanceTendancesHtml();
    app.innerHTML = html;
    wireSeanceEvents();
    window.scrollTo(0, scrollY);
    return;
  }

  if (classes.length) {
    classes.forEach(function(c, i) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:' + (i < classes.length - 1 ? "8" : "14") + 'px;font-size:12px">';
      html += '<span><b>Cours prévu :</b> ' + esc(c.discipline) + ' <span class="muted">(' + c.heure_debut.slice(0,5) + '–' + c.heure_fin.slice(0,5) + ')</span></span>';
      html += '<button class="apply-schedule-theme" data-class-index="' + i + '" style="background:none;border:1px dashed var(--steel);border-radius:6px;color:var(--steel);font-size:11px;font-weight:700;padding:4px 8px;cursor:pointer;white-space:nowrap;margin-left:8px">Pré-remplir →</button>';
      html += "</div>";
    });
  }

  // Liste des séances déjà loggées ce jour — plusieurs possibles (plusieurs
  // cours dans la même journée), chacune éditable ou supprimable.
  if (!editingSession) {
    if (seance.sessions.length > 0) {
      html += '<div class="card"><div class="section-label">Séances loggées aujourd\'hui</div>';
      seance.sessions.forEach(function(s) {
        html += '<div class="logged-session-row" data-id="' + s.id + '" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer">';
        html += '<div><div style="font-weight:700;font-size:13px">' + (s.time ? esc(s.time) + " · " : "") + esc(s.discipline || "Sans discipline") + '</div>';
        html += '<div class="muted" style="font-size:11px">' + (s.duration ? s.duration + " min · " : "") + "RPE " + (s.intensity || "–") + (s.correctedLoad ? " · charge " + s.correctedLoad : "") + "</div></div>";
        html += '<button class="session-remove" data-id="' + s.id + '" style="background:none;border:1px solid var(--line);border-radius:6px;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;padding:4px 10px">Supprimer</button></div>';
      });
      html += "</div>";
    }
    html += '<button id="new-session-btn" style="width:100%;padding:14px 0;background:var(--gradient);border:none;border-radius:8px;color:var(--bg);font-size:14px;font-weight:900;letter-spacing:.3px;cursor:pointer;text-transform:uppercase;margin-bottom:18px">+ Nouvelle séance</button>';
  } else {
    const session = editingSession;
    html += '<div class="card">';
    html += '<div class="section-label">Heure de la séance</div>';
    html += '<input type="time" id="session-time-input" value="' + esc(session.time || "") + '" style="margin-bottom:16px" />';
    html += '<div class="section-label">Discipline</div>';
    html += '<select id="discipline-input" style="margin-bottom:16px">';
    html += '<option value=""' + (!session.discipline ? " selected" : "") + '>— Choisir —</option>';
    Object.keys(DISCIPLINE_TO_THEMES).forEach(function(d) {
      html += '<option value="' + esc(d) + '"' + (session.discipline === d ? " selected" : "") + '>' + esc(d) + "</option>";
    });
    html += '<option value="__autre__"' + (disciplineOtherMode || (session.discipline && !DISCIPLINE_TO_THEMES[session.discipline]) ? " selected" : "") + '>Autre…</option>';
    html += "</select>";
    if (disciplineOtherMode || (session.discipline && !DISCIPLINE_TO_THEMES[session.discipline])) {
      html += '<input type="text" id="discipline-other" placeholder="Précise la discipline" value="' + esc(session.discipline && !DISCIPLINE_TO_THEMES[session.discipline] ? session.discipline : "") + '" style="margin-top:8px;margin-bottom:16px" />';
    }
    html += '<div class="section-label">Objectif de séance</div><div class="pill-row compact" id="goal-row" style="margin-bottom:16px">';
    GOALS.forEach(function(g) { html += pillHtml(g, session.goal === g.id, "goal"); });
    html += "</div>";
    html += '<div class="section-label">Durée</div><div class="pill-row" id="duration-row" style="margin-bottom:' + (session.durationPreset === "plus" ? 10 : 16) + 'px">';
    DURATIONS.forEach(function(d) { html += pillHtml(d, session.durationPreset === d.id, "duration"); });
    html += "</div>";
    if (session.durationPreset === "plus") {
      html += '<input type="number" id="duration-custom" placeholder="Durée exacte en minutes" value="' + esc(session.duration) + '" style="margin-bottom:16px" />';
    }
    html += '<div class="section-label">Objectif atteint ?</div><div class="pill-row" id="achievement-row" style="margin-bottom:16px">';
    ACHIEVEMENTS.forEach(function(a) { html += pillHtml(a, session.achievement === a.id, "achievement"); });
    html += "</div>";
    html += '<div class="section-label">Ton implication (coach vs pratiquant)</div><div class="pill-row compact" id="participation-row" style="margin-bottom:16px">';
    PARTICIPATION_LEVELS.forEach(function(p) {
      html += '<button class="pill' + (Math.abs((session.participation != null ? session.participation : 1.0) - p.value) < 0.01 ? " active" : "") + '" data-value="' + p.value + '">' + p.label + "</button>";
    });
    html += "</div>";
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">';
    html += '<span class="section-label" style="margin:0">Intensité globale ressentie</span><span class="rpe-value">' + (session.intensity > 0 ? session.intensity : "–") + "</span></div>";
    html += rpeLadderHtml("global", session.intensity || 0);
    const load = computeLoad(session);
    if (load.sessionLoad !== null) {
      html += '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">';
      html += '<span style="font-size:12px;color:var(--chalkDim)">Charge de séance</span><span style="font-size:20px;font-weight:900">' + load.sessionLoad + "</span></div>";
      if (load.correctedLoad !== load.sessionLoad) {
        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">';
        html += '<span style="font-size:12px;color:var(--chalkDim)">Charge d\'entraînement</span><span style="font-size:20px;font-weight:900;color:var(--rust)">' + load.correctedLoad + "</span></div>";
      }
    }

    // Thèmes travaillés — uniquement pour la Calisthenics (tirage/poussée/
    // complet), où le détail contraction/type a un vrai sens. Pour les autres
    // disciplines (1 thème = 1 discipline), l'entrée se synchronise seule en
    // coulisse à partir du RPE global, sans dupliquer l'info dans une UI à part.
    const isCalisthenics = session.discipline === "Calisthenics";
    const singleThemeId = session.discipline ? SINGLE_THEME_DISCIPLINES[session.discipline] : null;
    if (singleThemeId) {
      html += '<div class="section-label" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">Niveau des figures travaillées</div>';
      html += '<div class="pill-row compact" id="niveau-row">';
      NIVEAUX.forEach(function(n) { html += '<button class="pill' + ((session.niveau || "intermediaire") === n.id ? " active" : "") + '" data-id="' + n.id + '">' + n.label + "</button>"; });
      html += "</div>";
    }
    if (isCalisthenics) {
      html += '<div class="section-label" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">Thèmes travaillés</div>';
      const CALI_THEMES = THEMES.filter(function(t) { return ["tirage", "poussee", "complet"].indexOf(t.id) !== -1; });
      CALI_THEMES.forEach(function(t) {
        const data = session.entries[t.id];
        const on = !!data;
        html += '<div class="theme-card' + (on ? " on" : "") + '" data-theme="' + t.id + '" style="margin-bottom:8px">';
        html += '<button class="theme-head" data-action="toggle-theme" data-theme="' + t.id + '">';
        html += '<div><div class="theme-label">' + esc(t.label) + '</div><div class="theme-hint">' + esc(t.hint) + "</div></div>";
        html += '<div class="checkbox' + (on ? " on" : "") + '">' + (on ? "✓" : "") + "</div></button>";
        if (on) {
          html += '<div class="theme-body">';
          html += '<div class="pill-row compact" style="margin-bottom:14px" data-theme-group="contraction" data-theme="' + t.id + '">';
          CONTRACTIONS.forEach(function(c) { html += '<button class="pill' + (data.contraction === c.id ? " active" : "") + '" data-id="' + c.id + '">' + c.label + "</button>"; });
          html += "</div>";
          html += '<div class="section-label">Type d\'effort</div><div class="pill-row compact" style="margin-bottom:14px" data-theme-group="type" data-theme="' + t.id + '">';
          GOALS.forEach(function(g) { html += '<button class="pill' + (data.type === g.id ? " active" : "") + '" data-id="' + g.id + '">' + g.label + "</button>"; });
          html += "</div>";
          html += '<div class="section-label">Niveau des mouvements</div><div class="pill-row compact" style="margin-bottom:14px" data-theme-group="niveau" data-theme="' + t.id + '">';
          NIVEAUX.forEach(function(n) { html += '<button class="pill' + ((data.niveau || "intermediaire") === n.id ? " active" : "") + '" data-id="' + n.id + '">' + n.label + "</button>"; });
          html += "</div>";
          html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="section-label" style="margin:0">Intensité (RPE)</span><span class="rpe-value">' + (data.rpe > 0 ? data.rpe : "–") + "</span></div>";
          html += rpeLadderHtml("theme:" + t.id, data.rpe || 0);
          html += "</div>";
        }
        html += "</div>";
      });
    }

    const activeCount = Object.keys(session.entries).length;
    let countLabel = "Aucun thème loggé";
    if (isCalisthenics) countLabel = activeCount > 0 ? activeCount + " thème(s) loggé(s)" : "Aucun thème loggé";
    else if (singleThemeId) countLabel = "Séance prête";
    html += '<button id="validate-session" style="width:100%;margin-top:12px;padding:14px 0;background:var(--gradient);border:none;border-radius:8px;color:var(--bg);font-size:14px;font-weight:900;letter-spacing:.3px;cursor:pointer;text-transform:uppercase">' + (session.id ? "Mettre à jour cette séance" : "Valider cette séance") + '</button>';
    html += '<button id="cancel-session" style="width:100%;margin-top:8px;padding:10px 0;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer">Annuler</button>';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">';
    html += '<span class="muted">' + countLabel + '</span><span class="status" id="save-status"></span></div>';
    html += "</div>";
  }

  html += '<button class="btn-outline" id="toggle-history">Voir l\'historique (' + seance.history.length + ")</button>";
  html += '<div id="history-list" style="display:' + (historyOpen ? "block" : "none") + ';margin-top:14px">';
  if (seance.history.length === 0) html += '<div class="muted" style="text-align:center;padding:16px 0">Aucune séance précédente.</div>';
  seance.history.forEach(function(h) {
    const ach = ACHIEVEMENTS.find(function(a) { return a.id === h.achievement; });
    html += '<button class="history-item" data-date="' + h.date + '"><div style="font-weight:700;font-size:13px;margin-bottom:4px">' + formatDateLabel(h.date) + (h.time ? " · " + esc(h.time) : "") + "</div>";
    html += '<div class="muted" style="font-size:12px;margin-bottom:6px">' + esc(h.discipline || "Discipline non renseignée");
    if (h.duration) html += " · " + h.duration + " min";
    if (h.intensity) html += " · RPE " + h.intensity;
    if (h.correctedLoad) html += " · charge " + h.correctedLoad;
    html += "</div>";
    Object.keys(h.entries).forEach(function(tid) {
      const th = THEMES.find(function(t) { return t.id === tid; });
      const d = h.entries[tid];
      html += '<span class="badge">' + (th ? th.label : tid) + " · " + (CONTRACTIONS.find(function(c){return c.id===d.contraction;})||{label:"dynamique"}).label + " · RPE " + (d.rpe || "–") + "</span>";
    });
    if (ach) html += '<span class="badge" style="background:var(--' + ach.color + ');color:var(--bg);font-weight:700">' + ach.label + "</span>";
    html += "</button>";
  });
  html += "</div>";

  app.innerHTML = html;
  wireSeanceEvents();
  window.scrollTo(0, scrollY);
}

function pillHtml(opt, active, group) {
  const colorClass = opt.color ? " " + opt.color : (group === "duration" || group === "contraction" ? "" : " rust");
  return '<button class="pill' + (active ? " active" + colorClass : "") + '" data-group="' + group + '" data-id="' + opt.id + '">' + esc(opt.label) + "</button>";
}
function rpeLadderHtml(scope, value) {
  let html = '<div class="rpe-ladder" data-scope="' + scope + '">';
  for (let n = 1; n <= 10; n++) {
    const h = 14 + n * 3.6;
    html += '<button class="rpe-bar' + (value >= n ? " on" : "") + '" data-n="' + n + '" style="height:' + h + 'px"></button>';
  }
  return html + "</div>";
}
function wearableCardHtml(w) {
  let html = '<div class="card steel" id="wearable-slot"><div class="section-label">Strap — ' + formatDateLabel(w.day || currentDate) + '</div><div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--chalkDim)">';
  if (w.hr_resting != null) html += "<span>FC repos <b style='color:var(--chalk)'>" + w.hr_resting + "</b></span>";
  if (w.hrv_avg != null) html += "<span>VFC <b style='color:var(--chalk)'>" + Math.round(w.hrv_avg) + " ms</b></span>";
  if (w.hr_avg != null) html += "<span>FC activité <b style='color:var(--chalk)'>" + Math.round(w.hr_avg) + "</b></span>";
  if (w.stress_avg != null) html += "<span>Stress moy. <b style='color:var(--chalk)'>" + Math.round(w.stress_avg) + "</b></span>";
  if (w.steps_total != null) html += "<span>Pas <b style='color:var(--chalk)'>" + w.steps_total + "</b></span>";
  return html + "</div></div>";
}
// Sauvegarde en tâche de fond — ne bloque jamais le rendu, ne relance jamais
// de rechargement réseau (fini les doubles-clics et le retour en haut de page).
function saveInBackground() {
  if (!editingSession) return;
  const setStatus = function(s) { const el = document.getElementById("save-status"); if (el) el.textContent = s; };
  saveSessionRow(currentDate, editingSession)
    .then(function(id) { if (id) editingSession.id = id; setStatus("Enregistré"); setTimeout(function() { setStatus(""); }, 1400); })
    .catch(function(e) { setStatus("Erreur : " + e.message); });
}

function wireSeanceEvents() {
  const session = editingSession;
  const update = function() { drawSeance(); saveInBackground(); };

  document.querySelectorAll('#seance-subtab-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() {
      seanceSubTab = btn.dataset.subtab;
      if (seanceSubTab === "tendances") { drawSeance(); ensureSeanceTendances(); }
      else { drawSeance(); }
    });
  });
  if (seanceSubTab === "tendances") {
    const saveCoefsBtn = document.getElementById("save-coefs");
    if (saveCoefsBtn) saveCoefsBtn.addEventListener("click", function() {
      const status = document.getElementById("coef-status");
      const updates = Array.prototype.map.call(document.querySelectorAll(".coef-input"), function(input) {
        return { key: input.dataset.key, value: Number(input.value) };
      });
      status.textContent = "Enregistrement…";
      Promise.all(updates.map(function(u) {
        return sb("training_coefficients?key=eq." + u.key, {
          method: "PATCH", headers: { Prefer: "return=minimal" },
          body: JSON.stringify({ value: u.value, updated_at: new Date().toISOString() }),
        });
      })).then(function() {
        status.textContent = "✓ Enregistré — pris en compte immédiatement";
        seanceTendancesCache = null; // force un recalcul de la charge affichée
        loadCoefficients().then(function() { ensureSeanceTendances(); });
      }).catch(function(e) { status.textContent = "Erreur : " + e.message; });
    });
    return;
  }

  const dp = document.getElementById("date-picker");
  if (dp) dp.addEventListener("change", function() { if (dp.value) { currentDate = dp.value; loadSeance(); } });
  const backBtn = document.getElementById("back-today");
  if (backBtn) backBtn.addEventListener("click", function() { currentDate = todayISO(); loadSeance(); });

  document.querySelectorAll(".apply-schedule-theme").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const c = seance.classes[Number(btn.dataset.classIndex)];
      disciplineOtherMode = false;
      editingSession = sessionFromClass(c) || emptySession();
      drawSeance();
    });
  });

  // Liste des séances du jour : ouvrir une nouvelle, éditer une existante,
  // ou la supprimer.
  const newBtn = document.getElementById("new-session-btn");
  if (newBtn) newBtn.addEventListener("click", function() {
    disciplineOtherMode = false;
    editingSession = emptySession();
    drawSeance();
  });
  document.querySelectorAll(".logged-session-row").forEach(function(row) {
    row.addEventListener("click", function(e) {
      if (e.target.closest(".session-remove")) return;
      const found = seance.sessions.find(function(s) { return s.id === row.dataset.id; });
      if (found) {
        disciplineOtherMode = found.discipline && !DISCIPLINE_TO_THEMES[found.discipline];
        editingSession = Object.assign({}, found);
        drawSeance();
      }
    });
  });
  document.querySelectorAll(".session-remove").forEach(function(btn) {
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      if (!confirm("Supprimer cette séance ?")) return;
      deleteSessionRow(btn.dataset.id).then(function() { loadSeance(); }).catch(function(err) { alert("Erreur : " + err.message); });
    });
  });
  const cancelBtn = document.getElementById("cancel-session");
  if (cancelBtn) cancelBtn.addEventListener("click", function() { editingSession = null; drawSeance(); });

  const toggleHist = document.getElementById("toggle-history");
  if (toggleHist) toggleHist.addEventListener("click", function() {
    historyOpen = !historyOpen;
    drawSeance();
  });
  document.querySelectorAll(".history-item").forEach(function(btn) {
    btn.addEventListener("click", function() { currentDate = btn.dataset.date; loadSeance(); });
  });

  if (!session) return; // pas de formulaire ouvert : rien de plus à câbler

  const sessionTimeInput = document.getElementById("session-time-input");
  if (sessionTimeInput) sessionTimeInput.addEventListener("change", function() { session.time = sessionTimeInput.value; saveInBackground(); });

  const discSelect = document.getElementById("discipline-input");
  if (discSelect) discSelect.addEventListener("change", function() {
    if (discSelect.value === "__autre__") { disciplineOtherMode = true; session.discipline = ""; drawSeance(); return; }
    disciplineOtherMode = false;
    // Changement explicite de discipline (action utilisateur, pas un effet de
    // bord du rendu) : on vide les thèmes cochés pour éviter qu'une entrée
    // d'une autre discipline reste accrochée par erreur.
    session.entries = {};
    session.discipline = discSelect.value;
    update();
  });
  const discOther = document.getElementById("discipline-other");
  if (discOther) discOther.addEventListener("blur", function() { session.discipline = discOther.value; saveInBackground(); });

  document.querySelectorAll('#goal-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { session.goal = session.goal === btn.dataset.id ? null : btn.dataset.id; update(); });
  });
  document.querySelectorAll('#duration-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const preset = DURATIONS.find(function(d) { return d.id === btn.dataset.id; });
      if (session.durationPreset === preset.id) { session.durationPreset = null; session.duration = ""; }
      else if (preset.id === "plus") { session.durationPreset = "plus"; }
      else { session.durationPreset = preset.id; session.duration = preset.minutes; }
      update();
    });
  });
  const durCustom = document.getElementById("duration-custom");
  if (durCustom) durCustom.addEventListener("blur", function() { session.duration = durCustom.value; update(); });
  document.querySelectorAll('#achievement-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { session.achievement = session.achievement === btn.dataset.id ? null : btn.dataset.id; update(); });
  });
  document.querySelectorAll('#participation-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { session.participation = Number(btn.dataset.value); update(); });
  });

  document.querySelectorAll('.rpe-ladder[data-scope="global"] .rpe-bar').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const n = Number(btn.dataset.n);
      session.intensity = session.intensity === n ? 0 : n;
      update();
    });
  });

  // Thèmes : liste à cocher directement, pas d'étape d'ajout séparée.
  document.querySelectorAll('[data-action="toggle-theme"]').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.dataset.theme;
      if (session.entries[id]) delete session.entries[id]; else session.entries[id] = { contraction: "dynamique", rpe: 0 };
      update();
    });
  });
  document.querySelectorAll('[data-theme-group="contraction"]').forEach(function(row) {
    row.querySelectorAll(".pill").forEach(function(btn) {
      btn.addEventListener("click", function() { session.entries[row.dataset.theme].contraction = btn.dataset.id; update(); });
    });
  });
  document.querySelectorAll('[data-theme-group="type"]').forEach(function(row) {
    row.querySelectorAll(".pill").forEach(function(btn) {
      btn.addEventListener("click", function() { session.entries[row.dataset.theme].type = btn.dataset.id; update(); });
    });
  });
  document.querySelectorAll('[data-theme-group="niveau"]').forEach(function(row) {
    row.querySelectorAll(".pill").forEach(function(btn) {
      btn.addEventListener("click", function() { session.entries[row.dataset.theme].niveau = btn.dataset.id; update(); });
    });
  });
  document.querySelectorAll('#niveau-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { session.niveau = btn.dataset.id; update(); });
  });
  document.querySelectorAll('.rpe-ladder').forEach(function(ladder) {
    if (ladder.dataset.scope === "global") return;
    const themeId = ladder.dataset.scope.split(":")[1];
    if (!themeId) return;
    ladder.querySelectorAll(".rpe-bar").forEach(function(btn) {
      btn.addEventListener("click", function() {
        const n = Number(btn.dataset.n);
        session.entries[themeId].rpe = session.entries[themeId].rpe === n ? 0 : n;
        update();
      });
    });
  });

  const validateBtn = document.getElementById("validate-session");
  if (validateBtn) validateBtn.addEventListener("click", function() {
    validateBtn.textContent = "Enregistrement…";
    saveSessionRow(currentDate, session).then(function() {
      editingSession = null;
      loadSeance();
    }).catch(function(e) {
      validateBtn.textContent = "Erreur : " + e.message;
    });
  });
}

// ---------------- Rendu : Dashboard ----------------
let dashPeriod = "jour";
async function renderDashboard() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement du dashboard…</div>';
  let sessions = [], wearable = [], dismissedDates = [], workouts = [], errorMsg = "";
  try { sessions = await listSessions(90); } catch (e) { errorMsg = e.message; }
  try { wearable = await listWearable(40); } catch (e) { errorMsg = errorMsg || e.message; }
  try {
    const rows = await sb("dismissed_activity_flags?select=day");
    dismissedDates = (rows || []).map(function(r) { return r.day; });
  } catch (e) {}
  try { workouts = await sb("workout_sessions?select=day,training_effect_aerobic,training_effect_anaerobic&activity_type=eq.seance&order=day.desc&limit=60") || []; } catch (e) {}
  let monthMigraines = [], monthLifeload = [];
  try { monthMigraines = await sb("migraines?select=day,intensity&order=day.desc&limit=60") || []; } catch (e) {}
  try { monthLifeload = await sb("lifeload?select=day,state&order=day.desc&limit=60") || []; } catch (e) {}

  const today = todayISO();
  const todayTotalLoad = sessions.filter(function(s){ return s.date === today; }).reduce(function(s,x){ return s + (x.correctedLoad || 0); }, 0);
  const todayWearable = wearable.find(function(w){ return w.day === today; }) || null;
  const wearable7 = wearable.filter(function(w){ return w.day >= daysAgo(7); });

  let streak = 0;
  for (let i = 0; ; i++) {
    const d = daysAgo(i);
    const has = sessions.some(function(s){ return s.date === d && s.correctedLoad; });
    if (i === 0 && !has) break;
    if (!has) break;
    streak++;
  }

  // Interprétation + indicateur de forme (charge + FC repos + VFC + stress)
  let hrDiff = null, stressDiff = null, loadRatio = null, hrvDiff = null;
  const lines = [];
  const hrBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.hr_resting != null; }).map(function(w){ return w.hr_resting; }));
  if (todayWearable && todayWearable.hr_resting != null && hrBaseline != null) {
    hrDiff = todayWearable.hr_resting - hrBaseline;
    // Seuils calibrés sur la littérature (variation 3-4bpm normale au quotidien ;
    // 5+ bpm = signal significatif de fatigue/surcharge ; 10+ bpm = signal fort,
    // parfois précurseur de maladie, cf. Friman & Wesslén 2000).
    if (hrDiff >= 10) lines.push({ tone: "warn", text: "FC repos à " + todayWearable.hr_resting + " bpm, " + hrDiff.toFixed(1) + " au-dessus de ta moyenne récente (" + hrBaseline.toFixed(0) + ") — écart marqué, vigilance (fatigue ou début de maladie possibles)." });
    else if (hrDiff >= 5) lines.push({ tone: "warn", text: "FC repos à " + todayWearable.hr_resting + " bpm, " + hrDiff.toFixed(1) + " au-dessus de ta moyenne récente (" + hrBaseline.toFixed(0) + ") — fatigue possible." });
    else if (hrDiff <= -3) lines.push({ tone: "good", text: "FC repos à " + todayWearable.hr_resting + " bpm, plus basse que d'habitude — bon signe." });
  }
  const hrvBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.hrv_avg != null; }).map(function(w){ return w.hrv_avg; }));
  let hrvPct = null;
  if (todayWearable && todayWearable.hrv_avg != null && hrvBaseline != null && hrvBaseline > 0) {
    hrvDiff = todayWearable.hrv_avg - hrvBaseline;
    hrvPct = (hrvDiff / hrvBaseline) * 100;
    // Seuils basés sur la littérature HRV : 10-20% de fluctuation jour/jour est normal,
    // une baisse >20% vs baseline est généralement considérée significative (Lifestack,
    // MyHRV) ; Kiviniemi et al. utilisent 1 écart-type sous la moyenne sur 10 jours.
    if (hrvPct <= -20) lines.push({ tone: "warn", text: "VFC à " + todayWearable.hrv_avg.toFixed(0) + " ms, " + hrvPct.toFixed(0) + "% sous ta moyenne récente (" + hrvBaseline.toFixed(0) + " ms) — écart significatif, système nerveux sous tension." });
    else if (hrvPct >= 15) lines.push({ tone: "good", text: "VFC à " + todayWearable.hrv_avg.toFixed(0) + " ms, en nette hausse — bon signe de récupération." });
  }
  const stressBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.stress_avg != null; }).map(function(w){ return w.stress_avg; }));
  if (todayWearable && todayWearable.stress_avg != null && stressBaseline != null) {
    stressDiff = todayWearable.stress_avg - stressBaseline;
    if (stressDiff >= 8) lines.push({ tone: "warn", text: "Stress du jour plus élevé que d'habitude (" + todayWearable.stress_avg.toFixed(0) + " vs " + stressBaseline.toFixed(0) + ")." });
  }
  const loaded = sessions.filter(function(s){ return s.correctedLoad != null; }).slice().reverse();
  // Modèle Fitness-Fatigue (Banister et al. 1975, toujours la référence
  // utilisée par les plateformes sérieuses type TrainingPeaks) : la fatigue
  // s'accumule à chaque séance et se dissipe de façon exponentielle — pas
  // d'un coup au réveil — avec une constante de temps d'environ 7 jours
  // (fatigue aiguë) contre 28 jours pour la forme de fond (fitness/tolérance
  // chronique). Remplace l'ancienne moyenne brute des 3 dernières séances,
  // qui ne captait pas cette notion de report d'un jour sur l'autre.
  const dailyLoad = {};
  loaded.forEach(function(s) { dailyLoad[s.date] = (dailyLoad[s.date] || 0) + s.correctedLoad; });
  const allDates = Object.keys(dailyLoad).sort();
  let atl = null, ctl = null; // fatigue aiguë (7j) / forme chronique (28j)
  let atlWake = null; // fatigue accumulée jusqu'à hier, "au réveil" — avant la
  // séance du jour, pour ne pas la compter deux fois avec "Dépense du jour"
  const tauATL = 7, tauCTL = 28;
  const decayATL = Math.exp(-1 / tauATL), decayCTL = Math.exp(-1 / tauCTL);
  if (allDates.length) {
    let cursor = new Date(allDates[0]);
    const end = new Date(today);
    while (cursor <= end) {
      const d = cursor.toISOString().slice(0, 10);
      if (d === today) atlWake = atl; // valeur juste avant d'intégrer aujourd'hui
      const w = dailyLoad[d] || 0;
      atl = atl == null ? w : atl * decayATL + w * (1 - decayATL);
      ctl = ctl == null ? w : ctl * decayCTL + w * (1 - decayCTL);
      cursor.setDate(cursor.getDate() + 1);
    }
    if (atlWake == null) atlWake = atl; // si aujourd'hui hors historique (rare)
  }
  if (atl != null && ctl) {
    loadRatio = atl / ctl; // ACWR calculé proprement (EWMA), pas une moyenne de fenêtre
    // Seuils établis en sciences du sport (Gabbett et al.) : 0.8-1.3 = zone
    // favorable, >1.5 = risque accru, <0.8 = sous-sollicité récemment.
    if (loadRatio > 1.5) lines.push({ tone: "warn", text: "Fatigue accumulée nettement au-dessus de ta charge habituelle (ACWR " + loadRatio.toFixed(2) + ") — vraie zone à surveiller." });
    else if (loadRatio > 1.3) lines.push({ tone: "warn", text: "Fatigue accumulée un peu élevée par rapport à ta charge habituelle (ACWR " + loadRatio.toFixed(2) + ")." });
    else if (loadRatio < 0.8) lines.push({ tone: "neutral", text: "Charge récente en retrait par rapport à ta charge habituelle — phase plus légère." });
    else lines.push({ tone: "good", text: "Fatigue accumulée dans une zone favorable, cohérente avec ta charge habituelle." });
  }
  if (todayTotalLoad) lines.push({ tone: "neutral", text: "Séance loggée aujourd'hui — charge corrigée " + todayTotalLoad + "." });
  else lines.push({ tone: "neutral", text: "Pas de séance enregistrée aujourd'hui." });

  // Sommeil de la nuit précédente — cible générale 7-9h (littérature sommeil/performance),
  // en dessous de 6h associé à une récupération significativement dégradée.
  let sleepMin = todayWearable && todayWearable.sleep_total_min != null ? todayWearable.sleep_total_min : null;
  if (sleepMin != null) {
    const h = Math.floor(sleepMin / 60), m = sleepMin % 60;
    const label = h + "h" + (m < 10 ? "0" : "") + m;
    if (sleepMin < 360) lines.push({ tone: "warn", text: "Sommeil de " + label + " cette nuit — nettement sous les 7-9h recommandées, récupération probablement incomplète." });
    else if (sleepMin < 420) lines.push({ tone: "neutral", text: "Sommeil de " + label + " — un peu court par rapport aux 7-9h habituellement recommandées." });
    else lines.push({ tone: "good", text: "Sommeil de " + label + " — dans la fourchette recommandée." });
  }

  // Fréquence respiratoire nocturne — signal stable (peu de bruit jour/jour), utilisé
  // par WHOOP notamment ; une hausse vs baseline personnelle précède souvent maladie
  // ou récupération incomplète après une charge d'entraînement élevée.
  const respBaseline = avgOf(wearable7.filter(function(w){ return w.day !== today && w.resp_rate_avg != null; }).map(function(w){ return w.resp_rate_avg; }));
  let respDiff = null;
  if (todayWearable && todayWearable.resp_rate_avg != null && respBaseline != null) {
    respDiff = todayWearable.resp_rate_avg - respBaseline;
    if (respDiff >= 2) lines.push({ tone: "warn", text: "Fréquence respiratoire nocturne à " + todayWearable.resp_rate_avg.toFixed(1) + " resp/min, au-dessus de ta moyenne (" + respBaseline.toFixed(1) + ") — à surveiller sur plusieurs nuits (signe précoce possible de fatigue ou début de maladie)." });
  }

  let lifeload = null;
  try {
    const rows = await sb("lifeload?day=eq." + today + "&select=state");
    if (rows && rows[0]) lifeload = rows[0].state;
  } catch (e) {}

  let todayNapMin = 0, todayNapEffective = 0;
  try {
    const napRows = await sb("naps?day=eq." + today + "&select=duration_min,quality") || [];
    const qWeight = { bonne: 1.0, moyenne: 0.6, mauvaise: 0.2 };
    todayNapMin = napRows.reduce(function(s, n) { return s + n.duration_min; }, 0);
    todayNapEffective = napRows.reduce(function(s, n) { return s + n.duration_min * (qWeight[n.quality] != null ? qWeight[n.quality] : 0.6); }, 0);
  } catch (e) {}

  let todayMigraine = null;
  // Effort objectif du jour (fichiers .fit rattachés à un cours du planning)
  // — vient compléter le RPE déclaratif par une vraie mesure cardiaque,
  // automatiquement, sans ressaisie. Pondéré par les mêmes coefficients
  // neural ET tendino-articulaire que le RPE (littérature : la FC sous-estime
  // d'autant plus l'effort réel que la discipline est neuralement exigeante
  // ou sollicite fort les tendons/articulations — Handstand, Mobilité...).
  function neuralCoefficientForDiscipline(discipline, sessionNiveau) {
    if (!discipline) return 1;
    const niveauFactor = NIVEAU_FACTORS[sessionNiveau] || 1;
    const themeId = SINGLE_THEME_DISCIPLINES[discipline];
    if (themeId) {
      const t = THEMES.find(function(x){ return x.id === themeId; });
      return (t ? t.neural * t.tendino : 1) * niveauFactor;
    }
    if (discipline === "Calisthenics") {
      // Regarde ce qui a vraiment été loggé ce jour-là en Calisthenics
      // (thèmes cochés + RPE + niveau), pondéré comme dans computeLoad — pas
      // une moyenne générique des 3 thèmes possibles.
      const todayCaliEntries = sessions
        .filter(function(s) { return s.date === today && s.discipline === "Calisthenics"; })
        .reduce(function(acc, s) { return Object.assign(acc, s.entries); }, {});
      const active = Object.entries(todayCaliEntries).filter(function(e){ return e[1].rpe > 0; });
      const totalRpe = active.reduce(function(sum,e){ return sum + e[1].rpe; }, 0);
      if (active.length && totalRpe > 0) {
        return active.reduce(function(sum,e){
          const t = THEMES.find(function(th){ return th.id === e[0]; });
          const nf = NIVEAU_FACTORS[e[1].niveau] || 1;
          return sum + (t ? t.neural * t.tendino : 1) * nf * e[1].rpe;
        }, 0) / totalRpe;
      }
      // Repli si rien n'est encore loggé pour cette séance : moyenne des 3 thèmes.
      const caliThemes = THEMES.filter(function(t){ return ["tirage","poussee","complet"].indexOf(t.id) !== -1; });
      return avgOf(caliThemes.map(function(t){ return t.neural * t.tendino; }));
    }
    return 1;
  }
  let todayFitEffort = 0, todayFitSessions = [];
  try {
    todayFitSessions = await sb("workout_sessions?day=eq." + today + "&activity_type=eq.seance&select=training_effect_aerobic,training_effect_anaerobic,matched_discipline") || [];
    todayFitEffort = todayFitSessions.reduce(function(s, w) {
      const te = (Number(w.training_effect_aerobic) || 0) + (Number(w.training_effect_anaerobic) || 0);
      const matchedSession = sessions.find(function(s) { return s.date === today && s.discipline === w.matched_discipline; });
      return s + te * neuralCoefficientForDiscipline(w.matched_discipline, matchedSession ? matchedSession.niveau : null);
    }, 0);
  } catch (e) {}
  // Trajets à vélo du jour — coût réel mais modeste (pas de complexité
  // neurale particulière, coefficient neutre 1.0), pris en compte séparément
  // pour ne pas les confondre avec une vraie séance dans le récap.
  let todayTripEffort = 0, todayTripCount = 0;
  try {
    const todayTrips = await sb("workout_sessions?day=eq." + today + "&activity_type=eq.trajet&select=training_effect_aerobic,training_effect_anaerobic") || [];
    todayTripCount = todayTrips.length;
    todayTripEffort = todayTrips.reduce(function(s, w) { return s + (Number(w.training_effect_aerobic) || 0) + (Number(w.training_effect_anaerobic) || 0); }, 0);
  } catch (e) {}
  let history_migraines_count = 0, migraine_signature = null;
  try {
    const migRows = await sb("migraines?select=day") || [];
    const migDays = migRows.map(function(r){ return r.day; });
    history_migraines_count = migDays.length;
    if (migDays.length >= 5) {
      const migWearable = wearable.filter(function(w){ return migDays.indexOf(w.day) !== -1; });
      const baseWearable = wearable.filter(function(w){ return migDays.indexOf(w.day) === -1; });
      function avgF(arr, f) { const v = arr.map(function(w){return w[f];}).filter(function(x){return x!=null;}); return v.length ? avgOf(v) : null; }
      const bHr = avgF(baseWearable, "hr_resting"), mHr = avgF(migWearable, "hr_resting");
      const bHrv = avgF(baseWearable, "hrv_avg"), mHrv = avgF(migWearable, "hrv_avg");
      const bStress = avgF(baseWearable, "stress_avg"), mStress = avgF(migWearable, "stress_avg");
      const mSleep = avgF(migWearable, "sleep_total_min");
      migraine_signature = {
        hrDiff: (bHr != null && mHr != null) ? mHr - bHr : null,
        hrvPct: (bHrv != null && mHrv != null && bHrv > 0) ? ((mHrv - bHrv) / bHrv) * 100 : null,
        stressDiff: (bStress != null && mStress != null) ? mStress - bStress : null,
        sleepMin: mSleep,
      };
    }
  } catch (e) {}
  try {
    const rows = await sb("migraines?day=eq." + today + "&select=intensity");
    if (rows && rows.length) todayMigraine = Math.max.apply(null, rows.map(function(r) { return r.intensity || 5; }));
  } catch (e) {}

  let score = 75, signals = 0;
  if (hrDiff != null) { signals++; if (hrDiff >= 10) score -= 30; else if (hrDiff >= 5) score -= 15; else if (hrDiff >= 3) score -= 3; else if (hrDiff <= -3) score += 5; }
  if (hrvPct != null) { signals++; if (hrvPct <= -30) score -= 25; else if (hrvPct <= -20) score -= 15; else if (hrvPct <= -10) score -= 5; else if (hrvPct >= 15) score += 10; }
  if (stressDiff != null) { signals++; if (stressDiff >= 10) score -= 25; else if (stressDiff >= 5) score -= 10; }
  if (loadRatio != null) { signals++; } // le score réagit désormais en continu via atlWake ci-dessous, pas juste à un seuil
  // Dépense d'énergie du jour — dégressif au fil des séances loguées
  // aujourd'hui, indépendamment de loadRatio (qui compare une tendance sur
  // plusieurs jours). Ici, chaque séance loguée fait baisser le score
  // immédiatement et visiblement : c'est ce qui restait sans effet avant.
  let todayDepletion = 0;
  if (todayTotalLoad > 0) {
    signals++;
    todayDepletion = Math.min(35, Math.round(todayTotalLoad / 60));
    score -= todayDepletion;
  }
  // Fatigue accumulée "au réveil" — ce que les jours précédents laissent
  // encore aujourd'hui (modèle Fitness-Fatigue, décroissance exponentielle
  // ~7j), distincte de la dépense du jour même pour ne pas compter deux fois
  // une même séance. C'est une vraie déduction continue, proportionnelle au
  // niveau de fatigue reporté, pas juste un déclenchement à un seuil.
  let wakeFatigueDeduction = 0, freshnessBonus = 0;
  if (atlWake != null && atlWake > 0) {
    signals++;
    wakeFatigueDeduction = Math.min(30, Math.round(atlWake / 70));
    score -= wakeFatigueDeduction;
  }
  // Bonus explicite de fraîcheur — pas juste "moins de pénalité", un vrai
  // ajout quand ta fatigue accumulée est nettement sous ta charge chronique
