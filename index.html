  });
}
let recuperationSubTab = "jour";
async function loadRecuperation() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  const today = todayISO();
  let errorMsg = "";
  const [wearable, todayNaps, migraines, workouts] = await Promise.all([
    listWearable(40).catch(function(e) { errorMsg = errorMsg || e.message; return []; }),
    sb("naps?day=eq." + today + "&select=*&order=created_at.asc").catch(function() { return []; }),
    sb("migraines?select=day,intensity&order=day.desc&limit=90").catch(function() { return []; }),
    sb("workout_sessions?select=start_time,hrr_1min,duration_min,training_effect_aerobic,training_effect_anaerobic&activity_type=eq.seance&order=start_time.asc&limit=200").catch(function() { return []; }),
  ]);

  const last14 = []; for (let i = 13; i >= 0; i--) last14.push(daysAgo(i));
  const nights = last14.map(function(d) {
    const w = wearable.find(function(x){ return x.day === d; });
    return { date: d, total: w ? w.sleep_total_min : null, light: w ? w.sleep_light_min : null, deep: w ? w.sleep_deep_min : null, rem: w ? w.sleep_rem_min : null };
  });
  const withSleep = nights.filter(function(n) { return n.total != null; });
  const latest = withSleep.length ? withSleep[withSleep.length - 1] : null;
  const avgTotal = withSleep.length ? avgOf(withSleep.map(function(n){ return n.total; })) : null;

  let sleepScore = null, sleepTier = null, sleepTierColor = "muted";
  if (latest) {
    sleepScore = 100;
    const totalH = latest.total / 60;
    if (totalH < 6) sleepScore -= 35; else if (totalH < 7) sleepScore -= 12; else if (totalH > 9.5) sleepScore -= 8;
    const deepPct = Math.round((latest.deep / latest.total) * 100);
    const remPct = Math.round((latest.rem / latest.total) * 100);
    if (deepPct < 13) sleepScore -= 15; else if (deepPct > 23) sleepScore -= 5;
    if (remPct < 15) sleepScore -= 15; else if (remPct < 20 || remPct > 25) sleepScore -= 5;
    sleepScore = Math.max(0, Math.min(100, sleepScore));
    sleepTier = sleepScore >= 70 ? "Bon" : sleepScore >= 40 ? "Correct" : "Insuffisant";
    sleepTierColor = sleepScore >= 70 ? "green" : sleepScore >= 40 ? "amber" : "red";
  }

  const pai7 = wearable.filter(function(w){ return w.day >= daysAgo(6); });
  const weeklyPai = pai7.reduce(function(s, w){ return s + (w.pai_low||0) + (w.pai_moderate||0) + (w.pai_high||0); }, 0);

  const totalNapMin = todayNaps.reduce(function(s, n) { return s + n.duration_min; }, 0);
  const todayMigRow = migraines.find(function(m){ return m.day === today; });

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<div class="muted" style="margin-bottom:18px">' + formatDateLabel(today) + "</div>";

  html += '<div class="pill-row compact" style="margin-bottom:16px" id="recuperation-subtab-row">';
  [["jour","Aujourd'hui"],["tendance","Tendance"]].forEach(function(p) {
    html += '<button class="pill' + (recuperationSubTab === p[0] ? " active" : "") + '" data-subtab="' + p[0] + '">' + p[1] + "</button>";
  });
  html += "</div>";

  if (recuperationSubTab === "jour") {
    if (!latest) {
      html += '<div class="card"><div class="muted" style="text-align:center;padding:16px 0">Pas encore de nuit trackée récente.</div></div>';
    } else {
      const h = Math.floor(latest.total / 60), m = latest.total % 60;
      html += '<div style="margin:16px 0 28px"><div class="section-label" style="display:flex;justify-content:space-between;align-items:center"><span>' + sectionIcon("moon") + 'Sommeil</span><span>' + tierDot(sleepTierColor) + '</span></div>';
      html += '<div style="padding:18px 0">' + singleScoreGaugeHtml(sleepScore, 100, { sublabel: sleepTier, size: 300, icon: "moon" }) + "</div>";
      html += '<div style="text-align:center;padding-top:14px;border-top:1px solid var(--line);font-size:13px"><b>' + h + 'h' + (m<10?'0':'') + m + '</b>';
      if (avgTotal != null) html += ' <span class="muted">· moyenne 14j : ' + Math.floor(avgTotal/60) + 'h' + Math.round(avgTotal%60).toString().padStart(2,'0') + '</span>';
      html += "</div></div>";

      const stageTotal = latest.total || 1;
      const deepPct = Math.round((latest.deep/stageTotal)*100), remPct = Math.round((latest.rem/stageTotal)*100), lightPct = Math.round((latest.light/stageTotal)*100);
      const stagesTier = (deepPct < 13 || remPct < 15) ? "amber" : "green";

      const latestW = wearable.find(function(x){ return x.day === latest.date; });
      const checklist = [];
      checklist.push({ label: "Sommeil", icon: "moon", iconColor: "var(--steel)", tier: sleepTierColor, note: sleepScore + "/100 · " + sleepTier });
      checklist.push({ label: "Stades", icon: "list", iconColor: "var(--purple)", tier: stagesTier, note: "Léger " + lightPct + "% · Profond " + deepPct + "% · REM " + remPct + "%" });
      if (latestW && latestW.bedtime_hour != null && latestW.wake_hour != null) {
        checklist.push({ label: "Coucher → réveil", icon: "moon", iconColor: "var(--steel)", tier: "steel", note: hoursToLabel(latestW.bedtime_hour) + " → " + hoursToLabel(latestW.wake_hour) });
      } else if (latestW && latestW.wake_hour != null) {
        checklist.push({ label: "Réveil", icon: "moon", iconColor: "var(--steel)", tier: "steel", note: hoursToLabel(latestW.wake_hour) });
      }
      checklist.push({ label: "Sieste", icon: "moon", iconColor: "var(--pink)", tier: totalNapMin > 0 ? "green" : "steel", note: totalNapMin > 0 ? totalNapMin + " min" : "Ø" });
      checklist.push({ label: "PAI (semaine)", icon: "heart", iconColor: "var(--red)", tier: weeklyPai >= 100 ? "green" : "amber", note: weeklyPai >= 100 ? "Objectif atteint" : Math.round(weeklyPai) + "/100" });
      if (todayMigRow) checklist.push({ label: "Migraine", icon: "bandage", iconColor: "var(--red)", tier: "red", note: (todayMigRow.intensity || "–") + "/10" });

      html += collapsibleCardHtml(sectionIcon("list") + 'Récap du jour');
      checklist.forEach(function(c) { html += checklistRowHtml(c); });
      html += '<div class="muted" style="font-size:10px;margin-top:6px">Indicatif — ne remplace pas ton ressenti ni un avis médical.</div></details>';
    }
  } else {

    const sleepWeekBars = nights.slice(-7).map(function(n) { return { label: formatDateLabel(n.date).slice(0,2), val: n.total ? Math.round(n.total/60*10)/10 : 0, migraine: migDaySet.indexOf(n.date) !== -1 }; });
    const month = []; for (let i = 29; i >= 0; i--) month.push(daysAgo(i));
    const sleepMonthLine = [];
    for (let w = 0; w < 5; w++) {
      const bd = month.slice(w*6, w*6+6); if (!bd.length) continue;
      const vals = wearable.filter(function(x){ return bd.indexOf(x.day) !== -1 && x.sleep_total_min != null; }).map(function(x){ return x.sleep_total_min/60; });
      sleepMonthLine.push({ label: bd[0].slice(8,10)+"-"+bd[bd.length-1].slice(8,10), val: vals.length ? avgOf(vals) : 0, migraine: bd.some(function(d){ return migDaySet.indexOf(d) !== -1; }) });
    }
    const recentSleep = withSleep.slice(-7).map(function(n){ return n.total; });
    const olderSleep = withSleep.slice(-14, -7).map(function(n){ return n.total; });
    let sleepPhrase = "Pas encore assez de nuits pour une tendance.";
    if (recentSleep.length >= 3 && olderSleep.length >= 3) {
      const diffMin = avgOf(recentSleep) - avgOf(olderSleep);
      sleepPhrase = diffMin <= -30 ? "En baisse de " + Math.round(-diffMin) + " min sur les 7 dernières nuits vs les 7 précédentes."
        : diffMin >= 30 ? "En hausse de " + Math.round(diffMin) + " min sur les 7 dernières nuits."
        : "Stable sur les 2 dernières semaines.";
    }
    html += metricTrendSectionHtml("Durée de sommeil", sleepWeekBars, sleepMonthLine, sleepPhrase, { decimals: 1, unit: "h", qualify: qualifySleepHours });

    // Le PAI se lit nativement en total glissant sur 7 jours, pas jour par
    // jour — la "semaine" montre la contribution quotidienne au score actuel,
    // le "mois" montre l'évolution de ce total sur les 4 dernières semaines.
    const paiDailyBars = last14.slice(-7).map(function(d) {
      const w = wearable.find(function(x){ return x.day === d; });
      const total = w ? (w.pai_low||0)+(w.pai_moderate||0)+(w.pai_high||0) : 0;
      return { label: formatDateLabel(d).slice(0,2), val: Math.round(total), migraine: migDaySet.indexOf(d) !== -1 };
    });
    const paiWeeks = [[0,7],[7,14],[14,21],[21,28]];
    const paiWeeklyLine = paiWeeks.map(function(w, idx) {
      const days = month.slice(w[0], w[1]);
      const total = wearable.filter(function(x){ return days.indexOf(x.day) !== -1; }).reduce(function(s,x){ return s + (x.pai_low||0)+(x.pai_moderate||0)+(x.pai_high||0); }, 0);
      return { label: idx === 0 ? "cette sem." : "-" + idx + "sem", val: Math.round(total), migraine: days.some(function(d){ return migDaySet.indexOf(d) !== -1; }) };
    }).reverse();
    const paiPhrase = weeklyPai >= 100 ? "Objectif hebdomadaire de 100 atteint." : "À " + Math.round(weeklyPai) + "/100 cette semaine — vise 100 pour le bénéfice cardiovasculaire associé.";
    html += metricTrendSectionHtml("PAI", paiDailyBars, paiWeeklyLine, paiPhrase, { showAvg: false });

    if (hrrRows.length >= 3) {

      const hrrLine = hrrRows.slice(-15).map(function(w) { const d = w.start_time.slice(0,10); return { label: formatDateLabel(d).slice(0,2), val: w.hrr_1min, migraine: migDaySet.indexOf(d) !== -1 }; });
      const hrrRecentAvg = avgOf(hrrRows.slice(-3).map(function(w){ return w.hrr_1min; }));
      html += metricTrendSectionHtml("Récupération cardiaque (HRR, 1min)", hrrBars, hrrLine, "Moyenne récente : " + hrrRecentAvg.toFixed(0) + " bpm — approximatif (capteur poignet, immobilité post-effort non garantie).", { unit: " bpm" });
    }

    const migWeek = migraines.filter(function(m){ return m.day >= daysAgo(6); });
    const migMonth = migraines.filter(function(m){ return m.day >= daysAgo(29); });
    html += '<div class="card"><div class="section-label">' + sectionIcon("bandage") + 'Fréquence des migraines</div><div class="stat-row">';
    html += statHtml("Cette semaine", migWeek.length, migWeek.length >= 2 ? "amber" : null);
    html += statHtml("Ce mois-ci", migMonth.length, migMonth.length >= 3 ? "amber" : null);
    html += "</div></div>";

    html += '<div class="muted" style="font-size:11px;text-align:center;margin:4px 0 16px">Corrélation avec le sommeil/stress, déclencheurs fréquents et historique complet : demande au Coach.</div>';
  }

  app.innerHTML = html;
  document.querySelectorAll('#recuperation-subtab-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { recuperationSubTab = btn.dataset.subtab; loadRecuperation(); });
  });
}
// Graphique en barres lisible : valeur numérique au-dessus de chaque barre,

function scoreTierColor(pct, invert) {
  if (invert) pct = 1 - pct;
  if (pct >= 0.7) return "green";
  if (pct >= 0.4) return "amber";
  return "red";
}

    bandage: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8" stroke-linecap="round"/>',

// Icône devant un titre de section (.section-label) — même couleur que
// cette icône dans les lignes de Récap du jour (checklist.push plus haut),
// pas un gris neutre, pour rester cohérent avec le reste de l'appli.
const SECTION_ICON_COLORS = {
  person: "var(--pink)", target: "var(--green)", lightning: "var(--amber)",
  heart: "var(--red)", pulse: "var(--pink)", moon: "var(--steel)",
  flame: "var(--rust)", bike: "var(--green)", bandage: "var(--red)",
  dumbbell: "var(--rust)", battery: "var(--amber)", watch: "var(--steel)",
  thought: "var(--purple)", list: "var(--purple)",
};
function sectionIcon(name) {
  return statIconSvg(name, SECTION_ICON_COLORS[name] || "var(--muted)", 13) + " ";
}
// Jauge à indicateur unique (Score d'entraînement, Sommeil) : même principe
// que formeVigilanceGaugeHtml — illustration fournie par l'utilisateur
// (score-shape.webp, fond noir pur, mix-blend-mode:screen) recolorée par
// filter CSS selon le tier, plutôt qu'un anneau SVG. Signature proche de
// l'ancien circleGaugeHtml (value/max/opts.sublabel/opts.size) pour limiter
// les changements côté appelants.
function singleScoreGaugeHtml(value, max, opts) {
  opts = opts || {};
  const pct = Math.max(0, Math.min(1, value / max));
  const tier = opts.tier || scoreTierColor(pct, opts.invert);
  const size = opts.size || 280;
  const solidColor = "var(--" + tier + ")";
  const tintFilter = tier === "amber" ? "grayscale(0.6) sepia(0.8) saturate(4.5) brightness(1.05)"
    : tier === "red" ? "grayscale(0.6) sepia(0.8) hue-rotate(-62deg) saturate(5) brightness(1.05)"
    : "none";
  // aspect-ratio (pas le classique padding-top:100%) : avec max-width posé
  // sur ce même élément, un padding-top en % se calcule sur la largeur du
  // parent (non cappée par ce max-width), pas sur celle de l'élément —
  // l'ovale déformé constaté vient de là.
  let html = '<div style="position:relative;width:100%;max-width:' + size + 'px;margin:0 auto;aspect-ratio:1">';
  html += '<img src="score-shape.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;filter:' + tintFilter + '">';
  html += '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">';
  if (opts.icon) html += '<span style="display:block;line-height:0;margin-bottom:6px">' + statIconSvg(opts.icon, solidColor, Math.round(size*0.09)) + "</span>";
  html += '<span style="font-size:' + Math.round(size*0.26) + 'px;font-weight:900;color:var(--chalk);line-height:1;text-shadow:0 0 14px ' + solidColor + '55">' + Math.round(value) + "</span>";
  if (opts.sublabel) html += '<span style="font-size:11px;font-weight:800;text-transform:uppercase;color:' + solidColor + ';margin-top:4px">' + opts.sublabel + "</span>";
  html += "</div></div>";
  return html;
}

// Jauge Forme + Vigilance : deux orbes qui se chevauchent (au lieu de deux
// anneaux concentriques) avec halo néon flouté + texture pointillée en
// arrière-plan de chaque cercle, et un badge de score composite flottant à
// leur jonction — cf. maquette utilisateur (2026-09). Vigilance en vert
// (couleur de catégorie propre à cette jauge, distincte du rose Forme),
// gérée avec un état neutre/estompé si pas encore de créneau comparable
// aujourd'hui plutôt que de faire disparaître le cercle. Le lobe gauche
// affiche la FC repos (et non le score Forme, déjà affiché au centre —
// le répéter dans le lobe n'apportait rien).
// Utilise directement l'illustration fournie par l'utilisateur
// (forme-vigilance-shape.webp, fond noir pur) plutôt qu'une reconstruction en
// SVG — bien plus fidèle qu'une approximation faite main. Le fond noir se
// fond dans le fond de l'appli via mix-blend-mode:screen (screen avec du
// noir = no-op), donc pas besoin d'une version détourée/transparente. Les
// nombres/libellés sont surimposés en position absolue, en pourcentages
// calés sur l'image de référence (mesurés avec une grille de repères).
// Couleur selon le score (demandé explicitement) : l'image est nativement
// rose/vert (un bon score). Pour Suffisante/Insuffisante, un filter CSS
// appliqué à l'image elle-même (jamais un calque séparé — un rectangle par
// dessus recolore aussi le fond noir autour de la forme, qui n'est jamais
// un noir parfaitement pur pixel à pixel, d'où un vilain bandeau teinté
// autour du visuel constaté en test). grayscale+sepia ramène rose ET vert
// sur un seul axe de teinte chaude avant de tourner cet axe vers l'ambre ou
// le rouge — recolore tout le visuel, piloté par le tier Forme (l'indicateur
// dominant — Forme et Vigilance ne peuvent pas être recolorées
// indépendamment sur une image unique).
function formeVigilanceGaugeHtml(formeScore, formeTierColor, formeTierLabel, vigScore, hrResting) {
  const hasVig = vigScore != null;
  const hasHr = hrResting != null;
  const RATIO = 841 / 1871; // hauteur / largeur réelles de l'image
  const tintFilter = formeTierColor === "amber" ? "grayscale(0.6) sepia(0.8) saturate(4.5) brightness(1.05)"
    : formeTierColor === "red" ? "grayscale(0.6) sepia(0.8) hue-rotate(-62deg) saturate(5) brightness(1.05)"
    : "none";

  function posHtml(xPct, yPct, contentHtml, extraStyle) {
    return '<div style="position:absolute;left:' + xPct + '%;top:' + yPct + '%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;' + (extraStyle || "") + '">' + contentHtml + "</div>";
  }
  function sideBlock(iconName, value, label, colorVar, dimmed) {
    let s = '<div style="display:flex;flex-direction:column;align-items:center;gap:2px">';
    s += '<span style="display:block;line-height:0">' + statIconSvg(iconName, dimmed ? "var(--muted)" : colorVar, 14) + "</span>";
    s += '<span style="font-size:27px;font-weight:900;color:var(--chalk);line-height:1' + (dimmed ? "" : ";text-shadow:0 0 10px " + colorVar + "88") + '">' + (dimmed ? "–" : Math.round(value)) + "</span>";
    s += '<span style="font-size:10px;font-weight:800;text-transform:uppercase;color:' + colorVar + ';letter-spacing:.4px;white-space:nowrap">' + label + "</span>";
    s += "</div>";
    return s;
  }

  let html = '<div style="position:relative;width:100%;padding-top:' + (RATIO * 100) + '%">';
  html += '<img src="forme-vigilance-shape.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;filter:' + tintFilter + '">';
  html += posHtml(50, 22, '<span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Ton score</span>');
  html += posHtml(50, 42, '<span style="font-size:34px;font-weight:900;color:var(--chalk)">' + Math.round(formeScore) + "</span>");
  html += posHtml(50, 59, '<span style="font-size:12px;font-weight:800;text-transform:uppercase;color:var(--' + formeTierColor + ')">' + esc(formeTierLabel) + "</span>");
  html += posHtml(50, 72, statIconSvg("pulse", "var(--muted)", 17));
  html += posHtml(15, 47, sideBlock("heart", hrResting, "FC repos", "var(--pink)", !hasHr));
  html += posHtml(85, 47, sideBlock("target", vigScore != null ? vigScore : 0, "Vigilance", "var(--green)", !hasVig));
  html += "</div>";
  return html;
}

function barChartHtml(items, opts) {
  opts = opts || {};
  const decimals = opts.decimals || 0;
  const height = opts.height || 64;
  const unit = opts.unit || "";
  const vals = items.map(function(i) { return i.val; });
  const max = Math.max.apply(null, vals.concat([1]));
  let html = '<div style="display:flex;align-items:flex-end;gap:6px">';
  items.forEach(function(item, i) {
    const v = item.val || 0;
    const h = v > 0 ? Math.max(18, (v / max) * height) : 4;
    const isLast = i === items.length - 1;
    const barStyle = isLast && v > 0 ? "background:var(--gradient)" : "background:var(--steel);opacity:0.75";
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">';
    // Migraine ce jour-là (ou dans cette période groupée) — repère visuel
    // pour situer les migraines dans le temps sur toutes les courbes de
    // l'appli, pas juste dans l'historique migraine.
    html += '<span style="font-size:10px;color:var(--rust);line-height:1;height:11px" title="Migraine">' + (item.migraine ? "✦" : "") + "</span>";
    html += '<span style="font-size:9px;color:var(--chalkDim);white-space:nowrap">' + (v > 0 ? v.toFixed(decimals) : "–") + "</span>";
    html += '<div style="width:100%;height:' + h + 'px;' + barStyle + ';border-radius:3px 3px 1px 1px"></div>';
    html += '<span style="font-size:9px;color:var(--muted)">' + (item.label || "") + "</span>";
    html += "</div>";
  });
  html += "</div>";
  if (items.some(function(item) { return item.migraine; })) {
    html += '<div class="muted" style="text-align:right;font-size:9px;margin-top:4px"><span style="color:var(--rust)">✦</span> migraine</div>';
  }
  if (opts.showAvg !== false) {
    const nonZero = vals.filter(function(v) { return v > 0; });
    if (nonZero.length >= 2) {
      const avgVal = avgOf(nonZero);
      let tier = null;
      if (opts.trendQualify) tier = opts.trendQualify(items);
      else if (opts.qualify) tier = opts.qualify(avgVal);
      const avgColor = tier ? "var(--" + tier + ")" : "var(--chalk)";
      const trendNote = opts.trendQualify && tier ? (tier === "green" ? " ↗ en hausse" : tier === "red" ? " ↘ en baisse" : " → stable") : "";
      html += '<div class="muted" style="text-align:center;font-size:11px;margin-top:8px">moyenne : <b style="color:' + avgColor + '">' + avgVal.toFixed(decimals) + unit + "</b>" + trendNote + "</div>";
    }
  }
  return html;
}

// Graphique en courbe pour la vue mensuelle — même signature d'options que
// barChartHtml (decimals/height/unit/showAvg/qualify/trendQualify), pour
// afficher les deux dans metricTrendSectionHtml sans dupliquer de logique.
// Une courbe distingue visuellement "mois" de "semaine" (barres) au premier
// coup d'œil, sans avoir à relire les libellés.
function lineChartHtml(items, opts) {
  opts = opts || {};
  const decimals = opts.decimals || 0;
  const height = opts.height || 64;
  const unit = opts.unit || "";
  const vals = items.map(function(i) { return i.val || 0; });
  const max = Math.max.apply(null, vals.concat([1]));
  const min = Math.min.apply(null, vals.concat([0]));
  const range = (max - min) || 1;
  const padY = 6;
  const usableH = Math.max(1, height - padY * 2);
  const n = items.length;
  // Coordonnées en pourcentage (x et y), pas en unités SVG arbitraires — le
  // viewBox carré 0-100/0-100 avec preserveAspectRatio="none" étire la ligne
  // de façon non uniforme pour remplir la largeur réelle de la carte (bien
  // plus large que haute), ce qui déformait aussi les points ronds en
  // ellipses. Les points sont donc dessinés en HTML par-dessus le SVG
  // (positionnement en %), pas comme géométrie SVG — seule la ligne, qui ne
  // souffre pas d'être étirée, reste dans le SVG.
  const points = items.map(function(item, i) {
    const v = item.val || 0;
    const xPct = n > 1 ? (i / (n - 1)) * 100 : 50;
    const yPct = ((padY + (usableH - ((v - min) / range) * usableH)) / height) * 100;
    return { xPct: xPct, yPct: yPct };
  });
  const pathD = points.map(function(p, i) { return (i === 0 ? "M" : "L") + p.xPct.toFixed(2) + "," + p.yPct.toFixed(2); }).join(" ");
  // Données pour le tooltip au doigt/à la souris (voir wireLineChartTooltips
  // plus bas) — encodées en attribut plutôt que relues depuis le DOM des
  // points, pour ne pas dépendre de leur mise en forme visuelle.
  const touchData = points.map(function(p, i) {
    const v = items[i].val || 0;
    return { x: p.xPct, label: items[i].label || "", display: v.toFixed(decimals) + unit };
  });
  let html = '<div class="line-chart-touch" data-points="' + encodeURIComponent(JSON.stringify(touchData)) + '" style="position:relative;height:' + height + 'px;touch-action:pan-y">';
  html += '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">';
  if (n > 1) html += '<path d="' + pathD + '" fill="none" stroke="var(--steel)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>';
  html += "</svg>";
  points.forEach(function(p, i) {
    const isLast = i === points.length - 1;
    const size = isLast ? 6 : 4;
    const color = isLast ? "var(--pink)" : "var(--steel)";
    html += '<div style="position:absolute;left:' + p.xPct.toFixed(2) + '%;top:' + p.yPct.toFixed(2) + '%;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + color + ';transform:translate(-50%,-50%)"></div>';
    // Migraine dans cette période (jour ou tranche groupée) — même repère
    // visuel que barChartHtml, positionné juste au-dessus du point.
    if (items[i].migraine) {
      html += '<div style="position:absolute;left:' + p.xPct.toFixed(2) + '%;top:' + p.yPct.toFixed(2) + '%;transform:translate(-50%,-180%);font-size:11px;color:var(--rust)" title="Migraine">✦</div>';
    }
  });
  // Repère + bulle de valeur, cachés par défaut — affichés au doigt/à la
  // souris par le gestionnaire global (délégation d'événements, voir plus
  // bas) : pas besoin de rebrancher quoi que ce soit à chaque rendu.
  html += '<div class="lc-cursor" style="display:none;position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none"></div>';
  html += '<div class="lc-tooltip" style="display:none;position:absolute;top:0;background:var(--surfaceRaised);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:800;color:var(--chalk);white-space:nowrap;pointer-events:none;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,0.35)"></div>';
  html += "</div>";
  html += '<div style="display:flex;justify-content:space-between;margin-top:4px">';
  items.forEach(function(item) {
    html += '<span style="font-size:9px;color:var(--muted);flex:1;text-align:center">' + (item.label || "") + "</span>";
  });
  html += "</div>";
  if (items.some(function(item) { return item.migraine; })) {
    html += '<div class="muted" style="text-align:right;font-size:9px;margin-top:4px"><span style="color:var(--rust)">✦</span> migraine</div>';
  }
  if (opts.showAvg !== false) {
    const nonZero = vals.filter(function(v) { return v > 0; });
    if (nonZero.length >= 2) {
      const avgVal = avgOf(nonZero);
      let tier = null;
      if (opts.trendQualify) tier = opts.trendQualify(items);
      else if (opts.qualify) tier = opts.qualify(avgVal);
      const avgColor = tier ? "var(--" + tier + ")" : "var(--chalk)";
      const trendNote = opts.trendQualify && tier ? (tier === "green" ? " ↗ en hausse" : tier === "red" ? " ↘ en baisse" : " → stable") : "";
      html += '<div class="muted" style="text-align:center;font-size:11px;margin-top:8px">moyenne : <b style="color:' + avgColor + '">' + avgVal.toFixed(decimals) + unit + "</b>" + trendNote + "</div>";
    }
  }
  return html;
}

// Compose un bloc de tendance complet pour une métrique : barres semaine +
// courbe mois + une seule phrase d'interprétation pratique. Jamais utilisé
// deux fois pour la même métrique (une section = une métrique), et jamais
// plus qu'une phrase de commentaire — c'est la règle anti-fourre-tout des
// onglets Tendance, imposée une fois ici plutôt que rappelée à chaque appel.
const METRIC_TREND_ICONS = {
  "VFC": "pulse",
  "FC repos": "heart",
  "Stress": "lightning",
  "Charge d'entraînement": "dumbbell",
  "Force de préhension": "dumbbell",
  "Durée de sommeil": "moon",
  "PAI": "heart",
  "Récupération cardiaque (HRR, 1min)": "heart",
};
function metricTrendSectionHtml(title, weeklyItems, monthlyItems, interpretation, opts) {
  opts = opts || {};
  const icon = METRIC_TREND_ICONS[title];
  let html = '<div class="card"><div class="section-label">' + (icon ? sectionIcon(icon) : "") + esc(title) + '</div>';
  html += '<div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Semaine</div>';
  html += barChartHtml(weeklyItems, opts);
  html += '<div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 4px">Mois</div>';
  html += lineChartHtml(monthlyItems, Object.assign({}, opts, { showAvg: false }));
  if (interpretation) {
    html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--chalkDim)">' + esc(interpretation) + "</div>";
  }
  html += "</div>";
  return html;
}

// Score d'entraînement du jour — l'inverse du sommeil : démarre haut selon
// la fatigue déjà accumulée au réveil (avant la séance du jour), puis se
// vide au fil des séances loguées dans la journée. Pure et testable seule :
// mêmes intrants (atlWake/ctl/todayTotalLoad) que le panier fatigue du score
// Forme (index.html, calcul d'atl/ctl et todayDepletion), pas de nouvelle
// source de données.
// Barèmes recalibrés le 2026-09 sur l'historique réel de charge (rétrotest,
// voir conversation) : les seuils d'origine (÷10 avec plafond 70, ÷55 avec
// plafond 45) faisaient plafonner les deux dépréciations en même temps dès
// qu'une journée cumulait deux séances — le score restait bloqué à 0 pendant
// 9 jours d'affilée sur les vraies données, aussi bien un jour de grosse
// double séance qu'un jour de récupération. Diviseurs et plafonds réduits
// pour que le score reste discriminant même sur les journées chargées.
function computeTrainingEnergy(atlWake, ctl, todayTotalLoad) {
  let wakeDepletion = 0, sessionDepletion = 0;
  if (atlWake != null && ctl) {
    const wakeRatio = atlWake / ctl;
    wakeDepletion = Math.max(0, Math.min(35, Math.round((wakeRatio - 0.7) * 40)));
  }
  if (todayTotalLoad > 0) {
    sessionDepletion = Math.max(0, Math.min(55, Math.round(todayTotalLoad / 25)));
  }
  const energy = Math.max(0, Math.min(100, 100 - wakeDepletion - sessionDepletion));
  return { energy: energy, wakeDepletion: wakeDepletion, sessionDepletion: sessionDepletion };
}

// Seuils déjà utilisés ailleurs dans l'appli (stress 0-100 Zepp ; sommeil 7-9h
// optimal) — réutilisés ici pour rester cohérent, pas de nouveau seuil inventé.
function qualifyStress(v) { return v >= 50 ? "red" : v >= 30 ? "amber" : "green"; }
// Seuils calibrés pour un homme de 42 ans (profil connu), croisés sur deux
// tableaux normatifs indépendants (population US, revues cliniques). Pas
// universels — recalibrer si le profil change.
function qualifyRHR(v) { return v >= 83 ? "red" : v >= 71 ? "amber" : "green"; }
function qualifyHRV(v) { return v < 20 ? "red" : v < 40 ? "amber" : "green"; }

// Pour la charge d'entraînement : pas de "bon" chiffre absolu, mais dans une
// logique de progression long terme (sans pic de compétition visé), la
// direction de la tendance a du sens — hausse soutenue = progression, plat/
// baisse = stagnation ou surcharge à surveiller selon le contexte.
function qualifySleepHours(v) { return v < 6 ? "red" : (v < 7 || v > 9.5) ? "amber" : "green"; }

const TRIGGERS = [

function nowForDatetimeInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
let migraineForm = { startDateTime: nowForDatetimeInput(), endDateTime: "", intensity: 5, triggers: [], notes: "" };

// ---------------- Respiration guidée (paced breathing) ----------------
// 4 temps librement réglables (inspiration / rétention poumons pleins /
// expiration / rétention poumons vides), comme les vraies apps de paced
// breathing — pas juste un ratio inspiration/expiration fixe. Préréglages

function wireBreathingOverlayEvents() {
  const closeBtn = document.getElementById("breathing-overlay-close-btn");
  if (closeBtn) closeBtn.addEventListener("click", closeBreathingOverlay);

  const durationInput = document.getElementById("breathing-duration-input");
  if (durationInput) {
    durationInput.addEventListener("blur", function() {
      stopBreathing();
      const minutes = Number(durationInput.value) || 1;
      breathingConfig.durationSec = Math.max(1, minutes) * 60;
      drawBreathingOverlay();
    });
  }
  const breathingPresetSelect = document.getElementById("breathing-preset-select");
  if (breathingPresetSelect) breathingPresetSelect.addEventListener("change", function() {
    stopBreathing();
    const p = BREATHING_PRESETS[Number(breathingPresetSelect.value)];
    breathingConfig.inhale = p.inhale; breathingConfig.holdFull = p.holdFull;
    breathingConfig.exhale = p.exhale; breathingConfig.holdEmpty = p.holdEmpty;
    if (p.durationSec) breathingConfig.durationSec = p.durationSec;
    drawBreathingOverlay();
  });
  document.querySelectorAll('.breathing-time-input').forEach(function(input) {
    input.addEventListener("blur", function() {
      stopBreathing();
      breathingConfig[input.dataset.field] = input.value ? Number(input.value) : 0;
      drawBreathingOverlay();
    });
  });
  document.querySelectorAll('#breathing-sound-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { breathingConfig.soundOn = btn.dataset.sound === "1"; drawBreathingOverlay(); });
  });
  const breathingSoundtypeSelect = document.getElementById("breathing-soundtype-select");
  if (breathingSoundtypeSelect) breathingSoundtypeSelect.addEventListener("change", function() {
    breathingConfig.soundType = breathingSoundtypeSelect.value;
    drawBreathingOverlay();
  });
  const breathingStartBtn = document.getElementById("breathing-start-btn");
  if (breathingStartBtn) breathingStartBtn.addEventListener("click", startBreathing);
  const breathingStopBtn = document.getElementById("breathing-stop-btn");
  if (breathingStopBtn) breathingStopBtn.addEventListener("click", stopBreathing);
  const breathingFocusEnterBtn = document.getElementById("breathing-focus-enter");
  if (breathingFocusEnterBtn) breathingFocusEnterBtn.addEventListener("click", function() { breathingFocusMode = true; drawBreathingOverlay(); });
  const breathingFocusExitBtn = document.getElementById("breathing-focus-exit");
  if (breathingFocusExitBtn) breathingFocusExitBtn.addEventListener("click", function() { breathingFocusMode = false; drawBreathingOverlay(); });
}

function hoursToLabel(hDec) {
  let h = Math.floor(((hDec % 24) + 24) % 24);
  let m = Math.round((hDec - Math.floor(hDec)) * 60);
  if (m === 60) { m = 0; h = (h + 1) % 24; }
  return h + "h" + String(m).padStart(2, "0");
}
// Moyenne d'heures d'horloge (coucher à 23h30 un soir, 00h15 le lendemain) —
// une moyenne arithmétique naïve casse au passage de minuit (23.5 et 0.25
// donnent 11.875, alors que la vraie moyenne est ~23h52). On passe donc par
// des vecteurs sur le cercle des 24h (statistique circulaire standard pour
// des données d'horloge/rythme circadien).
function circularMeanHour(hours) {
  let sx = 0, sy = 0;
  hours.forEach(function(h) {
    const rad = (h / 24) * 2 * Math.PI;
    sx += Math.cos(rad); sy += Math.sin(rad);
  });
  let rad = Math.atan2(sy / hours.length, sx / hours.length);
  if (rad < 0) rad += 2 * Math.PI;
  return (rad / (2 * Math.PI)) * 24;
}
// Longueur du vecteur moyen (R, 0 à 1) : 1 = tous les horaires identiques
// (très régulier), 0 = horaires dispersés sur toute la journée.
function circularRegularity(hours) {
  let sx = 0, sy = 0;
  hours.forEach(function(h) {
    const rad = (h / 24) * 2 * Math.PI;
    sx += Math.cos(rad); sy += Math.sin(rad);
  });
  const n = hours.length;
  return Math.sqrt(sx * sx + sy * sy) / n;
}
function buildCoachData(wearable, sessions, migraines, gripRows, kzWorkouts, lifeloadRows, naps, sleepFeelingRows, breathingRows) {
  function avgField(arr, field) {
    const v = arr.map(function(x) { return x[field]; }).filter(function(x) { return x != null; });
    return v.length ? avgOf(v) : null;
  }
  const last14 = wearable.filter(function(w) { return w.day >= daysAgo(14); });
  const last7 = wearable.filter(function(w) { return w.day >= daysAgo(7); });
  // Baseline de comparaison : les 3-4 semaines qui précèdent la fenêtre
  // "récente", pas tout l'historique — pour capter une vraie tendance
  // actuelle plutôt qu'une moyenne diluée sur des mois.
  const baseline = wearable.filter(function(w) { return w.day < daysAgo(7) && w.day >= daysAgo(30); });

  const loadByDay = {};
  sessions.forEach(function(s) { if (s.correctedLoad) loadByDay[s.date] = (loadByDay[s.date] || 0) + s.correctedLoad; });
  function avgDailyLoadSince(daysBack) {
    const cutoff = daysAgo(daysBack);
    let sum = 0;
    Object.keys(loadByDay).forEach(function(d) { if (d >= cutoff) sum += loadByDay[d]; });
    return sum / daysBack;
  }

  const migDays = migraines.map(function(m) { return m.day; });
  const migWearable = wearable.filter(function(w) { return migDays.indexOf(w.day) !== -1; });
  const otherWearable = wearable.filter(function(w) { return migDays.indexOf(w.day) === -1; });

  const gripSorted = gripRows.slice().sort(function(a, b) { return a.day < b.day ? -1 : 1; });
  const gripRecent = gripSorted.slice(-3).map(function(g) { return g.value_kg; });
  const gripBase = gripSorted.slice(0, -3).map(function(g) { return g.value_kg; });

  return {
    sleepAvg14: avgField(last14, "sleep_total_min"),
    wakeHours14: last14.map(function(w) { return w.wake_hour; }).filter(function(x) { return x != null; }),
    // Heure de coucher réelle, dérivée de l'immobilité minute par minute avant
    // le réveil (sync_to_supabase.py, derive_bedtimes) — remplace l'ancienne
    // valeur fixe du bracelet (22:00 chaque nuit) qui n'était pas une mesure.
    // Peu de nuits au début (calculée seulement à partir de maintenant), la
    // fenêtre s'enrichit jour après jour.
    bedtimeHours14: last14.map(function(w) { return w.bedtime_hour; }).filter(function(x) { return x != null; }),
    hrvRecent: avgField(last7, "hrv_avg"), hrvBaseline: avgField(baseline, "hrv_avg"),
    hrRecent: avgField(last7, "hr_resting"), hrBaseline: avgField(baseline, "hr_resting"),
    stressRecent: avgField(last7, "stress_avg"), stressBaseline: avgField(baseline, "stress_avg"),
    load7: sessions.length ? avgDailyLoadSince(7) : null,
    load28: sessions.length ? avgDailyLoadSince(28) : null,
    gripRecentAvg: gripRecent.length ? avgOf(gripRecent) : null,
    gripBaseAvg: gripBase.length >= 2 ? avgOf(gripBase) : null,
    migraineDaysCount: migDays.length,
    sleepOnMigraineDays: avgField(migWearable, "sleep_total_min"),
    sleepOnOtherDays: avgField(otherWearable, "sleep_total_min"),
    // Données brutes conservées telles quelles pour les questions Statistiques
    // qui ont besoin de plus que des moyennes précalculées (déclencheurs,
    // équilibre tirage/poussée, charge par discipline, zones Karvonen...).
    wearableRaw: wearable,
    sessionsRaw: sessions,
    migrainesRaw: migraines,
    kzWorkouts: kzWorkouts || [],
    lifeloadRaw: lifeloadRows || [],
    napsRaw: naps || [],
    gripRaw: gripRows || [],
    sleepFeelingRaw: sleepFeelingRows || [],
    breathingRaw: breathingRows || [],
  };
}
// Série journalière (30 jours) pour une réponse à un seul indicateur — une
// moyenne seule ne montre pas si elle vient d'un plateau stable ou d'une
// remontée après un creux, la courbe si.
function coachDailyLineChart(rows, dayField, valField, days) {
  const list = []; for (let i = (days - 1); i >= 0; i--) list.push(daysAgo(i));
  const byDay = {};
  rows.forEach(function(r) { if (r[valField] != null) byDay[r[dayField]] = r[valField]; });
  return list.map(function(day) { return { label: formatDateLabel(day).slice(0, 2), val: byDay[day] != null ? byDay[day] : 0 }; });
}
function coachAnswerSleepAvg(d) {
  if (d.sleepAvg14 == null) return "Pas encore assez de données de sommeil récentes pour calculer une moyenne fiable.";
  const h = Math.floor(d.sleepAvg14 / 60), m = Math.round(d.sleepAvg14 % 60);
  const qual = d.sleepAvg14 < 360 ? "nettement sous les 7-9h recommandées"
    : d.sleepAvg14 < 420 ? "un peu court par rapport aux 7-9h recommandées"
    : d.sleepAvg14 <= 540 ? "dans la fourchette recommandée de 7-9h"
    : "plus long que la fourchette habituelle";
  const chartHtml = lineChartHtml(coachDailyLineChart(d.wearableRaw, "day", "sleep_total_min", 30), { unit: " min", decimals: 0, showAvg: false });
  const text = "Sur les 14 derniers jours, tu as dormi en moyenne " + h + "h" + String(m).padStart(2, "0") + " par nuit — " + qual + ".";
  return { text: text, chartHtml: chartHtml };
}
function coachAnswerSleepRegularity(d) {
  if (d.wakeHours14.length < 5) {
    return "Pas encore assez de nuits avec heure de réveil enregistrée pour évaluer la régularité.";

function coachAnswerFormeVsNextDayLoad(d) {
  const loadByDay = {};

  const days = d.wearableRaw.map(function(w) { return w.day; });
  const rows = days.map(function(day) {
    const forme = computeFormeProxyForDay(day, d.wearableRaw, d.sessionsRaw, d.lifeloadRaw);
    const nextDay = dateOffset(day, -1);
    return { forme: forme, nextLoad: loadByDay[nextDay] || 0 };
  }).filter(function(r) { return r.forme != null; });

  const sorted = rows.slice().sort(function(a, b) { return b.forme - a.forme; });
  const half = Math.max(3, Math.floor(sorted.length / 2));
  const high = sorted.slice(0, half), low = sorted.slice(-half);
  const avgFormeHigh = Math.round(avgOf(high.map(function(r) { return r.forme; })));
  const avgFormeLow = Math.round(avgOf(low.map(function(r) { return r.forme; })));
  const avgLoadHigh = Math.round(avgOf(high.map(function(r) { return r.nextLoad; })));
  const avgLoadLow = Math.round(avgOf(low.map(function(r) { return r.nextLoad; })));

    { label: "Forme ↑ (" + avgFormeHigh + ")", val: avgLoadHigh }, { label: "Forme ↓ (" + avgFormeLow + ")", val: avgLoadLow },
  ], { unit: "", decimals: 0, showAvg: false });
  const text = avgLoadLow < avgLoadHigh * 0.7
    ? "Le lendemain d'un jour de moins bonne Forme (" + avgFormeLow + "/100), ta charge d'entraînement est plus faible (" + avgLoadLow + " contre " + avgLoadHigh + " après un jour de bonne Forme, " + avgFormeHigh + "/100) — tu sembles bien lever le pied quand ta Forme est basse."
    : "Ta charge d'entraînement du lendemain ne varie pas nettement selon ta Forme de la veille (" + avgLoadHigh + " vs " + avgLoadLow + ") — tu ne sembles pas ajuster ton entraînement à ta Forme.";

}
function coachAnswerFormeVsSessionRpe(d) {
  const rows = d.sessionsRaw.filter(function(s) { return s.intensity > 0; }).map(function(s) {
    return { forme: computeFormeProxyForDay(s.date, d.wearableRaw, d.sessionsRaw, d.lifeloadRaw), rpe: s.intensity };

  const sorted = rows.slice().sort(function(a, b) { return b.forme - a.forme; });

  const avgFormeHigh = Math.round(avgOf(high.map(function(r) { return r.forme; })));

    overlay.innerHTML = '<div class="wrap"><div class="muted" style="padding-top:40px">Chargement…</div></div>';

      const results = await Promise.all([
        listWearable(200),

        sb("breathing_sessions?select=day,duration_min,breaths&order=day.desc&limit=120").catch(function() { return []; }),

  document.querySelectorAll('.rpe-ladder').forEach(function(ladder) {

  html += '<div class="pill-row compact" style="margin:16px 0 24px" id="coach-mode-row">';
  [["aujourdhui","Aujourd'hui"],["stats","Statistiques"]].forEach(function(m) {
    html += '<button class="pill' + (coachMode === m[0] ? " active" : "") + '" data-mode="' + m[0] + '">' + m[1] + "</button>";
  });
  html += "</div>";

  if (coachMode === "aujourdhui") {
    if (coachFormOpen) {
      if (coachFormOpen === "seance-choice") html += coachSeanceChoiceHtml();
      else if (coachFormOpen === "seance") html += coachSeanceFormHtml();
      else if (coachFormOpen === "prehension") html += coachPrehensionFormHtml();
      else if (coachFormOpen === "lifeload") html += coachLifeloadFormHtml();
      else if (coachFormOpen === "sommeil") html += coachSommeilFormHtml();
      else if (coachFormOpen === "sieste") html += coachSiesteFormHtml();
      else if (coachFormOpen === "migraine") html += coachMigraineFormHtml();
    } else {
      html += '<div class="muted" style="margin-bottom:20px">Que veux-tu loguer aujourd\'hui ?</div>';
      // Le badge rouge sur la bulle Coach (coachPendingCount) comptait des
      // choses à faire sans jamais les nommer une fois le chat ouvert —
      // signalé par l'utilisateur ("on ne comprend pas, je ne sais pas quoi
      // remplir"). Cette bannière + le point rouge par bouton ci-dessous
      // reprennent exactement les 3 ingrédients du même calcul
      // (refreshCoachPendingCount) pour qu'ils soient enfin visibles ici.
      const pendingItems = [];
      if (!coachTodayStatus.lifeload) pendingItems.push("Ressenti (LifeLoad)");
      if (coachTodayStatus.gripRequired && !coachTodayStatus.grip) pendingItems.push("Préhension");
      coachTodayStatus.classesPending.forEach(function(c) { pendingItems.push("Séance : " + c.discipline + " (" + c.heure_debut.slice(0,5) + ")"); });
      if (pendingItems.length) {
        html += '<div style="background:rgba(255,51,102,.08);border:1px solid var(--red);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.5">';
        html += '<b style="color:var(--red)">À faire aujourd\'hui :</b> ' + pendingItems.map(esc).join(" · ");
        html += "</div>";
      }
      html += '<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:28px" id="coach-log-row">';
      COACH_LOG_BUTTONS.forEach(function(b) {
        // Coche discrète sur les logs à statut "fait aujourd'hui" (séance,
        // préhension, ressenti, qualité de nuit) — répond au fait qu'on
        // pouvait reloguer le ressenti sans jamais voir qu'il l'était déjà.
        // Sieste et migraine n'ont pas cette coche : ce sont des logs à
        // occurrences multiples dans la journée, pas un état "fait/pas fait".
        let done = false, pending = false, label = b.label;
        if (b.id === "lifeload") { done = coachTodayStatus.lifeload; pending = !done; }
        else if (b.id === "prehension") {
          done = coachTodayStatus.grip;
          pending = coachTodayStatus.gripRequired && !done;
          if (!coachTodayStatus.gripRequired && !done) label += " (optionnel aujourd'hui)";
        }
        else if (b.id === "seance") { done = coachTodayStatus.classesPending.length === 0 && coachTodayStatus.sessionsLogged > 0; pending = coachTodayStatus.classesPending.length > 0; }
        else if (b.id === "sommeil") done = !!coachTodayStatus.sleepFeelingQuality;
        html += '<button class="coach-question-btn" data-log="' + b.id + '" style="width:100%;text-align:left;background:var(--surfaceRaised);border:1px solid ' + (pending ? "var(--red)" : "var(--line)") + ';border-radius:10px;padding:16px 18px;color:var(--chalk);font-size:14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center">' + label + (done ? ' <span style="color:var(--green);font-size:16px">✓</span>' : pending ? ' <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 6px 2px var(--red)"></span>' : "") + "</button>";
      });
      html += "</div>";
      if (coachMessages.length) {
        html += '<div id="coach-messages" style="display:flex;flex-direction:column;gap:14px">';
        coachMessages.slice(-6).forEach(function(m) {
          if (m.role === "assistant") html += '<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5">' + esc(m.text) + "</div>";
        });
        html += "</div>";
      }
    }
  } else {
    html += '<div class="muted" style="margin-bottom:24px">Pose une question sur tes données récentes</div>';

    html += '<div id="coach-messages" style="display:flex;flex-direction:column;gap:14px;margin-bottom:28px">';
    if (!coachStatsCurrent) {
      html += '<div class="muted" style="text-align:center;padding:24px 0">Choisis une question ci-dessous pour commencer.</div>';
    } else {
      html += '<div style="align-self:flex-end;max-width:80%;background:var(--gradient);color:var(--bg);border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:13px;font-weight:700">' + esc(coachStatsCurrent.label) + "</div>";
      html += '<div style="align-self:flex-start;max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:13px;line-height:1.5">' + esc(coachStatsCurrent.text) + (coachStatsCurrent.chartHtml ? '<div style="margin-top:12px">' + coachStatsCurrent.chartHtml + "</div>" : "") + "</div>";
    }
    html += "</div>";

    html += '<div class="section-label" style="margin-bottom:10px">' + sectionIcon("thought") + 'Questions suggérées</div>';
    html += '<div class="pill-row compact" style="flex-wrap:wrap;gap:6px;margin-bottom:16px" id="coach-stats-filter-row">';
    COACH_STATS_FILTERS.forEach(function(f) {
      html += '<button class="pill' + (coachStatsFilter === f.id ? " active" : "") + '" data-filter="' + f.id + '" style="flex:none;padding:8px 12px">' + f.label + "</button>";
    });
    html += "</div>";
    // Des phrases complètes, pas des libellés courts — la classe .pill (nowrap
    // + ellipsis + sans marge horizontale) est faite pour de petits labels
    // fixes, pas pour ça : elle tronquait le texte ("Ma durée moyenne de
    // som..."). Liste empilée pleine largeur, texte aligné à gauche et qui
    // peut passer à la ligne, avec un vrai espace autour.
    const filteredQuestions = COACH_QUESTIONS.filter(function(q) { return coachStatsFilter === "all" || q.domain === coachStatsFilter; });
    html += '<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:28px" id="coach-question-row">';
    filteredQuestions.forEach(function(q) {
      const asked = !!coachStatsAskedIds[q.id];
      html += '<button class="coach-question-btn" data-question="' + q.id + '" style="width:100%;text-align:left;background:var(--surfaceRaised);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--chalk);font-size:14px;font-weight:700;line-height:1.4;white-space:normal;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px"><span>' + q.label + "</span>" + (asked ? '<span style="color:var(--green);font-size:16px;flex:none">✓</span>' : "") + "</button>";
    });
    if (!filteredQuestions.length) {
      html += '<div class="muted" style="text-align:center;padding:16px 0">Aucune question dans cette catégorie.</div>';
    }
    html += "</div>";

    html += '<div class="card steel"><div class="muted" style="font-size:11px;line-height:1.6">Réponses calculées directement à partir de tes propres données (pas de génération par IA) — mêmes seuils et méthodes que le reste de l\'appli.</div></div>';
  }
  html += "</div>";

  overlay.innerHTML = html;
  document.getElementById("coach-close-btn").addEventListener("click", closeCoach);
  document.querySelectorAll('#coach-mode-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { coachMode = btn.dataset.mode; coachFormOpen = null; drawCoach(); });
  });

  if (coachMode === "aujourdhui") {
    if (coachFormOpen === "seance-choice") wireCoachSeanceChoiceEvents();
    else if (coachFormOpen === "seance") wireCoachSeanceFormEvents();
    else if (coachFormOpen === "prehension") wireCoachPrehensionFormEvents();
    else if (coachFormOpen === "lifeload") wireCoachLifeloadFormEvents();
    else if (coachFormOpen === "sommeil") wireCoachSommeilFormEvents();
    else if (coachFormOpen === "sieste") wireCoachSiesteFormEvents();
    else if (coachFormOpen === "migraine") wireCoachMigraineFormEvents();
    else {
      document.querySelectorAll('#coach-log-row .coach-question-btn').forEach(function(btn) {
        btn.addEventListener("click", function() {
          if (btn.dataset.log === "seance") {
            // S'il reste des cours du planning pas encore logués, on propose
            // d'abord de pré-remplir depuis l'un d'eux plutôt que de partir
            // d'un formulaire vide (la montre a souvent déjà détecté la séance).
            if (coachTodayStatus.classesPending.length > 0) { coachFormOpen = "seance-choice"; }
            else { editingSession = emptySession(); disciplineOtherMode = false; coachFormOpen = "seance"; }
          } else {
            coachFormOpen = btn.dataset.log;
          }
          drawCoach();
        });
      });
    }
    return;
  }

  document.querySelectorAll('#coach-stats-filter-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { coachStatsFilter = btn.dataset.filter; drawCoach(); });
  });
  document.querySelectorAll("#coach-question-row .coach-question-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const q = COACH_QUESTIONS.find(function(x) { return x.id === btn.dataset.question; });
      if (!q) return;
      // fn() renvoie soit une simple phrase (string), soit { text, chartHtml }
      // pour les réponses qui valent la peine d'être visualisées (répartition
      // par catégorie, tendance sur plusieurs jours...) plutôt qu'une liste
      // de chiffres à lire.
      const result = q.fn(coachData);
      const answer = typeof result === "string" ? { text: result, chartHtml: null } : result;
      coachStatsCurrent = { qid: q.id, label: q.label, text: answer.text, chartHtml: answer.chartHtml || null };
      coachStatsAskedIds[q.id] = true;
      drawCoach();
      const msgArea = document.getElementById("coach-messages");
      if (msgArea) msgArea.scrollIntoView({ behavior: "smooth", block: "end" });
    });
  });
}

// ---------------- Navigation ----------------
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab[data-tab]").forEach(function(t) { t.classList.toggle("active", t.dataset.tab === tab); });
  if (tab === "entrainement") loadEntrainement();
  else if (tab === "recuperation") loadRecuperation();
  else renderForme();
  refreshCoachPendingCount();
}
async function loadCoefficients() {
  try {
    const rows = await sb("training_coefficients?select=*");
    (rows || []).forEach(function(r) {
      if (r.category === "neural") {
        const themeId = r.key.replace("neural_", "");
        const t = THEMES.find(function(x) { return x.id === themeId; });
        if (t) t.neural = Number(r.value);
      } else if (r.category === "tendino") {
        const themeId = r.key.replace("tendino_", "");
        const t = THEMES.find(function(x) { return x.id === themeId; });
        if (t) t.tendino = Number(r.value);
      } else if (r.category === "contraction") {
        const id = r.key.replace("contraction_", "");
        if (CONTRACTION_FACTORS[id] != null) CONTRACTION_FACTORS[id] = Number(r.value);
      } else if (r.category === "goal") {
        const id = r.key.replace("goal_", "");
        if (GOAL_FACTORS[id] != null) GOAL_FACTORS[id] = Number(r.value);
      } else if (r.category === "niveau") {
        const id = r.key.replace("niveau_", "");
        if (NIVEAU_FACTORS[id] != null) NIVEAU_FACTORS[id] = Number(r.value);
      }
    });
  } catch (e) {
    // Repli silencieux sur les valeurs par défaut codées en dur si le réseau
    // ou la table ne répond pas — l'appli doit rester utilisable.
  }
}

document.querySelectorAll(".tab[data-tab]").forEach(function(t) {
  t.addEventListener("click", function() { setTab(t.dataset.tab); });
});
document.getElementById("refresh-btn").addEventListener("click", function() {
  const btn = this;
  btn.style.transform = "rotate(360deg)";
  btn.style.transition = "transform 0.5s";
  setTab(currentTab);
  setTimeout(function() { btn.style.transform = ""; }, 500);
});
document.getElementById("logout-btn").addEventListener("click", function() {
  if (confirm("Se déconnecter ?")) logout();
});
document.getElementById("coach-fab").addEventListener("click", renderCoach);
document.getElementById("brand-breathing-btn").addEventListener("click", openBreathingOverlay);

// Tooltip au doigt/à la souris sur les courbes mensuelles (lineChartHtml) —
// délégation d'événements sur tout le document plutôt qu'un rebranchement
// par graphique à chaque rendu : les onglets Tendance re-génèrent leur HTML
// en entier à chaque passage (innerHTML), donc des écouteurs posés sur les
// graphiques eux-mêmes seraient perdus au rendu suivant.
let lineChartPointerActive = false;
function lineChartPointFromEvent(wrapper, clientX) {
  const rect = wrapper.getBoundingClientRect();
  if (!rect.width) return null;
  let points;
  try { points = JSON.parse(decodeURIComponent(wrapper.dataset.points || "[]")); } catch (e) { return null; }
  if (!points.length) return null;
  const xPct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) * 100;
  let nearest = points[0], nearestDist = Infinity;
  points.forEach(function(p) {
    const dist = Math.abs(p.x - xPct);
    if (dist < nearestDist) { nearestDist = dist; nearest = p; }
  });
  return nearest;
}
function showLineChartTooltip(wrapper, point) {
  if (!point) return;
  const tooltip = wrapper.querySelector(".lc-tooltip");
  const cursor = wrapper.querySelector(".lc-cursor");
  if (tooltip) {
    tooltip.style.display = "block";
    tooltip.style.left = point.x + "%";
    tooltip.style.transform = point.x < 12 ? "translate(0,-125%)" : point.x > 88 ? "translate(-100%,-125%)" : "translate(-50%,-125%)";
    tooltip.textContent = (point.label ? point.label + " : " : "") + point.display;
  }
  if (cursor) { cursor.style.display = "block"; cursor.style.left = point.x + "%"; }
}
function hideAllLineChartTooltips() {
  document.querySelectorAll(".lc-tooltip").forEach(function(t) { t.style.display = "none"; });
  document.querySelectorAll(".lc-cursor").forEach(function(c) { c.style.display = "none"; });
}
document.addEventListener("pointerdown", function(e) {
  const wrapper = e.target.closest && e.target.closest(".line-chart-touch");
  if (!wrapper) return;
  lineChartPointerActive = true;
  showLineChartTooltip(wrapper, lineChartPointFromEvent(wrapper, e.clientX));
});
document.addEventListener("pointermove", function(e) {
  if (!lineChartPointerActive) return;
  const wrapper = e.target.closest && e.target.closest(".line-chart-touch");
  if (!wrapper) return;
  showLineChartTooltip(wrapper, lineChartPointFromEvent(wrapper, e.clientX));
});
document.addEventListener("pointerup", function() { lineChartPointerActive = false; hideAllLineChartTooltips(); });
document.addEventListener("pointercancel", function() { lineChartPointerActive = false; hideAllLineChartTooltips(); });
// Ne démarre le chargement des données qu'une fois authentifié — appelé par
// le script du gate (juste après connexion, ou immédiatement si la session
// stockée est encore valide). Voir ensureAccessToken() plus haut.
window.mpbOnAuthed = function() {
  const app = document.getElementById("app");
  if (app) app.innerHTML = '<div class="muted">Chargement…</div>';
  // fetchWithTimeout borne déjà chaque requête réseau, mais on ajoute ici une
  // dernière garde-fou : même dans le pire des cas, on affiche l'onglet Forme
  // après 15s plutôt que de laisser l'écran vide indéfiniment (loadCoefficients
  // et loadSchedule ont chacun leurs propres valeurs de repli si le réseau a
  // vraiment échoué).
  const ready = Promise.all([loadCoefficients(), loadSchedule()]);
  const timeout = new Promise(function(resolve) { setTimeout(resolve, 15000); });
  Promise.race([ready, timeout]).then(function() { setTab("forme"); });
};
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() { navigator.serviceWorker.register("sw.js").catch(function() {}); });
}
