  // habituelle (ACWR bas p/r à TA propre référence, pas un seuil générique).
  if (atlWake != null && ctl) {
    const wakeRatio = atlWake / ctl;
    if (wakeRatio < 0.8) {
      freshnessBonus = Math.min(10, Math.round((0.8 - wakeRatio) * 25));
      score += freshnessBonus;
    }
  }
  // Complément objectif : effet d'entraînement réel (FC seconde par seconde,
  // fichiers .fit rattachés au planning), en plus du RPE déclaratif —
  // automatique dès qu'une séance du jour est détectée par la montre.
  let todayFitDepletion = 0;
  if (todayFitEffort > 0) {
    signals++;
    todayFitDepletion = Math.min(15, Math.round(todayFitEffort * 3));
    score -= todayFitDepletion;
  }
  let todayTripDepletion = 0;
  if (todayTripEffort > 0) {
    signals++;
    todayTripDepletion = Math.min(8, Math.round(todayTripEffort * 3));
    score -= todayTripDepletion;
  }
  if (sleepMin != null) {
    signals++;
    if (sleepMin < 300) score -= 25; else if (sleepMin < 360) score -= 15; else if (sleepMin < 420) score -= 5; else if (sleepMin > 600) score -= 5;
    // Qualité des stades, pas juste la durée — mêmes seuils que l'onglet
    // Sommeil (AASM/CDC) : profond <13% ou paradoxal <15% pénalisent, même
    // avec une durée totale correcte.
    if (todayWearable && todayWearable.sleep_deep_min != null && sleepMin > 0) {
      const deepPct = (todayWearable.sleep_deep_min / sleepMin) * 100;
      if (deepPct < 10) { score -= 8; lines.push({ tone: "neutral", text: "Sommeil profond faible (" + Math.round(deepPct) + "%) malgré une durée correcte — pèse un peu sur le score." }); }
      if (todayWearable.sleep_rem_min != null) {
        const remPct = (todayWearable.sleep_rem_min / sleepMin) * 100;
        if (remPct < 15) { score -= 8; lines.push({ tone: "neutral", text: "Sommeil paradoxal faible (" + Math.round(remPct) + "%) — à surveiller si ça se répète." }); }
      }
    }
  }
  if (respDiff != null) { signals++; if (respDiff >= 3) score -= 20; else if (respDiff >= 2) score -= 10; }
  if (todayMigraine != null) { signals++; score -= (10 + todayMigraine * 4); }
  // Sieste : bénéfice réel mais modéré sur la récupération (littérature sommeil),
  // pondéré par la qualité déclarée et plafonné pour ne pas compenser
  // artificiellement un vrai déficit de sommeil.
  if (todayNapMin > 0) {
    const napBonus = Math.min(8, Math.round(todayNapEffective / 5));
    score += napBonus;
    const qualNote = napBonus <= 1 ? " (qualité perçue faible, bénéfice limité)" : "";
    lines.push({ tone: napBonus >= 4 ? "good" : "neutral", text: "Sieste de " + todayNapMin + " min aujourd'hui" + qualNote + "." });
  }
  if (todayMigraine != null) lines.unshift({ tone: "warn", text: "Migraine enregistrée aujourd'hui (intensité " + todayMigraine + "/10) — pèse sur le score et la récupération recommandée." });

  // Effet d'entraînement officiel (aérobie/anaérobie, données Zepp/Firstbeat) —
  // même logique de ratio 3j récents vs référence que la charge, mais sur une
  // mesure validée par la montre plutôt qu'estimée par nous.
  const teVals = workouts.filter(function(w){ return w.training_effect_anaerobic != null; })
    .sort(function(a,b){ return a.day < b.day ? -1 : 1; });
  let teRatio = null;
  if (teVals.length >= 4) {
    const recent3 = teVals.slice(-3).map(function(w){ return w.training_effect_anaerobic; });
    const base10 = teVals.slice(-10).map(function(w){ return w.training_effect_anaerobic; });
    const recentAvg = avgOf(recent3), baseAvg = avgOf(base10);
    if (baseAvg > 0) {
      teRatio = recentAvg / baseAvg;
      signals++;
      if (teRatio > 1.6) { score -= 15; lines.push({ tone: "warn", text: "Effet d'entraînement anaérobie (données montre) nettement au-dessus de ta référence récente — sollicitation élevée à ne pas négliger dans ta récup." }); }
      else if (teRatio < 0.6 && recentAvg < 1) { lines.push({ tone: "neutral", text: "Effet d'entraînement récent plutôt faible (données montre) — cohérent avec une phase plus légère." }); }
    }
  }

  // Détection de motifs proches d'une migraine passée — comparaison directe à
  // ton propre historique, pas un diagnostic. Nécessite au moins 5 migraines
  // enregistrées pour éviter le surajustement sur un trop petit échantillon.
  let migraineAlert = null;
  if (todayMigraine == null && history_migraines_count >= 5 && migraine_signature) {
    let matches = 0, checked = 0;
    if (hrDiff != null && migraine_signature.hrDiff != null) { checked++; if (Math.sign(hrDiff) === Math.sign(migraine_signature.hrDiff) && Math.abs(hrDiff) >= Math.abs(migraine_signature.hrDiff) * 0.5) matches++; }
    if (hrvPct != null && migraine_signature.hrvPct != null) { checked++; if (Math.sign(hrvPct) === Math.sign(migraine_signature.hrvPct) && Math.abs(hrvPct) >= Math.abs(migraine_signature.hrvPct) * 0.5) matches++; }
    if (stressDiff != null && migraine_signature.stressDiff != null) { checked++; if (Math.sign(stressDiff) === Math.sign(migraine_signature.stressDiff) && Math.abs(stressDiff) >= Math.abs(migraine_signature.stressDiff) * 0.5) matches++; }
    if (sleepMin != null && migraine_signature.sleepMin != null) { checked++; if (sleepMin <= migraine_signature.sleepMin + 30) matches++; }
    if (checked >= 3 && matches / checked >= 0.75) {
      migraineAlert = "Tes signaux d'aujourd'hui ressemblent à ceux de tes migraines passées (" + history_migraines_count + " enregistrées) — pas une certitude, mais peut valoir le coup de rester attentif et de t'hydrater/te reposer si possible.";
    }
  }
  const LIFELOAD_IMPACT = { bien: 8, stresse: -12, fatigue: -18, malade: -40, courbature: -10, neutre: 0 };
  if (lifeload != null) { signals++; score += (LIFELOAD_IMPACT[lifeload] || 0); }
  score = Math.max(0, Math.min(100, score));
  let tier = "Données insuffisantes", tierColor = "muted", needRest = "–";
  if (signals > 0) {
    if (score >= 70) { tier = "Bonne"; tierColor = "green"; needRest = "Non — tu peux enchaîner"; }
    else if (score >= 40) { tier = "Suffisante"; tierColor = "amber"; needRest = "Optionnel — reste attentif"; }
    else { tier = "Insuffisante"; tierColor = "red"; needRest = "Oui — repos recommandé"; }
  }

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><h1>Dashboard</h1>';
  if (streak > 0) html += '<span style="color:var(--amber);font-size:13px;font-weight:800">🔥 ' + streak + "j</span>";
  html += "</div>";
  html += '<div class="muted" style="margin-bottom:18px">' + formatDateLabel(today) + "</div>";

  // Journal (jours récents à compléter)
  const last14 = [];
  for (let i = 13; i >= 0; i--) last14.push(daysAgo(i));
  const journal = last14.map(function(d) {
    const w = wearable.find(function(x){ return x.day === d; });
    const s = sessions.find(function(x){ return x.date === d; });
    const hasSession = sessions.some(function(x){ return x.date === d && (x.discipline || x.intensity > 0 || x.duration); });
    const signal = w && ((w.intensity_avg && w.intensity_avg > 25) || (w.hr_max_activity && w.hr_max_activity > 140));
    return { date: d, wearable: w, signal: signal && !hasSession && dismissedDates.indexOf(d) === -1 };
  });
  const toComplete = journal.filter(function(j){ return j.signal; });
  if (toComplete.length) {
    html += '<div class="card amber"><div class="section-label">Séances possibles non renseignées</div>';
    html += '<div class="muted" style="margin-bottom:10px">Activité détectée par la montre sans QCM correspondant.</div>';
    toComplete.forEach(function(g) {
      html += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
      html += '<button class="history-item goto-date" data-date="' + g.date + '" style="flex:1;display:flex;justify-content:space-between;align-items:center;background:var(--surfaceRaised);margin-bottom:0">';
      html += '<span style="font-weight:700;font-size:12px">' + formatDateLabel(g.date) + "</span>";
      html += '<span style="color:var(--amber);font-size:11px;font-weight:800">Compléter →</span></button>';
      html += '<button class="dismiss-flag" data-date="' + g.date + '" title="Ce n\'était pas une séance" style="background:var(--surfaceRaised);border:none;border-radius:8px;color:var(--muted);font-size:15px;padding:10px 12px;cursor:pointer">✕</button>';
      html += "</div>";
    });
    html += "</div>";
  }

  html += '<div class="pill-row" style="margin-bottom:16px" id="period-row">';
  [["jour","Jour"],["semaine","Semaine"],["mois","Mois"]].forEach(function(p) {
    html += '<button class="pill' + (dashPeriod === p[0] ? " active" : "") + '" data-period="' + p[0] + '" style="font-size:11.5px;padding:9px 2px">' + p[1] + "</button>";
  });
  html += "</div>";

  if (dashPeriod === "jour") {
    if (migraineAlert) {
      html += '<div class="error-banner" style="background:rgba(242,113,28,0.15);border-color:var(--rust)"><b>⚠ Signaux similaires à une migraine passée :</b> ' + esc(migraineAlert) + "</div>";
    }

    if (!lifeload) {
      html += '<div class="card"><div class="section-label">Comment tu te sens aujourd\'hui ?</div>';
      html += '<select id="lifeload-select" style="width:100%;background:var(--surfaceRaised);border:1px solid var(--line);border-radius:7px;color:var(--chalk);font-size:16px;padding:10px 12px">';
      const LIFELOAD_OPTIONS = [
        ["", "— Choisir —"], ["bien", "Bien"], ["neutre", "Neutre"], ["stresse", "Stressé"],
        ["fatigue", "Fatigué"], ["courbature", "Courbaturé"], ["malade", "Malade"],
      ];
      LIFELOAD_OPTIONS.forEach(function(o) {
        html += '<option value="' + o[0] + '"' + (o[0] === "" ? " selected" : "") + '>' + o[1] + "</option>";
      });
      html += "</select></div>";
    }

    // Vigilance — 3 points de contrôle réels dans la journée (VFC mesurée sur
    // ce créneau précis, comparée à ta moyenne sur ce même créneau les jours
    // précédents). Une vraie baisse de VFC en temps réel est associée à la
    // somnolence dans la littérature (études de détection de somnolence au
    // volant, validées contre des mesures oculaires). On calcule ici le
    // dernier créneau atteint pour l'imbriquer dans l'anneau Forme.
    const VIG_WINDOWS = [
      { label: "Matin", hrvKey: "hrv_morning", lo: 6, hi: 9 },
      { label: "Après-midi", hrvKey: "hrv_afternoon", lo: 14, hi: 16 },
      { label: "Soir", hrvKey: "hrv_evening", lo: 17, hi: 19 },
    ];
    let vigPct = null, vigWindowLabel = null;
    VIG_WINDOWS.slice().reverse().forEach(function(w) {
      if (vigPct != null) return;
      const todayHrv = todayWearable ? todayWearable[w.hrvKey] : null;
      if (todayHrv == null) return;
      const baseVals = wearable.filter(function(x){ return x.day !== today && x[w.hrvKey] != null; }).map(function(x){ return x[w.hrvKey]; });
      const baseHrv = baseVals.length >= 3 ? avgOf(baseVals) : null;
      if (baseHrv == null || baseHrv <= 0) return;
      vigPct = Math.round(((todayHrv - baseHrv) / baseHrv) * 100);
      vigWindowLabel = w.label;
    });
    const vigScore = vigPct != null ? Math.max(0, Math.min(100, Math.round(85 + vigPct * 1.5))) : null;
    const vigTierNow = vigPct != null ? (vigPct <= -20 ? "red" : vigPct <= -10 ? "amber" : "green") : null;

    let stressTierNow = null, sLabel = null;
    if (todayWearable && todayWearable.stress_avg != null) {
      const sv = todayWearable.stress_avg;
      stressTierNow = sv >= 50 ? "red" : sv >= 30 ? "amber" : "green";
      sLabel = sv >= 50 ? "Élevé" : sv >= 30 ? "Modéré" : "Faible";
    }

    // Tendance FC repos + VFC sur 14 jours
    const trend14 = []; for (let i = 13; i >= 0; i--) trend14.push(daysAgo(i));
    const hrSeries = trend14.map(function(d) { const w = wearable.find(function(x) { return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: (w && w.hr_resting) || 0 }; });
    const hrvSeries = trend14.map(function(d) { const w = wearable.find(function(x) { return x.day === d; }); return { label: formatDateLabel(d).slice(0,2), val: (w && w.hrv_avg) || 0 }; });
    const hasHrData = hrSeries.some(function(s) { return s.val > 0; });
    let hrTierNow = null, hrvTierNow = null;
    if (hasHrData) {
      const hrVals = hrSeries.map(function(s){return s.val;}).filter(function(v){return v>0;});
      const hrvVals = hrvSeries.map(function(s){return s.val;}).filter(function(v){return v>0;});
      hrTierNow = hrVals.length ? qualifyRHR(avgOf(hrVals)) : null;
      hrvTierNow = hrvVals.length ? qualifyHRV(avgOf(hrvVals)) : null;
    }

    // L'anneau Forme est lui-même déjà une vue d'ensemble en un coup d'œil —
    // il passe avant le récap détaillé, pas après.
    html += '<div class="card"><div class="section-label" style="display:flex;justify-content:space-between;align-items:center"><span>Forme <span style="color:var(--vigilance)">+ Vigilance</span></span><span>' + tierDot(tierColor) + '</span></div>';
    html += '<div style="padding:10px 0">' + circleGaugeHtml(score, 100, {
      sublabel: tier,
      size: 200,
      strokeWidth: 16,
      inner: vigScore != null ? { value: vigScore, max: 100 } : null,
    }) + "</div>";
    html += '<div style="text-align:center;padding-top:10px;border-top:1px solid var(--line);font-size:12px">Besoin de repos : <b style="color:var(--' + tierColor + ')">' + needRest + "</b></div>";
    if (vigScore != null) {
      html += '<div style="text-align:center;padding-top:8px;font-size:12px">Vigilance (' + vigWindowLabel + ') : <b style="color:var(--vigilance)">' + (vigPct >= 0 ? "+" : "") + vigPct + '%</b> vs ta moyenne sur ce créneau</div>';
    } else {
      html += '<div class="muted" style="text-align:center;font-size:11px;padding-top:8px">Vigilance : pas encore de créneau comparable aujourd\'hui</div>';
    }
    html += "</div>";

    // Check-list récapitulative — le reste des signaux, condensé.
    const checklist = [];
    checklist.push({ label: "Forme", tier: tierColor, note: score + "/100 · " + tier });
    if (vigTierNow) checklist.push({ label: "Vigilance", tier: vigTierNow, note: (vigPct >= 0 ? "+" : "") + vigPct + "%" });
    if (stressTierNow) checklist.push({ label: "Stress", tier: stressTierNow, note: Math.round(todayWearable.stress_avg) });
    if (hrTierNow) checklist.push({ label: "FC repos", tier: hrTierNow, note: (todayWearable && todayWearable.hr_resting != null ? todayWearable.hr_resting : Math.round(avgOf(hrSeries.map(function(s){return s.val;}).filter(function(v){return v>0;})))) + " bpm" });
    if (hrvTierNow) checklist.push({ label: "VFC", tier: hrvTierNow, note: (todayWearable && todayWearable.hrv_avg != null ? Math.round(todayWearable.hrv_avg) : Math.round(avgOf(hrvSeries.map(function(s){return s.val;}).filter(function(v){return v>0;})))) + " ms" });
    if (sleepMin != null) checklist.push({ label: "Sommeil", tier: sleepMin < 360 ? "red" : sleepMin < 420 ? "amber" : "green", note: Math.floor(sleepMin/60) + "h" + Math.round(sleepMin%60).toString().padStart(2,'0') });
    if (loadRatio != null) checklist.push({ label: "Fatigue accumulée (réveil)", tier: wakeFatigueDeduction >= 20 ? "red" : wakeFatigueDeduction >= 10 ? "amber" : "green", note: (freshnessBonus > 0 ? "+" + freshnessBonus : "-" + wakeFatigueDeduction) + " pts · ACWR " + loadRatio.toFixed(2) });
    if (todayTotalLoad > 0) checklist.push({ label: "Dépense du jour", tier: todayDepletion >= 25 ? "red" : todayDepletion >= 12 ? "amber" : "green", note: "-" + todayDepletion + " pts (charge " + todayTotalLoad + ")" });
    if (todayFitEffort > 0) checklist.push({ label: "Effort mesuré (.fit)", tier: todayFitDepletion >= 10 ? "red" : todayFitDepletion >= 5 ? "amber" : "green", note: "-" + todayFitDepletion + " pts · " + todayFitSessions.map(function(w){return w.matched_discipline;}).filter(Boolean).join(", ") });
    if (todayTripEffort > 0) checklist.push({ label: "Trajets à vélo", tier: "green", note: "-" + todayTripDepletion + " pts · " + todayTripCount + " trajet(s)" });
    if (todayMigraine != null) checklist.push({ label: "Migraine", tier: "red", note: todayMigraine + "/10" });
    if (lifeload) checklist.push({ label: "Ressenti", tier: lifeload === "bien" ? "green" : lifeload === "malade" ? "red" : ["stresse","fatigue"].indexOf(lifeload) !== -1 ? "amber" : "steel", note: lifeload });

    html += '<div class="card"><div class="section-label">Récap du jour</div>';
    checklist.forEach(function(c) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
      html += '<span style="font-size:13px">' + c.label + (c.note ? ' <span class="muted" style="font-size:11px">· ' + esc(String(c.note)) + '</span>' : '') + "</span>";
      html += '<span>' + tierDot(c.tier) + "</span></div>";
    });
    html += '<div class="muted" style="font-size:10px;margin-top:6px">Indicatif — ne remplace pas ton ressenti ni un avis médical.</div></div>';

    if (stressTierNow) {
      html += '<div class="card"><div class="section-label" style="display:flex;justify-content:space-between;align-items:center"><span>Stress</span><span>' + tierDot(stressTierNow) + '</span></div>';
      html += stressGaugeHtml(todayWearable.stress_avg, sLabel);
      if (stressDiff != null) {
        html += '<div class="muted" style="text-align:center;font-size:11px;margin-top:6px">' + (stressDiff >= 0 ? "+" : "") + stressDiff.toFixed(0) + " vs ta moyenne des 7 derniers jours</div>";
      }
      html += "</div>";
    }

    if (hasHrData) {
      html += '<div class="card"><div class="section-label" style="display:flex;justify-content:space-between;align-items:center"><span>FC repos (bpm) — 14 jours</span><span>' + tierDot(hrTierNow) + '</span></div>';
      html += barChartHtml(hrSeries, { unit: " bpm", qualify: qualifyRHR });
      html += "</div>";
      html += '<div class="card"><div class="section-label" style="display:flex;justify-content:space-between;align-items:center"><span>VFC (ms) — 14 jours</span><span>' + tierDot(hrvTierNow) + '</span></div>';
      html += barChartHtml(hrvSeries, { unit: " ms", qualify: qualifyHRV });
      html += "</div>";
    }

    if (todayWearable) html += wearableCardHtml(Object.assign({}, todayWearable, { day: today }));
  } else if (dashPeriod === "semaine") {
    const last7 = []; for (let i = 6; i >= 0; i--) last7.push(daysAgo(i));
    const week7Wearable = wearable.filter(function(w){ return last7.indexOf(w.day) !== -1; });
    function dailyTrendBars(field) {
      return last7.map(function(d) {
        const w = week7Wearable.find(function(x){ return x.day === d; });
        return { label: formatDateLabel(d).slice(0,2), val: (w && w[field] != null) ? w[field] : 0 };
      });
    }
    const hasHrW = week7Wearable.some(function(w){return w.hr_resting!=null;});
    const hasHrvW = week7Wearable.some(function(w){return w.hrv_avg!=null;});
    const hasStressW = week7Wearable.some(function(w){return w.stress_avg!=null;});
    const hasSleepW = week7Wearable.some(function(w){return w.sleep_total_min!=null;});
    if (hasHrW) {
      html += '<div class="card"><div class="section-label">FC repos — 7 derniers jours</div>';
      html += barChartHtml(dailyTrendBars("hr_resting"), { unit: " bpm", qualify: qualifyRHR });
      html += "</div>";
    }
    if (hasHrvW) {
      html += '<div class="card"><div class="section-label">VFC — 7 derniers jours</div>';
      html += barChartHtml(dailyTrendBars("hrv_avg"), { unit: " ms", qualify: qualifyHRV });
      html += "</div>";
    }
    if (hasStressW) {
      html += '<div class="card"><div class="section-label">Stress — 7 derniers jours</div>';
      html += barChartHtml(dailyTrendBars("stress_avg"), { qualify: qualifyStress });
      html += "</div>";
    }
    if (hasSleepW) {
      const sleepBarsW = last7.map(function(d) {
        const w = week7Wearable.find(function(x){ return x.day === d; });
        const mins = w && w.sleep_total_min != null ? w.sleep_total_min : 0;
        return { label: formatDateLabel(d).slice(0,2), val: Math.round((mins/60)*10)/10 };
      });
      html += '<div class="card"><div class="section-label">Sommeil (h) — 7 derniers jours</div>';
      html += barChartHtml(sleepBarsW, { decimals: 1, unit: "h", qualify: qualifySleepHours });
      html += "</div>";
    }
    if (!hasHrW && !hasHrvW && !hasStressW && !hasSleepW) {
      html += '<div class="card"><div class="muted" style="text-align:center;padding:16px 0">Pas encore assez de données montre cette semaine.</div></div>';
    }

    const weekMig = monthMigraines.filter(function(m){ return last7.indexOf(m.day) !== -1; });
    if (weekMig.length > 0) {
      const avgIntensityW = avgOf(weekMig.map(function(m){ return m.intensity || 0; }));
      html += '<div class="card ' + (weekMig.length >= 2 ? "amber" : "") + '"><div class="section-label">Migraines cette semaine</div><div class="stat-row">';
      html += statHtml("Nombre", weekMig.length, weekMig.length >= 2 ? "amber" : null);
      html += statHtml("Intensité moy.", avgIntensityW.toFixed(1) + "/10");
      html += "</div></div>";
    }

    html += '<div class="card steel"><div class="muted" style="font-size:12px;text-align:center">Les données d\'entraînement de la semaine sont dans l\'onglet <b style="color:var(--chalk)">Entraînement → Tendances</b>.</div></div>';
  } else if (dashPeriod === "mois") {
    const month = []; for (let i = 29; i >= 0; i--) month.push(daysAgo(i));
    const monthSessions = sessions.filter(function(s){ return month.indexOf(s.date) !== -1; });

    // Tendances physiologiques : moyenne par tranche de ~6 jours plutôt qu'un
    // chiffre unique — pour voir l'évolution, pas juste l'état actuel.
    const monthWearableOverview = wearable.filter(function(w){ return month.indexOf(w.day) !== -1; });
    function weeklyTrendBuckets(field, decimals) {
      const b = [];
      for (let w = 0; w < 5; w++) {
        const bd = month.slice(w*6, w*6+6); if (!bd.length) continue;
        const vals = monthWearableOverview.filter(function(x){ return bd.indexOf(x.day) !== -1; }).map(function(x){return x[field];}).filter(function(v){return v!=null;});
        b.push({ label: bd[0].slice(8,10)+"-"+bd[bd.length-1].slice(8,10), val: vals.length ? avgOf(vals) : 0 });
      }
      return b;
    }
    const hasHr = monthWearableOverview.some(function(w){return w.hr_resting!=null;});
    const hasHrv = monthWearableOverview.some(function(w){return w.hrv_avg!=null;});
    const hasStress = monthWearableOverview.some(function(w){return w.stress_avg!=null;});
    const hasSleep = monthWearableOverview.some(function(w){return w.sleep_total_min!=null;});
    if (hasHr) {
      html += '<div class="card"><div class="section-label">FC repos — tendance</div>';
      html += barChartHtml(weeklyTrendBuckets("hr_resting"), { height: 56, unit: " bpm", qualify: qualifyRHR });
      html += "</div>";
    }
    if (hasHrv) {
      html += '<div class="card"><div class="section-label">VFC — tendance</div>';
      html += barChartHtml(weeklyTrendBuckets("hrv_avg"), { height: 56, unit: " ms", qualify: qualifyHRV });
      html += "</div>";
    }
    if (hasStress) {
      html += '<div class="card"><div class="section-label">Stress — tendance</div>';
      html += barChartHtml(weeklyTrendBuckets("stress_avg"), { height: 56, qualify: qualifyStress });
      html += "</div>";
    }
    if (hasSleep) {
      const sleepHourBuckets = weeklyTrendBuckets("sleep_total_min").map(function(b){ return { label: b.label, val: Math.round((b.val/60)*10)/10 }; });
      html += '<div class="card"><div class="section-label">Sommeil (h) — tendance</div>';
      html += barChartHtml(sleepHourBuckets, { decimals: 1, height: 56, unit: "h", qualify: qualifySleepHours });
      html += "</div>";
    }
    if (!hasHr && !hasHrv && !hasStress && !hasSleep) {
      html += '<div class="card"><div class="muted" style="text-align:center;padding:16px 0">Pas encore assez de données montre ce mois-ci.</div></div>';
    }

    // Migraines du mois
    const monthMig = monthMigraines.filter(function(m){ return month.indexOf(m.day) !== -1; });
    if (monthMig.length > 0) {
      const avgIntensity = avgOf(monthMig.map(function(m){ return m.intensity || 0; }));
      html += '<div class="card ' + (monthMig.length >= 3 ? "amber" : "") + '"><div class="section-label">Migraines ce mois-ci</div>';
      html += '<div class="stat-row">';
      html += statHtml("Nombre", monthMig.length, monthMig.length >= 3 ? "amber" : null);
      html += statHtml("Intensité moy.", avgIntensity.toFixed(1) + "/10");
      html += "</div></div>";
    }

    // Répartition LifeLoad du mois
    const monthLL = monthLifeload.filter(function(l){ return month.indexOf(l.day) !== -1; });
    if (monthLL.length >= 5) {
      const llCounts = {};
      monthLL.forEach(function(l){ llCounts[l.state] = (llCounts[l.state]||0) + 1; });
      const llLabels = { bien: "Bien", neutre: "Neutre", stresse: "Stressé", fatigue: "Fatigué", courbature: "Courbaturé", malade: "Malade" };
      const llColors = { bien: "green", neutre: "steel", stresse: "amber", fatigue: "amber", courbature: "amber", malade: "red" };
      html += '<div class="card"><div class="section-label">Comment tu t\'es senti ce mois-ci (' + monthLL.length + ' jour(s) renseigné(s))</div>';
      Object.keys(llCounts).sort(function(a,b){ return llCounts[b]-llCounts[a]; }).forEach(function(k) {
        const pct = Math.round((llCounts[k]/monthLL.length)*100);
        html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + (llLabels[k]||k) + '</span><span class="muted">' + llCounts[k] + " jour(s)</span></div>";
        html += '<div style="height:6px;background:var(--surfaceRaised);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--' + (llColors[k]||"steel") + ')"></div></div></div>';
      });
      html += "</div>";
    }

    html += '<div class="card steel"><div class="muted" style="font-size:12px;text-align:center">Les données d\'entraînement (charge, recommandations, comparaison par discipline) sont désormais dans l\'onglet <b style="color:var(--chalk)">Séance → Tendances</b>.</div></div>';
  }

  app.innerHTML = html;
  document.querySelectorAll('#period-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { dashPeriod = btn.dataset.period; renderDashboard(); });
  });
  document.querySelectorAll('.goto-date').forEach(function(btn) {
    btn.addEventListener("click", function() { currentDate = btn.dataset.date; currentTab = "seance"; setTab("seance"); });
  });
  document.querySelectorAll('.dismiss-flag').forEach(function(btn) {
    btn.addEventListener("click", function() {
      const d = btn.dataset.date;
      btn.textContent = "…";
      sb("dismissed_activity_flags", {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ day: d }),
      }).then(function() { renderDashboard(); }).catch(function(e) { alert("Erreur : " + e.message); });
    });
  });
  const lifeloadSelect = document.getElementById("lifeload-select");
  if (lifeloadSelect) lifeloadSelect.addEventListener("change", function() {
    const v = lifeloadSelect.value;
    if (!v) return;
    sb("lifeload", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ day: todayISO(), state: v }),
    }).then(function() { renderDashboard(); }).catch(function(e) { alert("Erreur : " + e.message); });
  });
}
// ---------------- Rendu : Sommeil ----------------
async function renderSommeil() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  let wearable = [], errorMsg = "", todayNaps = [];
  try { wearable = await listWearable(21); } catch (e) { errorMsg = e.message; }
  try { todayNaps = await sb("naps?day=eq." + todayISO() + "&select=*&order=created_at.asc") || []; } catch (e) {}

  const last14 = []; for (let i = 13; i >= 0; i--) last14.push(daysAgo(i));
  const nights = last14.map(function(d) {
    const w = wearable.find(function(x) { return x.day === d; });
    return {
      date: d, tracked: !!(w && w.sleep_session_recorded),
      total: w ? w.sleep_total_min : null, light: w ? w.sleep_light_min : null,
      deep: w ? w.sleep_deep_min : null, rem: w ? w.sleep_rem_min : null, awake: w ? w.sleep_awake_count : null,
    };
  });
  const withSleep = nights.filter(function(n) { return n.total != null; });
  const latest = withSleep.length ? withSleep[withSleep.length - 1] : null;
  const avgTotal = withSleep.length ? avgOf(withSleep.map(function(n){return n.total;})) : null;

  const sleepBars = nights.map(function(n) { return { label: formatDateLabel(n.date).slice(0,2), val: n.total ? Math.round(n.total/60*10)/10 : 0 }; });

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<h1 style="margin-bottom:4px">Sommeil</h1>';
  html += '<div class="muted" style="margin-bottom:18px">14 dernières nuits</div>';

  if (latest) {
    const h = Math.floor(latest.total / 60), m = latest.total % 60;
    // Score composite (0-100) : pénalise durée hors 7-9h et stades hors
    // fourchettes normales (mêmes seuils sourcés que les qualificatifs ci-dessous).
    let sleepScore = 100;
    const totalH = latest.total / 60;
    if (totalH < 6) sleepScore -= 35; else if (totalH < 7) sleepScore -= 12; else if (totalH > 9.5) sleepScore -= 8;
    const deepPctForScore = Math.round((latest.deep / latest.total) * 100);
    const remPctForScore = Math.round((latest.rem / latest.total) * 100);
    if (deepPctForScore < 13) sleepScore -= 15; else if (deepPctForScore > 23) sleepScore -= 5;
    if (remPctForScore < 15) sleepScore -= 15; else if (remPctForScore < 20 || remPctForScore > 25) sleepScore -= 5;
    sleepScore = Math.max(0, Math.min(100, sleepScore));
    const sleepTier = sleepScore >= 70 ? "Bon" : sleepScore >= 40 ? "Correct" : "Insuffisant";

    html += '<div class="card"><div class="section-label">Dernière nuit trackée — ' + formatDateLabel(latest.date) + '</div>';
    html += '<div style="padding:6px 0">' + circleGaugeHtml(sleepScore, 100, { sublabel: sleepTier }) + "</div>";
    html += '<div style="text-align:center;padding-top:10px;border-top:1px solid var(--line);font-size:13px"><b>' + h + 'h' + (m<10?'0':'') + m + '</b>';
    if (avgTotal != null) html += ' <span class="muted">· moyenne 14j : ' + Math.floor(avgTotal/60) + 'h' + Math.round(avgTotal%60).toString().padStart(2,'0') + '</span>';
    html += "</div></div>";
    // Fourchettes normales croisées sur plusieurs sources (Journal of Clinical
    // Sleep Medicine, méta-analyse AASM/Lancet Resp Med, CDC) : léger 45-55%,
    // profond 13-23%, paradoxal 20-25% (repère "faible" sous 15%).
    function stageQualifier(pct, low, high, veryLow) {
      if (veryLow != null && pct < veryLow) return { label: "Faible", color: "red" };
      if (pct < low) return { label: "Un peu bas", color: "amber" };
      if (pct > high) return { label: "Élevé", color: "amber" };
      return { label: "Normal", color: "green" };
    }
    const stages = [
      ["Léger", latest.light, "steel", 45, 55, null],
      ["Profond", latest.deep, "rust", 13, 23, null],
      ["Paradoxal", latest.rem, "green", 20, 25, 15],
    ];
    html += '<div class="card">';
    const stageTotal = latest.total || 1;
    stages.forEach(function(s) {
      const pct = Math.round((s[1]/stageTotal)*100);
      const sh = Math.floor(s[1]/60), sm = s[1]%60;
      const q = stageQualifier(pct, s[3], s[4], s[5]);
      html += '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>' + s[0] + '</span><span class="muted">' + sh + 'h' + (sm<10?'0':'') + sm + ' · ' + pct + '%</span></div>';
      html += '<div style="height:8px;background:var(--surfaceRaised);border-radius:4px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--' + s[2] + ')"></div></div>';
      html += '<div style="text-align:right;font-size:10px;color:var(--' + q.color + ');font-weight:700;margin-top:2px">' + q.label + "</div></div>";
    });
    if (latest.awake != null) {
      const otherAwakes = withSleep.filter(function(n) { return n.date !== latest.date && n.awake != null; }).map(function(n) { return n.awake; });
      const awakeBaseline = otherAwakes.length ? avgOf(otherAwakes) : null;
      let awakeQ = { label: "Normal", color: "green" };
      if (awakeBaseline != null) {
        const ratio = latest.awake / awakeBaseline;
        if (ratio >= 1.8) awakeQ = { label: "Élevé", color: "red" };
        else if (ratio >= 1.3) awakeQ = { label: "Un peu élevé", color: "amber" };
        else if (ratio <= 0.6) awakeQ = { label: "Faible", color: "green" };
      }
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">';
      html += '<span style="font-size:12px">Réveils détectés : <b>' + latest.awake + '</b>' + (awakeBaseline != null ? ' <span class="muted">(moy. ' + awakeBaseline.toFixed(0) + ')</span>' : '') + '</span>';
      html += '<span style="font-size:11px;font-weight:700;color:var(--' + awakeQ.color + ')">' + awakeQ.label + "</span></div>";
      if (awakeBaseline != null && latest.awake >= awakeBaseline * 1.8 && latest.awake >= 10) {
        html += '<div style="font-size:11px;color:var(--amber);margin-top:4px">Nettement plus que d\'habitude — souvent lié à une nuit agitée (douleur, stress, chaleur, alcool…). Sous cette forme de capteur (accéléromètre), ce chiffre capte tout mouvement, pas seulement de vrais réveils conscients — à lire en tendance, pas en valeur isolée.</div>';
      }
    }
    html += '<div class="muted" style="font-size:10px;margin-top:6px">Fourchettes générales pour adultes en bonne santé — varient avec l\'âge et la nuit précédente, à lire en tendance plutôt qu\'isolément.</div>';
    html += "</div>";

    // Sieste — non détectable automatiquement par la montre (pas de mécanisme
    // dédié sur Amazfit/Huami), saisie manuelle avec durées rapides.
    const totalNapMin = todayNaps.reduce(function(s, n) { return s + n.duration_min; }, 0);
    html += '<div class="card"><div class="section-label">Sieste aujourd\'hui</div>';
    if (todayNaps.length) {
      const qLabels = { bonne: "Bonne", moyenne: "Moyenne", mauvaise: "Mauvaise" };
      const qColors = { bonne: "green", moyenne: "amber", mauvaise: "red" };
      html += '<div style="margin-bottom:14px">';
      todayNaps.forEach(function(n) {
        const q = n.quality || "moyenne";
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">';
        html += '<span style="font-size:13px">✓ ' + n.duration_min + ' min <span style="color:var(--' + (qColors[q]||"steel") + ');font-size:11px;font-weight:700">· ' + (qLabels[q]||q) + '</span></span>';
        html += '<button class="nap-delete" data-id="' + n.id + '" style="background:none;border:1px solid var(--line);border-radius:6px;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;padding:4px 10px">Supprimer</button></div>';
      });
      html += '<div class="muted" style="font-size:11px;margin-top:8px">Total loggé aujourd\'hui : ' + totalNapMin + ' min</div>';
      html += "</div>";
    }
    html += '<div class="section-label" style="margin-bottom:6px">Qualité</div>';
    html += '<div class="pill-row compact" id="nap-quality-row" style="margin-bottom:16px">';
    [["bonne","Bonne"],["moyenne","Moyenne"],["mauvaise","Mauvaise"]].forEach(function(q) {
      html += '<button class="pill' + (napQuality === q[0] ? " active" : "") + '" data-quality="' + q[0] + '">' + q[1] + "</button>";
    });
    html += "</div>";
    html += '<div class="section-label" style="margin-bottom:6px">Durée</div>';
    html += '<div class="pill-row compact" id="nap-duration-row" style="margin-bottom:16px">';
    [20, 30, 45, 60].forEach(function(m) {
      html += '<button class="pill' + (napDuration === m ? " active" : "") + '" data-duration="' + m + '">' + m + ' min</button>';
    });
    html += "</div>";
    html += '<button id="nap-validate" style="width:100%;padding:13px 0;background:var(--gradient);border:none;border-radius:8px;color:var(--bg);font-size:13px;font-weight:900;letter-spacing:.3px;cursor:pointer;text-transform:uppercase">Valider la sieste</button>';
    html += "</div>";
    const sleepLines = [];
    if (totalH < 6) sleepLines.push({ tone: "warn", text: "Moins de 6h cette nuit — sous le seuil généralement associé à une récupération incomplète." });
    else if (totalH >= 7 && totalH <= 9) sleepLines.push({ tone: "good", text: "Dans la fourchette recommandée de 7-9h." });
    else if (totalH > 9) sleepLines.push({ tone: "neutral", text: "Plus long que d'habitude — peut refléter un vrai besoin de récupération après une charge élevée." });
    const deepPct = Math.round((latest.deep / latest.total) * 100);
    const remPct = Math.round((latest.rem / latest.total) * 100);
    // (qualificatifs déjà affichés directement sous chaque barre ci-dessus)
    const recentHalf = withSleep.slice(-7), olderHalf = withSleep.slice(-14, -7);
    if (recentHalf.length >= 3 && olderHalf.length >= 3) {
      const recentAvg = avgOf(recentHalf.map(function(n){return n.total;}));
      const olderAvg = avgOf(olderHalf.map(function(n){return n.total;}));
      const diffMin = recentAvg - olderAvg;
      if (diffMin <= -30) sleepLines.push({ tone: "warn", text: "Moyenne de sommeil en baisse de " + Math.round(-diffMin) + " min sur les 7 dernières nuits vs les 7 précédentes." });
      else if (diffMin >= 30) sleepLines.push({ tone: "good", text: "Moyenne de sommeil en hausse de " + Math.round(diffMin) + " min sur les 7 dernières nuits." });
    }
    const latestWearable = wearable.find(function(w){ return w.day === latest.date; });
    if (latestWearable && latestWearable.resp_rate_avg != null) {
      const respBase = avgOf(wearable.filter(function(w){ return w.day !== latest.date && w.resp_rate_avg != null; }).map(function(w){ return w.resp_rate_avg; }));
      if (respBase != null) {
        const rd = latestWearable.resp_rate_avg - respBase;
        if (rd >= 2) sleepLines.push({ tone: "warn", text: "Fréquence respiratoire nocturne au-dessus de ta moyenne (" + latestWearable.resp_rate_avg.toFixed(1) + " vs " + respBase.toFixed(1) + ") — à surveiller sur les prochaines nuits." });
      }
    }
    if (sleepLines.length) {
      html += '<div class="card"><div class="section-label">Lecture</div>';
      sleepLines.forEach(function(l) {

    }
  }

  html += '<div class="card"><div class="section-label">Durée de sommeil (h) — 14 jours</div>';
  html += barChartHtml(sleepBars, { decimals: 1, unit: "h", qualify: qualifySleepHours });
  html += "</div>";

  html += '<details class="card"><summary class="section-label" style="cursor:pointer;list-style:none">Nuits trackées</summary>';
  html += '<div style="margin-top:10px">';
  nights.slice().reverse().forEach(function(n) {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
    html += '<span style="font-size:13px">' + formatDateLabel(n.date) + "</span>";

      html += '<span class="muted" style="font-size:12px">—</span>';

    html += "</div>";
  });
  html += "</div></details>";

  html += '<div class="card steel"><div class="section-label">À savoir</div>';
  html += '<div style="font-size:11px;color:var(--chalkDim);line-height:1.5">Les stades (léger/profond/paradoxal) viennent d\'un décodage du format propriétaire de ta montre, validé contre les valeurs affichées par Zepp — fiable mais non officiellement documenté. Une nuit isolée à durée très courte (ex. sieste) peut apparaître si le capteur a mal segmenté la session.<br><br>Sur les réveils : environ 5 transitions naturelles entre cycles de sommeil sont normales chez l\'adulte sain (dont on ne se souvient généralement pas). Un accéléromètre comme ta montre capte cependant beaucoup plus de micro-mouvements que de vrais réveils conscients — le chiffre brut compte moins que sa tendance dans le temps.<br><br>Les siestes ne sont pas détectées automatiquement par ta montre (pas de mécanisme dédié sur Amazfit/Huami) — saisie manuelle nécessaire ci-dessus.</div></div>';

  app.innerHTML = html;

  document.querySelectorAll("#nap-quality-row .pill").forEach(function(btn) {
    btn.addEventListener("click", function() { napQuality = btn.dataset.quality; renderSommeil(); });

  document.querySelectorAll("#nap-duration-row .pill").forEach(function(btn) {

  const napValidateBtn = document.getElementById("nap-validate");
  if (napValidateBtn) napValidateBtn.addEventListener("click", function() {
    napValidateBtn.textContent = "Enregistrement…";

  });
  document.querySelectorAll(".nap-delete").forEach(function(btn) {
    btn.addEventListener("click", function() {
      btn.textContent = "…";
      sb("naps?id=eq." + btn.dataset.id, { method: "DELETE", headers: { Prefer: "return=minimal" } })
        .then(function() { renderSommeil(); }).catch(function(e) { alert("Erreur : " + e.message); });
    });
  });
}

// Graphique en barres lisible : valeur numérique au-dessus de chaque barre,
// libellé de jour en dessous, barre du jour le plus récent mise en valeur.
// Anneau circulaire qui se remplit selon le score — même logique de couleur
// (rouge/orange/vert) réutilisée partout où un score apparaît dans l'appli.

function scoreTierColor(pct, invert) {
  if (invert) pct = 1 - pct;
  if (pct >= 0.7) return "green";
  if (pct >= 0.4) return "amber";
  return "red";
}
function scoreTierGradient(tier) {
  const stops = { green: ["var(--greenDark)", "var(--green)"], amber: ["var(--amberDark)", "var(--amber)"], red: ["var(--redDark)", "var(--red)"] };
  return stops[tier] || stops.green;
}
let gaugeIdCounter = 0;
// Jauge horizontale façon Zepp : repère triangulaire sur une échelle de
// graduations, plutôt qu'un anneau — pour le stress notamment.
function stressGaugeHtml(value, sublabel) {
  const pct = Math.max(0, Math.min(1, value / 100));
  const tier = scoreTierColor(pct, true);
  const color = "var(--" + tier + ")";
  const tickCount = 24;
  const pointerLeft = pct * 100;
  let html = '<div style="padding:16px 2px 4px">';
  html += '<div style="position:relative;height:10px"><div style="position:absolute;left:calc(' + pointerLeft + '% - 6px);top:0;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid ' + color + ';filter:drop-shadow(0 0 5px ' + color + ')"></div></div>';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-end;height:26px;gap:2px;margin-top:2px">';
  for (let i = 0; i < tickCount; i++) {
    const tickPct = i / (tickCount - 1);
    const active = Math.abs(tickPct - pct) < (1 / tickCount);
    html += '<div style="flex:1;height:' + (active ? "100%" : "50%") + ';background:' + (active ? color : "var(--line)") + ';border-radius:2px"></div>';
  }
  html += "</div>";
  html += '<div style="display:flex;justify-content:space-between;margin-top:6px"><span class="muted" style="font-size:10px;text-transform:uppercase">Faible</span><span class="muted" style="font-size:10px;text-transform:uppercase">Élevé</span></div>';
  html += "</div>";
  html += '<div style="text-align:center;margin-top:4px"><span style="font-size:34px;font-weight:900;color:' + color + ';text-shadow:0 0 14px ' + color + '55">' + Math.round(value) + "</span>";
  if (sublabel) html += ' <span style="font-size:12px;font-weight:800;text-transform:uppercase;color:' + color + '">' + sublabel + "</span>";
  html += "</div>";
  return html;
}

function circleGaugeHtml(value, max, opts) {
  opts = opts || {};
  const size = opts.size || 140, stroke = opts.strokeWidth || 12;
  const pct = Math.max(0, Math.min(1, value / max));
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - pct);
  const tier = opts.tier || scoreTierColor(pct, opts.invert);
  const gradStops = scoreTierGradient(tier);
  const solidColor = "var(--" + tier + ")";
  const gid = "gauge-grad-" + (gaugeIdCounter++);
  let html = '<div style="position:relative;width:' + size + 'px;height:' + size + 'px;margin:0 auto">';
  html += '<svg width="' + size + '" height="' + size + '" style="transform:rotate(-90deg);overflow:visible">';
  html += '<defs><linearGradient id="' + gid + '" x1="0%" y1="0%" x2="100%" y2="100%">';
  html += '<stop offset="0%" stop-color="' + gradStops[0] + '"/><stop offset="100%" stop-color="' + gradStops[1] + '"/>';
  html += '</linearGradient></defs>';
  html += '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="var(--surfaceRaised)" stroke-width="' + stroke + '"/>';
  html += '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="url(#' + gid + ')" stroke-width="' + stroke + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" style="transition:stroke-dashoffset 0.4s;filter:drop-shadow(0 0 6px ' + solidColor + ')"/>';

  // Anneau intérieur optionnel (ex : Vigilance imbriquée dans Forme) — rose
  // fluo dédié pour bien le distinguer visuellement du rouge/orange/vert
  // utilisé pour les scores de récupération.
  if (opts.inner) {
    const gap = opts.inner.gap != null ? opts.inner.gap : 8;
    const stroke2 = opts.inner.strokeWidth || Math.round(stroke * 0.75);
    const r2 = r - stroke / 2 - gap - stroke2 / 2;
    const c2 = 2 * Math.PI * r2;
    const innerPct = Math.max(0, Math.min(1, opts.inner.value / opts.inner.max));
    const offset2 = c2 * (1 - innerPct);
    const gid2 = "gauge-grad-" + (gaugeIdCounter++);
    html += '<defs><linearGradient id="' + gid2 + '" x1="0%" y1="0%" x2="100%" y2="100%">';
    html += '<stop offset="0%" stop-color="var(--vigilanceDark)"/><stop offset="100%" stop-color="var(--vigilance)"/>';
    html += '</linearGradient></defs>';
    html += '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r2 + '" fill="none" stroke="var(--surfaceRaised)" stroke-width="' + stroke2 + '"/>';
    html += '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r2 + '" fill="none" stroke="url(#' + gid2 + ')" stroke-width="' + stroke2 + '" stroke-dasharray="' + c2 + '" stroke-dashoffset="' + offset2 + '" stroke-linecap="round" style="transition:stroke-dashoffset 0.4s;filter:drop-shadow(0 0 5px var(--vigilance))"/>';
  }

  html += '</svg>';
  html += '<div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">';
  html += '<span style="font-size:' + Math.round(size*0.26) + 'px;font-weight:900;color:var(--chalk);line-height:1;text-shadow:0 0 14px ' + solidColor + '55">' + Math.round(value) + "</span>";
  if (opts.sublabel) html += '<span style="font-size:11px;font-weight:800;text-transform:uppercase;color:' + solidColor + ';margin-top:2px">' + opts.sublabel + "</span>";
  // (le sous-libellé de l'anneau intérieur n'est plus affiché au centre —
  // trop chargé visuellement, déplacé sous "Besoin de repos" par l'appelant)
  html += "</div></div>";
  return html;
}

function barChartHtml(items, opts) {
  opts = opts || {};
  const decimals = opts.decimals || 0;
  const height = opts.height || 64;
  const unit = opts.unit || "";
  const vals = items.map(function(i) { return i.val; });
  const max = Math.max.apply(null, vals.concat([1]));
  let html = '<div style="display:flex;align-items:flex-end;gap:6px">';
  items.forEach(function(item, i) {
    const v = item.val || 0;
    const h = v > 0 ? Math.max(18, (v / max) * height) : 4;
    const isLast = i === items.length - 1;
    const barStyle = isLast && v > 0 ? "background:var(--gradient)" : "background:var(--steel);opacity:0.75";
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">';
    html += '<span style="font-size:9px;color:var(--chalkDim);white-space:nowrap">' + (v > 0 ? v.toFixed(decimals) : "–") + "</span>";
    html += '<div style="width:100%;height:' + h + 'px;' + barStyle + ';border-radius:3px 3px 1px 1px"></div>';
    html += '<span style="font-size:9px;color:var(--muted)">' + (item.label || "") + "</span>";
    html += "</div>";
  });
  html += "</div>";
  if (opts.showAvg !== false) {
    const nonZero = vals.filter(function(v) { return v > 0; });
    if (nonZero.length >= 2) {
      const avgVal = avgOf(nonZero);
      let tier = null;
      if (opts.trendQualify) tier = opts.trendQualify(items);
      else if (opts.qualify) tier = opts.qualify(avgVal);
      const avgColor = tier ? "var(--" + tier + ")" : "var(--chalk)";
      const trendNote = opts.trendQualify && tier ? (tier === "green" ? " ↗ en hausse" : tier === "red" ? " ↘ en baisse" : " → stable") : "";
      html += '<div class="muted" style="text-align:center;font-size:11px;margin-top:8px">moyenne : <b style="color:' + avgColor + '">' + avgVal.toFixed(decimals) + unit + "</b>" + trendNote + "</div>";
    }
  }
  return html;
}

// Seuils déjà utilisés ailleurs dans l'appli (stress 0-100 Zepp ; sommeil 7-9h
// optimal) — réutilisés ici pour rester cohérent, pas de nouveau seuil inventé.
function qualifyStress(v) { return v >= 50 ? "red" : v >= 30 ? "amber" : "green"; }
// Seuils calibrés pour un homme de 42 ans (profil connu), croisés sur deux
// tableaux normatifs indépendants (population US, revues cliniques). Pas
// universels — recalibrer si le profil change.
function qualifyRHR(v) { return v >= 83 ? "red" : v >= 71 ? "amber" : "green"; }
function qualifyHRV(v) { return v < 20 ? "red" : v < 40 ? "amber" : "green"; }

// Pour la charge d'entraînement : pas de "bon" chiffre absolu, mais dans une
// logique de progression long terme (sans pic de compétition visé), la
// direction de la tendance a du sens — hausse soutenue = progression, plat/
// baisse = stagnation ou surcharge à surveiller selon le contexte.
function qualifySleepHours(v) { return v < 6 ? "red" : (v < 7 || v > 9.5) ? "amber" : "green"; }

// ---------------- Rendu : Migraine ----------------
const TRIGGERS = [
  { id: "stress", label: "Stress" },
  { id: "sommeil", label: "Sommeil insuffisant/perturbé" },
  { id: "effort", label: "Effort intense/soudain" },
  { id: "ecrans", label: "Écrans prolongés" },
  { id: "deshydratation", label: "Déshydratation" },
  { id: "repas", label: "Repas sauté" },
  { id: "cervical", label: "Tension nerveuse/cervicale" },
  { id: "meteo", label: "Météo" },
  { id: "alcool", label: "Alcool" },
  { id: "hormonal", label: "Hormonal" },
];

function nowForDatetimeInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
let migraineForm = { startDateTime: nowForDatetimeInput(), endDateTime: "", intensity: 5, triggers: [], notes: "" };
let migraineSubTab = "logger";

async function getWearableForDate2(dateStr) {
  const rows = await sb("wearable_daily?day=eq." + dateStr + "&select=*");
  return rows && rows[0] ? rows[0] : null;
}

let migraineState = { history: [], allWearable: [], sessions: [], errorMsg: "" };

async function loadMigraine() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  migraineState.errorMsg = "";
  try {
    migraineState.history = await sb("migraines?select=*&order=day.desc&limit=60") || [];
  } catch (e) { migraineState.errorMsg = e.message; }
  try { migraineState.allWearable = await listWearable(90); } catch (e) {}
  try { migraineState.sessions = await listSessions(90); } catch (e) {}
  drawMigraine();
}

function drawMigraine() {
  const app = document.getElementById("app");
  const history = migraineState.history, allWearable = migraineState.allWearable, errorMsg = migraineState.errorMsg;

  // Contexte automatique du jour sélectionné dans le formulaire
  const formDay = migraineForm.startDateTime.slice(0, 10);
  const ctx = allWearable.find(function(w) { return w.day === formDay; }) || null;
  const sessionCtxLoad = migraineState.sessions.filter(function(s) { return s.date === formDay; }).reduce(function(s,x){ return s + (x.correctedLoad || 0); }, 0);

  // Fréquence des déclencheurs déclarés
  const triggerCounts = {};
  history.forEach(function(m) {
    (m.triggers || []).forEach(function(t) { triggerCounts[t] = (triggerCounts[t] || 0) + 1; });
  });
  const sortedTriggers = Object.keys(triggerCounts).sort(function(a, b) { return triggerCounts[b] - triggerCounts[a]; });

  // Corrélation objective : compare tes données mesurées les jours de migraine
  // vs les autres jours, plutôt que de se fier uniquement à ce que tu coches.
  const migraineDays = history.map(function(m) { return m.day; });
  const migraineWearable = allWearable.filter(function(w) { return migraineDays.indexOf(w.day) !== -1; });
  const otherWearable = allWearable.filter(function(w) { return migraineDays.indexOf(w.day) === -1; });
  function avgField(arr, field) {
    const vals = arr.map(function(w) { return w[field]; }).filter(function(v) { return v != null; });
    return vals.length ? avgOf(vals) : null;
  }
  const correlations = [
    ["Sommeil (nuit précédente)", "sleep_total_min", "min", 1],
    ["Stress", "stress_avg", "", 0],
    ["VFC", "hrv_avg", "ms", 0],
    ["FC repos", "hr_resting", "bpm", 0],
  ].map(function(c) {
    const migAvg = avgField(migraineWearable, c[1]);
    const otherAvg = avgField(otherWearable, c[1]);
    return { label: c[0], migAvg: migAvg, otherAvg: otherAvg, unit: c[2] };
  }).filter(function(c) { return c.migAvg != null && c.otherAvg != null; });

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<h1 style="margin-bottom:4px">Migraine</h1>';
  html += '<div class="muted" style="margin-bottom:18px">Journal et déclencheurs potentiels</div>';

  html += '<div class="pill-row compact" id="migraine-subtab-row" style="margin-bottom:16px">';
  html += '<button class="pill' + (migraineSubTab === "logger" ? " active" : "") + '" data-subtab="logger">Logger</button>';
  html += '<button class="pill' + (migraineSubTab === "historique" ? " active" : "") + '" data-subtab="historique">Historique & tendances</button>';
  html += "</div>";

  if (migraineSubTab === "logger") {
  html += '<div class="card">';
  html += '<div class="section-label">Nouvelle entrée</div>';
  html += '<div class="muted" style="font-size:10px;text-transform:uppercase;margin-bottom:4px">Début</div>';
  html += '<input type="datetime-local" id="mig-start" value="' + migraineForm.startDateTime + '" max="' + nowForDatetimeInput() + '" style="margin-bottom:10px" />';
  html += '<div class="muted" style="font-size:10px;text-transform:uppercase;margin-bottom:4px">Fin (laisser vide si en cours)</div>';
  html += '<input type="datetime-local" id="mig-end" value="' + migraineForm.endDateTime + '" max="' + nowForDatetimeInput() + '" style="margin-bottom:14px" />';

  if (ctx || sessionCtxLoad) {
    html += '<div style="background:var(--surfaceRaised);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:var(--chalkDim)">';
    html += '<div class="muted" style="font-size:10px;text-transform:uppercase;margin-bottom:4px">Contexte ce jour-là</div>';
    const parts = [];
    if (ctx && ctx.sleep_total_min != null) parts.push("Sommeil " + Math.floor(ctx.sleep_total_min/60) + "h" + (ctx.sleep_total_min%60).toString().padStart(2,'0'));
    if (ctx && ctx.stress_avg != null) parts.push("Stress " + Math.round(ctx.stress_avg));
    if (ctx && ctx.hrv_avg != null) parts.push("VFC " + Math.round(ctx.hrv_avg) + "ms");
    if (sessionCtxLoad) parts.push("Charge " + sessionCtxLoad);
    html += parts.length ? parts.join(" · ") : "Pas de données montre pour ce jour.";
    html += "</div>";
  }

  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="section-label" style="margin:0">Intensité</span><span class="rpe-value">' + migraineForm.intensity + "</span></div>";
  html += rpeLadderHtml("migraine", migraineForm.intensity);

  html += '<div class="section-label" style="margin-top:14px">Déclencheurs potentiels</div><div class="pill-row compact" style="flex-wrap:wrap;gap:6px">';
  TRIGGERS.forEach(function(t) {
    const on = migraineForm.triggers.indexOf(t.id) !== -1;
    html += '<button class="pill mig-trigger' + (on ? " active" : "") + '" data-id="' + t.id + '" style="flex:none;padding:7px 10px">' + t.label + "</button>";
  });
  html += "</div>";

  html += '<div class="section-label" style="margin-top:14px">Notes</div>';
  html += '<input type="text" id="mig-notes" placeholder="Contexte, symptômes associés…" value="' + esc(migraineForm.notes) + '" style="margin-bottom:14px" />';

  html += '<button id="mig-save" style="margin-top:0;width:100%;padding:13px 0;background:var(--gradient);border:none;border-radius:8px;color:var(--bg);font-size:13px;font-weight:900;letter-spacing:.3px;cursor:pointer;text-transform:uppercase">Enregistrer</button>';
  html += "</div>";
  } else {

  if (correlations.length > 0 && history.length >= 3) {
    html += '<div class="card steel"><div class="section-label">Corrélation objective (' + history.length + ' migraine(s) vs autres jours)</div>';
    correlations.forEach(function(c) {
      const diff = c.migAvg - c.otherAvg;
      const diffPct = c.otherAvg ? Math.round((diff / c.otherAvg) * 100) : null;
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">';
      html += '<span style="font-size:12px">' + c.label + "</span>";
      html += '<span style="font-size:12px;color:var(--chalkDim)">' + c.migAvg.toFixed(1) + c.unit + ' <span class="muted">vs ' + c.otherAvg.toFixed(1) + c.unit + "</span>";
      if (diffPct != null && Math.abs(diffPct) >= 10) html += ' <b style="color:var(--' + (diffPct < 0 ? "red" : "amber") + ')">(' + (diffPct > 0 ? "+" : "") + diffPct + "%)</b>";
      html += "</span></div>";
    });
    html += '<div class="muted" style="font-size:10px;margin-top:6px">Comparaison directe de tes données mesurées, pas juste des cases cochées — corrélation, pas forcément causalité (n=' + history.length + ').</div></div>';
  }

  if (sortedTriggers.length > 0) {
    const maxCount = triggerCounts[sortedTriggers[0]];
    html += '<div class="card amber"><div class="section-label">Déclencheurs les plus fréquents (' + history.length + ' entrée(s))</div>';
    sortedTriggers.slice(0, 6).forEach(function(tid) {
      const t = TRIGGERS.find(function(x) { return x.id === tid; });
      const pct = Math.round((triggerCounts[tid] / maxCount) * 100);
      html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>' + (t ? t.label : tid) + '</span><span class="muted">' + triggerCounts[tid] + "×</span></div>";
      html += '<div style="height:6px;background:var(--surfaceRaised);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:var(--amber)"></div></div></div>';
    });
    html += '<div class="muted" style="font-size:10px;margin-top:4px">Fréquence déclarative — une corrélation répétée mérite d\'en parler à un médecin, elle ne remplace pas un diagnostic.</div></div>';
  }

  html += '<div class="card"><div class="section-label">Historique (' + history.length + ")</div>";
  if (history.length === 0) html += '<div class="muted" style="text-align:center;padding:16px 0">Aucune entrée pour l\'instant.</div>';
  history.forEach(function(m) {
    html += '<div style="padding:8px 0;border-bottom:1px solid var(--line)">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center">';
    html += '<span style="font-weight:700;font-size:13px">' + formatDateLabel(m.day) + '</span>';
    html += '<div style="display:flex;align-items:center;gap:10px"><span style="color:var(--rust);font-weight:800">' + (m.intensity || "–") + '/10</span>';
    html += '<button class="mig-delete" data-id="' + m.id + '" data-day="' + esc(formatDateLabel(m.day)) + '" style="background:none;border:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:2px 4px">✕</button></div>';
    html += "</div>";
    if (m.start_time) {
      const st = new Date(m.start_time);
      let timeLabel = "Début " + st.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      if (m.end_time) {
        const et = new Date(m.end_time);
        timeLabel += " → " + et.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        if (et.toDateString() !== st.toDateString()) timeLabel += " (+1j)";
        if (m.duration_min) timeLabel += " · " + Math.floor(m.duration_min/60) + "h" + (m.duration_min%60).toString().padStart(2,'0');
      }
      html += '<div class="muted" style="font-size:11px;margin-top:2px">' + timeLabel + "</div>";
    }
    if (m.triggers && m.triggers.length) {
      html += '<div style="margin-top:4px">';
      m.triggers.forEach(function(tid) {
        const t = TRIGGERS.find(function(x) { return x.id === tid; });
        html += '<span class="badge">' + (t ? t.label : tid) + "</span>";
      });
      html += "</div>";
    }
    if (m.notes) html += '<div class="muted" style="font-size:11px;margin-top:4px">' + esc(m.notes) + "</div>";
    html += "</div>";
  });
  html += "</div>";
  }

  app.innerHTML = html;
  wireMigraineEvents();
}

function wireMigraineEvents() {
  document.querySelectorAll('#migraine-subtab-row .pill').forEach(function(btn) {
    btn.addEventListener("click", function() { migraineSubTab = btn.dataset.subtab; drawMigraine(); });
  });

  const startInput = document.getElementById("mig-start");
  if (startInput) startInput.addEventListener("change", function() { migraineForm.startDateTime = startInput.value; drawMigraine(); });
  const endInput = document.getElementById("mig-end");
  if (endInput) endInput.addEventListener("change", function() { migraineForm.endDateTime = endInput.value; });

  document.querySelectorAll(".mig-delete").forEach(function(btn) {
    btn.addEventListener("click", function() {
      if (!confirm("Supprimer l'entrée du " + btn.dataset.day + " ?")) return;
      const id = btn.dataset.id;
      btn.textContent = "…";
      sb("migraines?id=eq." + id, { method: "DELETE", headers: { Prefer: "return=minimal" } })
        .then(function() { loadMigraine(); })
        .catch(function(e) { alert("Erreur : " + e.message); });
    });
  });

  document.querySelectorAll('.rpe-ladder[data-scope="migraine"] .rpe-bar').forEach(function(btn) {
    btn.addEventListener("click", function() {
      migraineForm.intensity = Number(btn.dataset.n);
      drawMigraine();
    });
  });

  document.querySelectorAll(".mig-trigger").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const id = btn.dataset.id;
      const idx = migraineForm.triggers.indexOf(id);
      if (idx === -1) migraineForm.triggers.push(id); else migraineForm.triggers.splice(idx, 1);
      drawMigraine();
    });
  });

  const notesInput = document.getElementById("mig-notes");
  if (notesInput) notesInput.addEventListener("input", function() { migraineForm.notes = notesInput.value; });

  const saveBtn = document.getElementById("mig-save");
  if (saveBtn) saveBtn.addEventListener("click", function() {
    saveBtn.textContent = "Enregistrement…";
    if (!migraineForm.startDateTime) { saveBtn.textContent = "Indique au moins une heure de début"; return; }
    const startTs = new Date(migraineForm.startDateTime);
    let endTs = null, durationMin = null;
    if (migraineForm.endDateTime) {
      endTs = new Date(migraineForm.endDateTime);
      durationMin = Math.round((endTs - startTs) / 60000);
    }
    sb("migraines", {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify({
        day: migraineForm.startDateTime.slice(0, 10), intensity: migraineForm.intensity,
        triggers: migraineForm.triggers, notes: migraineForm.notes || null,
        start_time: startTs.toISOString(),
        end_time: endTs ? endTs.toISOString() : null,
        duration_min: durationMin,
      }),
    }).then(function() {
      migraineForm = { startDateTime: nowForDatetimeInput(), endDateTime: "", intensity: 5, triggers: [], notes: "" };
      loadMigraine();
    }).catch(function(e) {
      saveBtn.textContent = "Erreur : " + e.message;
    });
  });
}

// ---------------- Rendu : Vie (indicateurs de santé long terme) ----------------
async function renderVie() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="muted">Chargement…</div>';
  let wearable = [], workouts = [], trips = [], errorMsg = "";
  try { wearable = await listWearable(60); } catch (e) { errorMsg = e.message; }
  try { workouts = await sb("workout_sessions?select=start_time,hrr_1min,duration_min,training_effect_aerobic,training_effect_anaerobic&activity_type=eq.seance&order=start_time.asc&limit=200") || []; } catch (e) {}
  try { trips = await sb("workout_sessions?select=start_time,duration_min,calories&activity_type=eq.trajet&order=start_time.desc&limit=60") || []; } catch (e) {}

  let html = "";
  if (errorMsg) html += '<div class="error-banner"><b>Erreur :</b> ' + esc(errorMsg) + "</div>";
  html += '<h1 style="margin-bottom:4px">Santé</h1>';
  html += '<div class="muted" style="margin-bottom:18px">Indicateurs de santé à lire sur la durée, pas au jour le jour</div>';

  // PAI (Personal Activity Intelligence) — validé par l'étude HUNT (Norvège,
  // >1M personnes-années), répliqué aux USA (Aerobics Center Longitudinal
  // Study) et en Chine (China Kadoorie Biobank, 443 792 participants).
  // ≥100/semaine associé à -17 à -36% de risque de mortalité cardiovasculaire,
  // sans bénéfice supplémentaire au-delà de 100 — donc pas un objectif à
  // maximiser indéfiniment, juste à atteindre régulièrement.
  const last28 = []; for (let i = 27; i >= 0; i--) last28.push(daysAgo(i));
  const weeks = [[0,7],[7,14],[14,21],[21,28]];
  const weekBars = weeks.map(function(w, idx) {
    const days = last28.slice(w[0], w[1]);
    const wData = wearable.filter(function(x){ return days.indexOf(x.day) !== -1; });
    const total = wData.reduce(function(s, x){ return s + (x.pai_low||0) + (x.pai_moderate||0) + (x.pai_high||0); }, 0);
    return { label: idx === 0 ? "cette sem." : "-" + idx + "sem", val: Math.round(total) };
  }).reverse();

  const pai7 = wearable.filter(function(w){ return w.day >= daysAgo(6); });
  const weeklyPai = pai7.reduce(function(s, w){ return s + (w.pai_low||0) + (w.pai_moderate||0) + (w.pai_high||0); }, 0);
  const paiColor = weeklyPai >= 100 ? "green" : weeklyPai >= 50 ? "amber" : "red";

  html += '<div class="card"><div class="section-label">PAI — cette semaine</div>';
  html += '<div style="padding:6px 0">' + circleGaugeHtml(Math.min(weeklyPai, 100), 100, { sublabel: weeklyPai >= 100 ? "Objectif atteint" : "/ 100" }) + "</div>";
  if (weeklyPai > 100) html += '<div class="muted" style="text-align:center;font-size:11px;margin-top:4px">Score réel : ' + Math.round(weeklyPai) + " (au-delà de 100, pas de bénéfice supplémentaire mesuré)</div>";
  html += "</div>";

  html += '<div class="card"><div class="section-label">Tendance — 4 dernières semaines</div>';
  html += barChartHtml(weekBars, { height: 56 });
  html += "</div>";

  // HRR (heart rate recovery) — validée depuis 1999 (NEJM, 2428 patients,
  // 6 ans de suivi) et confirmée par méta-analyse (Qiu et al. 2017). Mais deux
  // conditions ne sont pas vérifiables avec nos données : que l'effort qui
  // précède soit réel (pas juste une activité brève/légère), et que la
  // personne reste immobile juste après (sinon la FC reste artificiellement
  // haute). On filtre la première condition ; la seconde reste un vrai angle
  // mort — d'où l'absence de code couleur clinique ici.
  const hrrRows = workouts.filter(function(w){
    if (w.hrr_1min == null) return false;
    const te = (Number(w.training_effect_aerobic) || 0) + (Number(w.training_effect_anaerobic) || 0);
    return w.duration_min >= 15 && te >= 1.0;
  });
  if (hrrRows.length >= 3) {
    const hrrTrendBars = hrrRows.slice(-12).map(function(w) {
      return { label: formatDateLabel(w.start_time.slice(0,10)).slice(0,2), val: w.hrr_1min };
    });
    html += '<div class="card"><div class="section-label">Récupération cardiaque (HRR, 1min) — après effort réel</div>';
    html += barChartHtml(hrrTrendBars, { unit: " bpm" });
    html += '<div class="muted" style="font-size:10px;margin-top:8px">Séances courtes/sans effet d\'entraînement exclues. Reste approximatif : capteur poignet moins précis qu\'une ceinture ECG, et on ne sait pas si tu es resté immobile juste après l\'effort (sinon la FC reste artificiellement haute et fausse la mesure) — à ne pas surinterpréter sans un vrai protocole (effort soutenu puis arrêt complet 2 min).</div></div>';
  } else if (hrrRows.length > 0 || workouts.some(function(w){return w.hrr_1min != null;})) {
    html += '<div class="card"><div class="section-label">Récupération cardiaque (HRR)</div><div class="muted" style="font-size:12px;text-align:center;padding:8px 0">Pas encore assez de séances avec un effort réel et un signal fiable pour en tirer une tendance.</div></div>';
  }

  // Trajets actifs (vélo) — détectés automatiquement (créneaux + durée
  // habituels), exclus des zones/effet d'entraînement (ce ne sont pas des
  // séances), mais leur coût réel reste réel : suivi séparé, pas ignoré.
  if (trips.length > 0) {
    const last7Trips = trips.filter(function(t) { return t.start_time >= daysAgo(6); });
    const totalMin = last7Trips.reduce(function(s,t){ return s + (t.duration_min||0); }, 0);
    const totalCal = last7Trips.reduce(function(s,t){ return s + (t.calories||0); }, 0);
    html += '<div class="card"><div class="section-label">Trajets actifs (vélo) — 7 derniers jours</div><div class="stat-row">';
    html += statHtml("Trajets", last7Trips.length);
    html += statHtml("Temps total", totalMin + " min");
    html += statHtml("Calories", totalCal || "–");
    html += "</div>";
    html += '<div class="muted" style="font-size:10px;margin-top:8px">Détectés automatiquement (créneaux et durées habituels), exclus des zones cardiaques et de l\'effet d\'entraînement — ce ne sont pas des séances. Mais l\'effort qu\'ils représentent est réel et compte déjà dans ton PAI (calculé sur toute activité cardiaque, pas seulement l\'entraînement structuré).</div></div>';
  }

  html += '<div class="card steel"><div class="section-label">À savoir</div>';
  html += '<div style="font-size:12px;color:var(--chalkDim);line-height:1.6">Le PAI traduit ta fréquence cardiaque pendant l\'activité en un score personnalisé sur 7 jours glissants. Atteindre <b style="color:var(--chalk)">100 PAI/semaine</b> est associé à 17-36% de réduction du risque de mortalité cardiovasculaire (étude HUNT, Norvège — plus d\'1 million de personnes-années de suivi), résultat répliqué indépendamment aux États-Unis et en Chine. Aucun bénéfice supplémentaire mesuré au-delà de 100 — l\'objectif est de l\'atteindre régulièrement, pas de le maximiser.<br><br>Contrairement au score Forme (qui reflète ta récupération du jour), le PAI est un indicateur de santé cardiovasculaire de long terme — un score bas ne veut pas dire "repose-toi", mais plutôt "bouge un peu plus cette semaine".</div></div>';

  app.innerHTML = html;
}

function tierDot(tier) {
  if (!tier || tier === "steel") return "";
  return '<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--' + tier + ');box-shadow:0 0 6px 2px var(--' + tier + '),0 0 2px var(--' + tier + ')"></span>';
}
function statHtml(label, value, color) {
  return '<div class="stat"><div class="stat-label">' + label + '</div><div class="stat-value"' + (color ? ' style="color:var(--'+color+')"' : '') + '>' + value + "</div></div>";
}

// ---------------- Navigation ----------------
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab[data-tab]").forEach(function(t) { t.classList.toggle("active", t.dataset.tab === tab); });
  if (tab === "seance") loadSeance();
  else if (tab === "dashboard") renderDashboard();
  else if (tab === "sommeil") renderSommeil();
  else if (tab === "migraine") loadMigraine();
  else renderVie();
}
async function loadCoefficients() {
  try {
    const rows = await sb("training_coefficients?select=*");
    (rows || []).forEach(function(r) {
      if (r.category === "neural") {
        const themeId = r.key.replace("neural_", "");
        const t = THEMES.find(function(x) { return x.id === themeId; });
        if (t) t.neural = Number(r.value);
      } else if (r.category === "tendino") {
        const themeId = r.key.replace("tendino_", "");
        const t = THEMES.find(function(x) { return x.id === themeId; });
        if (t) t.tendino = Number(r.value);
      } else if (r.category === "contraction") {
        const id = r.key.replace("contraction_", "");
        if (CONTRACTION_FACTORS[id] != null) CONTRACTION_FACTORS[id] = Number(r.value);
      } else if (r.category === "goal") {
        const id = r.key.replace("goal_", "");
        if (GOAL_FACTORS[id] != null) GOAL_FACTORS[id] = Number(r.value);
      } else if (r.category === "niveau") {
        const id = r.key.replace("niveau_", "");
        if (NIVEAU_FACTORS[id] != null) NIVEAU_FACTORS[id] = Number(r.value);
      }
    });
  } catch (e) {
    // Repli silencieux sur les valeurs par défaut codées en dur si le réseau
    // ou la table ne répond pas — l'appli doit rester utilisable.
  }
}

document.querySelectorAll(".tab[data-tab]").forEach(function(t) {
  t.addEventListener("click", function() { setTab(t.dataset.tab); });
});
document.getElementById("refresh-btn").addEventListener("click", function() {
  const btn = this;
  btn.style.transform = "rotate(360deg)";
  btn.style.transition = "transform 0.5s";
  setTab(currentTab);
  setTimeout(function() { btn.style.transform = ""; }, 500);
});
loadCoefficients().then(function() { setTab("dashboard"); });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() { navigator.serviceWorker.register("sw.js").catch(function() {}); });
}
</script>
